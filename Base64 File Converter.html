<!DOCTYPE html> <html lang="en"> <head> <meta charset="UTF-8"> <meta name="viewport" content="width=device-width, initial-scale=1.0"> <title>Base64 File Converter</title> <style> body{font-family:Arial, sans-serif;max-width:600px;margin:40px auto;padding:20px;border:1px solid #ccc;border-radius:8px} h1{text-align:center} input[type=file]{margin:20px 0} textarea{width:100%;height:200px;margin-top:10px} button{margin-top:10px;padding:10px 20px;cursor:pointer} </style> </head> <body> <h1>Base64 File Converter</h1> <input type="file" id="fileInput" accept="*/*"> <textarea id="output" placeholder="Base64 output will appear here..." readonly></textarea> <button id="copyBtn">Copy to Clipboard</button> <script> const fileInput=document.getElementById('fileInput'); const output=document.getElementById('output'); const copyBtn=document.getElementById('copyBtn'); fileInput.addEventListener('change',()=>{ const file=fileInput.files[0]; if(!file)return; if(file.size>20*1024*1024){alert('File too large (max 20 MB)');return;} const reader=new FileReader(); reader.onload=()=>{output.value=reader.result.split(',')[1];}; reader.readAsDataURL(file); }); copyBtn.addEventListener('click',()=>{ output.select(); document.execCommand('copy'); alert('Base64 copied to clipboard'); }); </script> </body> </html>
