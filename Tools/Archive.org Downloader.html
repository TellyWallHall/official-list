<!doctype html>
<html lang="en" class="h-full">
 <head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Archive File Downloader</title>
  <script src="https://cdn.tailwindcss.com/3.4.17"></script>
  <script src="/_sdk/element_sdk.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&amp;family=Space+Grotesk:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
  <style>
    .font-display { font-family: 'Space Grotesk', sans-serif; }
    .font-mono { font-family: 'JetBrains Mono', monospace; }
    
    @keyframes pulse-glow {
      0%, 100% { box-shadow: 0 0 20px rgba(34, 197, 94, 0.3); }
      50% { box-shadow: 0 0 40px rgba(34, 197, 94, 0.6); }
    }
    
    .downloading { animation: pulse-glow 1.5s ease-in-out infinite; }
    
    @keyframes slide-up {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }
    
    .animate-slide-up {
      animation: slide-up 0.4s ease-out forwards;
    }
    
    .file-item:nth-child(1) { animation-delay: 0.05s; }
    .file-item:nth-child(2) { animation-delay: 0.1s; }
    .file-item:nth-child(3) { animation-delay: 0.15s; }
    .file-item:nth-child(4) { animation-delay: 0.2s; }
    .file-item:nth-child(5) { animation-delay: 0.25s; }
  </style>
  <style>body { box-sizing: border-box; }</style>
  <script src="/_sdk/data_sdk.js" type="text/javascript"></script>
 </head>
 <body class="h-full bg-slate-950 text-slate-100 font-display">
  <div id="app-container" class="h-full w-full overflow-auto">
   <div class="min-h-full w-full bg-gradient-to-br from-slate-950 via-slate-900 to-emerald-950 p-6">
    <div class="max-w-4xl mx-auto"><!-- Header -->
     <header class="text-center mb-10 pt-6">
      <div class="inline-flex items-center gap-3 mb-4">
       <div class="w-12 h-12 rounded-xl bg-gradient-to-br from-emerald-500 to-teal-600 flex items-center justify-center shadow-lg shadow-emerald-500/20">
        <svg class="w-7 h-7 text-white" fill="none" stroke="currentColor" viewbox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 16a4 4 0 01-.88-7.903A5 5 0 1115.9 6L16 6a5 5 0 011 9.9M9 19l3 3m0 0l3-3m-3 3V10" />
        </svg>
       </div>
       <h1 id="app-title" class="text-3xl font-bold bg-gradient-to-r from-emerald-400 to-teal-300 bg-clip-text text-transparent">Archive Downloader</h1>
      </div>
      <p class="text-slate-400 text-sm">Download files from Internet Archive with ease</p>
     </header><!-- Input Section -->
     <div class="bg-slate-900/60 backdrop-blur-sm rounded-2xl border border-slate-800 p-6 mb-6"><label for="archive-url" class="block text-sm font-medium text-slate-300 mb-3"> Internet Archive URL </label>
      <div class="flex gap-3"><input type="url" id="archive-url" placeholder="https://archive.org/details/example-item" class="flex-1 bg-slate-800/80 border border-slate-700 rounded-xl px-4 py-3 text-slate-100 placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-emerald-500/50 focus:border-emerald-500 transition-all font-mono text-sm"> <button id="fetch-btn" onclick="fetchArchiveFiles()" class="px-6 py-3 bg-gradient-to-r from-emerald-600 to-teal-600 hover:from-emerald-500 hover:to-teal-500 text-white font-semibold rounded-xl transition-all shadow-lg shadow-emerald-500/20 hover:shadow-emerald-500/40 flex items-center gap-2">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewbox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" />
        </svg> Fetch Files </button>
      </div>
      <p class="text-xs text-slate-500 mt-3">Paste a link like: https://archive.org/details/your-item-name</p>
     </div><!-- Status Message -->
     <div id="status-container" class="hidden mb-6">
      <div id="status-message" class="bg-slate-900/60 backdrop-blur-sm rounded-xl border border-slate-800 p-4 text-center"></div>
     </div><!-- Files List -->
     <div id="files-container" class="hidden">
      <div class="flex items-center justify-between mb-4">
       <h2 class="text-xl font-semibold text-slate-200">Available Files</h2><span id="file-count" class="text-sm text-slate-400"></span>
      </div>
      <div id="files-list" class="space-y-3"></div>
     </div><!-- Downloaded File Preview -->
     <div id="download-preview" class="hidden mt-6">
      <div class="bg-gradient-to-br from-emerald-900/40 to-teal-900/40 backdrop-blur-sm rounded-2xl border border-emerald-700/50 p-6">
       <div class="flex items-center gap-3 mb-4">
        <div class="w-10 h-10 rounded-lg bg-emerald-500/20 flex items-center justify-center">
         <svg class="w-6 h-6 text-emerald-400" fill="none" stroke="currentColor" viewbox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7" />
         </svg>
        </div>
        <div>
         <h3 class="font-semibold text-emerald-300">File Ready</h3>
         <p id="downloaded-filename" class="text-sm text-slate-400 font-mono"></p>
        </div>
       </div>
       <div class="flex items-center gap-3 mb-4"><span class="text-sm text-slate-400">Size:</span> <span id="downloaded-size" class="text-sm text-emerald-400 font-mono"></span>
       </div><button id="save-btn" onclick="saveToDevice()" class="w-full py-3 bg-gradient-to-r from-emerald-500 to-teal-500 hover:from-emerald-400 hover:to-teal-400 text-white font-semibold rounded-xl transition-all shadow-lg shadow-emerald-500/30 hover:shadow-emerald-500/50 flex items-center justify-center gap-2">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewbox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7H5a2 2 0 00-2 2v9a2 2 0 002 2h14a2 2 0 002-2V9a2 2 0 00-2-2h-3m-1 4l-3 3m0 0l-3-3m3 3V4" />
        </svg> Save to Device </button>
      </div>
     </div>
    </div>
   </div>
  </div>
  <script>
    // Try multiple CORS proxies in order of preference
    const CORS_PROXIES = [
      'https://corsproxy.io/?',
      'https://api.allorigins.win/raw?url=',
      'https://cors-anywhere.herokuapp.com/'
    ];
    let CORS_PROXY = CORS_PROXIES[0];
    let downloadedBlob = null;
    let downloadedFilename = '';

    const defaultConfig = {
      app_title: 'Archive Downloader',
      background_color: '#020617',
      surface_color: '#0f172a',
      text_color: '#e2e8f0',
      primary_action: '#10b981',
      secondary_action: '#14b8a6',
      font_family: 'Space Grotesk',
      font_size: 16
    };

    async function onConfigChange(config) {
      const title = config.app_title || defaultConfig.app_title;
      document.getElementById('app-title').textContent = title;
      document.title = title;
    }

    function mapToCapabilities(config) {
      return {
        recolorables: [
          {
            get: () => config.background_color || defaultConfig.background_color,
            set: (v) => { config.background_color = v; window.elementSdk.setConfig({ background_color: v }); }
          },
          {
            get: () => config.surface_color || defaultConfig.surface_color,
            set: (v) => { config.surface_color = v; window.elementSdk.setConfig({ surface_color: v }); }
          },
          {
            get: () => config.text_color || defaultConfig.text_color,
            set: (v) => { config.text_color = v; window.elementSdk.setConfig({ text_color: v }); }
          },
          {
            get: () => config.primary_action || defaultConfig.primary_action,
            set: (v) => { config.primary_action = v; window.elementSdk.setConfig({ primary_action: v }); }
          },
          {
            get: () => config.secondary_action || defaultConfig.secondary_action,
            set: (v) => { config.secondary_action = v; window.elementSdk.setConfig({ secondary_action: v }); }
          }
        ],
        borderables: [],
        fontEditable: {
          get: () => config.font_family || defaultConfig.font_family,
          set: (v) => { config.font_family = v; window.elementSdk.setConfig({ font_family: v }); }
        },
        fontSizeable: {
          get: () => config.font_size || defaultConfig.font_size,
          set: (v) => { config.font_size = v; window.elementSdk.setConfig({ font_size: v }); }
        }
      };
    }

    function mapToEditPanelValues(config) {
      return new Map([
        ['app_title', config.app_title || defaultConfig.app_title]
      ]);
    }

    if (window.elementSdk) {
      window.elementSdk.init({
        defaultConfig,
        onConfigChange,
        mapToCapabilities,
        mapToEditPanelValues
      });
    }

    function showStatus(message, type = 'info') {
      const container = document.getElementById('status-container');
      const statusEl = document.getElementById('status-message');
      
      container.classList.remove('hidden');
      
      const colors = {
        info: 'text-slate-300 border-slate-700',
        loading: 'text-amber-300 border-amber-700/50',
        success: 'text-emerald-300 border-emerald-700/50',
        error: 'text-red-300 border-red-700/50'
      };
      
      statusEl.className = `bg-slate-900/60 backdrop-blur-sm rounded-xl border p-4 text-center ${colors[type]}`;
      statusEl.innerHTML = message;
    }

    function hideStatus() {
      document.getElementById('status-container').classList.add('hidden');
    }

    function extractIdentifier(url) {
      const match = url.match(/archive\.org\/(?:details|download)\/([^\/\?]+)/);
      return match ? match[1] : null;
    }

    async function fetchArchiveFiles() {
      const urlInput = document.getElementById('archive-url');
      const url = urlInput.value.trim();
      
      if (!url) {
        showStatus('Please enter an Internet Archive URL', 'error');
        return;
      }

      const identifier = extractIdentifier(url);
      if (!identifier) {
        showStatus('Invalid Internet Archive URL. Use format: archive.org/details/item-name', 'error');
        return;
      }

      showStatus(`
        <div class="flex items-center justify-center gap-3">
          <svg class="w-5 h-5 animate-spin" fill="none" viewBox="0 0 24 24">
            <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
            <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
          </svg>
          <span>Fetching file list for "${identifier}"...</span>
        </div>
      `, 'loading');

      try {
        const metadataUrl = `${CORS_PROXY}https://archive.org/metadata/${identifier}`;
        const response = await fetch(metadataUrl);
        
        if (!response.ok) {
          throw new Error(`Failed to fetch metadata: ${response.status}`);
        }

        const data = await response.json();
        
        if (!data.files || data.files.length === 0) {
          showStatus('No files found for this item', 'error');
          return;
        }

        displayFiles(data.files, identifier);
        hideStatus();
        
      } catch (error) {
        showStatus(`Error: ${error.message}`, 'error');
      }
    }

    function formatBytes(bytes) {
      if (!bytes || bytes === 0) return '0 B';
      const k = 1024;
      const sizes = ['B', 'KB', 'MB', 'GB', 'TB'];
      const i = Math.floor(Math.log(bytes) / Math.log(k));
      return parseFloat((bytes / Math.pow(k, i)).toFixed(2)) + ' ' + sizes[i];
    }

    function getFileIcon(filename) {
      const ext = filename.split('.').pop().toLowerCase();
      const icons = {
        video: ['mp4', 'mkv', 'avi', 'mov', 'webm', 'flv', 'wmv'],
        audio: ['mp3', 'wav', 'flac', 'ogg', 'm4a', 'aac'],
        image: ['jpg', 'jpeg', 'png', 'gif', 'webp', 'svg', 'bmp'],
        archive: ['zip', 'rar', '7z', 'tar', 'gz', 'bz2'],
        document: ['pdf', 'doc', 'docx', 'txt', 'rtf'],
        code: ['html', 'css', 'js', 'json', 'xml']
      };

      for (const [type, exts] of Object.entries(icons)) {
        if (exts.includes(ext)) {
          const svgIcons = {
            video: '<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 10l4.553-2.276A1 1 0 0121 8.618v6.764a1 1 0 01-1.447.894L15 14M5 18h8a2 2 0 002-2V8a2 2 0 00-2-2H5a2 2 0 00-2 2v8a2 2 0 002 2z"/>',
            audio: '<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 19V6l12-3v13M9 19c0 1.105-1.343 2-3 2s-3-.895-3-2 1.343-2 3-2 3 .895 3 2zm12-3c0 1.105-1.343 2-3 2s-3-.895-3-2 1.343-2 3-2 3 .895 3 2zM9 10l12-3"/>',
            image: '<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z"/>',
            archive: '<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 8h14M5 8a2 2 0 110-4h14a2 2 0 110 4M5 8v10a2 2 0 002 2h10a2 2 0 002-2V8m-9 4h4"/>',
            document: '<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"/>',
            code: '<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 20l4-16m4 4l4 4-4 4M6 16l-4-4 4-4"/>'
          };
          return svgIcons[type];
        }
      }
      return '<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 21h10a2 2 0 002-2V9.414a1 1 0 00-.293-.707l-5.414-5.414A1 1 0 0012.586 3H7a2 2 0 00-2 2v14a2 2 0 002 2z"/>';
    }

    function displayFiles(files, identifier) {
      const container = document.getElementById('files-container');
      const list = document.getElementById('files-list');
      const countEl = document.getElementById('file-count');
      
      // Filter out metadata files
      const downloadableFiles = files.filter(f => 
        !f.name.endsWith('_meta.xml') && 
        !f.name.endsWith('_files.xml') &&
        f.name !== '__ia_thumb.jpg'
      );

      countEl.textContent = `${downloadableFiles.length} files`;
      
      list.innerHTML = downloadableFiles.map((file, index) => `
        <div class="file-item opacity-0 animate-slide-up bg-slate-900/60 backdrop-blur-sm rounded-xl border border-slate-800 p-4 hover:border-emerald-700/50 transition-all group">
          <div class="flex items-center gap-4">
            <div class="w-10 h-10 rounded-lg bg-slate-800 flex items-center justify-center text-slate-400 group-hover:text-emerald-400 transition-colors">
              <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                ${getFileIcon(file.name)}
              </svg>
            </div>
            <div class="flex-1 min-w-0">
              <p class="font-medium text-slate-200 truncate font-mono text-sm" title="${file.name}">${file.name}</p>
              <p class="text-xs text-slate-500">${formatBytes(file.size)}</p>
            </div>
            <button 
              onclick="downloadFile('${identifier}', '${file.name.replace(/'/g, "\\'")}', ${file.size || 0})"
              class="download-btn px-4 py-2 bg-slate-800 hover:bg-emerald-600 text-slate-300 hover:text-white text-sm font-medium rounded-lg transition-all flex items-center gap-2"
            >
              <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"/>
              </svg>
              Download
            </button>
          </div>
          <div class="progress-container hidden mt-3">
            <div class="h-2 bg-slate-800 rounded-full overflow-hidden">
              <div class="progress-bar h-full bg-gradient-to-r from-emerald-500 to-teal-500 rounded-full transition-all duration-300" style="width: 0%"></div>
            </div>
            <p class="progress-text text-xs text-slate-400 mt-1 text-center"></p>
          </div>
        </div>
      `).join('');

      container.classList.remove('hidden');
    }

    async function downloadFile(identifier, filename, fileSize) {
      // Archive.org URL without encoding - Archive.org handles the filename properly
      let fileUrl = `https://archive.org/download/${identifier}/${filename}`;
      
      // Find by iterating file items
      let targetButton = null;
      let progressContainer = null;
      let progressBar = null;
      let progressText = null;

      document.querySelectorAll('.file-item').forEach(item => {
        const nameEl = item.querySelector('.font-mono');
        if (nameEl && nameEl.textContent === filename) {
          targetButton = item.querySelector('.download-btn');
          progressContainer = item.querySelector('.progress-container');
          progressBar = item.querySelector('.progress-bar');
          progressText = item.querySelector('.progress-text');
        }
      });

      if (targetButton) {
        targetButton.disabled = true;
        targetButton.innerHTML = `
          <svg class="w-4 h-4 animate-spin" fill="none" viewBox="0 0 24 24">
            <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
            <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
          </svg>
          Downloading...
        `;
        targetButton.classList.add('downloading');
      }

      if (progressContainer) {
        progressContainer.classList.remove('hidden');
      }

      try {
        let response = null;
        let usedProxy = false;

        // Try CORS proxies with proper URL encoding for the proxy
        for (let i = 0; i < CORS_PROXIES.length; i++) {
          try {
            // For corsproxy.io, append the URL with ?
            const proxyUrl = CORS_PROXIES[i].includes('?') 
              ? `${CORS_PROXIES[i]}${fileUrl}`
              : `${CORS_PROXIES[i]}${encodeURIComponent(fileUrl)}`;
            
            response = await fetch(proxyUrl, { 
              method: 'GET',
              headers: {
                'Accept': '*/*'
              }
            });
            
            if (response.ok) {
              CORS_PROXY = CORS_PROXIES[i];
              usedProxy = true;
              break;
            }
          } catch (e) {
            if (i === CORS_PROXIES.length - 1) {
              throw new Error('All CORS proxies failed. Archive.org may be temporarily unavailable.');
            }
            continue;
          }
        }
        
        if (!response || !response.ok) {
          throw new Error(`Download failed: HTTP ${response?.status || 'No response'}`);
        }

        const reader = response.body.getReader();
        const contentLength = response.headers.get('Content-Length') || fileSize;
        const total = parseInt(contentLength, 10);
        
        let receivedLength = 0;
        const chunks = [];

        while (true) {
          const { done, value } = await reader.read();
          
          if (done) break;
          
          chunks.push(value);
          receivedLength += value.length;

          if (total && progressBar && progressText) {
            const percent = Math.round((receivedLength / total) * 100);
            progressBar.style.width = `${percent}%`;
            progressText.textContent = `${formatBytes(receivedLength)} / ${formatBytes(total)} (${percent}%)`;
          } else if (progressText) {
            progressText.textContent = `Downloaded: ${formatBytes(receivedLength)}`;
          }
        }

        const blob = new Blob(chunks);
        downloadedBlob = blob;
        downloadedFilename = filename;

        // Show the save preview
        document.getElementById('download-preview').classList.remove('hidden');
        document.getElementById('downloaded-filename').textContent = filename;
        document.getElementById('downloaded-size').textContent = formatBytes(blob.size);

        if (targetButton) {
          targetButton.innerHTML = `
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"/>
            </svg>
            Ready
          `;
          targetButton.classList.remove('downloading');
          targetButton.classList.add('bg-emerald-600', 'text-white');
        }

        // Scroll to save button
        document.getElementById('download-preview').scrollIntoView({ behavior: 'smooth', block: 'center' });

      } catch (error) {
        if (targetButton) {
          targetButton.disabled = false;
          targetButton.innerHTML = `
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/>
            </svg>
            Retry
          `;
          targetButton.classList.remove('downloading');
          targetButton.classList.add('bg-red-600');
        }
        showStatus(`Download error: ${error.message}`, 'error');
      }
    }

    async function saveToDevice() {
      if (!downloadedBlob || !downloadedFilename) {
        showStatus('No file ready to save. Download a file first.', 'error');
        return;
      }

      const saveBtn = document.getElementById('save-btn');
      saveBtn.disabled = true;
      saveBtn.innerHTML = `
        <svg class="w-5 h-5 animate-spin" fill="none" viewBox="0 0 24 24">
          <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
          <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
        </svg>
        Saving...
      `;

      try {
        // Try File System Access API first
        if ('showSaveFilePicker' in window) {
          const handle = await window.showSaveFilePicker({
            suggestedName: downloadedFilename,
          });
          
          const writable = await handle.createWritable();
          await writable.write(downloadedBlob);
          await writable.close();
          
          showStatus(`✓ "${downloadedFilename}" saved successfully!`, 'success');
        } else {
          // Fallback for browsers without File System Access API
          const url = URL.createObjectURL(downloadedBlob);
          const a = document.createElement('a');
          a.href = url;
          a.download = downloadedFilename;
          document.body.appendChild(a);
          a.click();
          document.body.removeChild(a);
          URL.revokeObjectURL(url);
          
          showStatus(`✓ "${downloadedFilename}" download started!`, 'success');
        }

        saveBtn.innerHTML = `
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"/>
          </svg>
          Saved!
        `;
        
        // Reset after a moment
        setTimeout(() => {
          saveBtn.disabled = false;
          saveBtn.innerHTML = `
