<!doctype html>
<html lang="en">
 <head>      
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Random Group Maker</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&amp;family=DM+Sans:wght@400;500;600&amp;display=swap" rel="stylesheet">
  <style>
    body {
      box-sizing: border-box;
    }
    .font-display { font-family: 'Space Grotesk', sans-serif; }
    .font-body { font-family: 'DM Sans', sans-serif; }
    
    @keyframes slideIn {
      from { opacity: 0; transform: translateY(20px) scale(0.95); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }
    
    @keyframes bounce {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.05); }
    }
    
    .group-card {
      animation: slideIn 0.4s ease-out forwards;
    }
    
    .shuffle-btn:active {
      animation: bounce 0.2s ease-out;
    }
    
    .name-tag {
      transition: all 0.2s ease;
    }
    
    .name-tag:hover {
      transform: translateX(4px);
    }
  </style>
 </head>
 <body class="h-full font-body">
  <div id="app-wrapper" class="h-full w-full overflow-auto" style="background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);">
   <div class="min-h-full w-full max-w-4xl mx-auto px-3 sm:px-4 py-4 sm:py-8"><!-- Header -->
    <div class="text-center mb-4 sm:mb-8">
     <h1 id="page-title" class="font-display text-3xl sm:text-4xl md:text-5xl font-bold text-white mb-1 sm:mb-2">Random Group Maker</h1>
     <p class="text-slate-400 text-base sm:text-lg">Enter names, set your groups, and shuffle!</p>
    </div><!-- Input Section -->
    <div class="bg-slate-800/50 backdrop-blur rounded-xl sm:rounded-2xl p-4 sm:p-6 mb-4 sm:mb-6 border border-slate-700/50"><!-- Names Input -->
     <div class="mb-4 sm:mb-6"><label for="names-input" class="block text-slate-300 font-medium mb-2 text-sm sm:text-base"> 👥 Enter Names <span class="text-slate-500 text-xs sm:text-sm block sm:inline mt-1 sm:mt-0">(one per line or comma-separated)</span> </label> <textarea id="names-input" class="w-full h-32 sm:h-32 bg-slate-900/50 border border-slate-600 rounded-lg sm:rounded-xl px-3 sm:px-4 py-2 sm:py-3 text-white text-base placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-cyan-500 focus:border-transparent resize-none" placeholder="Alice
Bob
Charlie
Diana..."></textarea>
      <p id="name-count" class="text-slate-500 text-xs sm:text-sm mt-2">0 names entered</p>
     </div><!-- Group Options -->
     <div class="grid grid-cols-1 sm:grid-cols-2 gap-3 sm:gap-4 mb-4 sm:mb-6"><!-- Split Method -->
      <div><label class="block text-slate-300 font-medium mb-2 text-sm sm:text-base">📊 Split By</label>
       <div class="flex gap-2"><button id="btn-by-groups" class="flex-1 px-3 sm:px-4 py-3 rounded-lg sm:rounded-xl text-sm sm:text-base font-medium transition-all bg-cyan-500 text-white active:scale-95"> # of Groups </button> <button id="btn-by-size" class="flex-1 px-3 sm:px-4 py-3 rounded-lg sm:rounded-xl text-sm sm:text-base font-medium transition-all bg-slate-700 text-slate-300 active:bg-slate-600 active:scale-95"> Group Size </button>
       </div>
      </div><!-- Number Input -->
      <div><label id="number-label" for="number-input" class="block text-slate-300 font-medium mb-2 text-sm sm:text-base">🔢 Number of Groups</label>
       <div class="flex items-center gap-2 sm:gap-3"><button id="btn-decrease" class="w-12 h-12 sm:w-12 sm:h-12 rounded-lg sm:rounded-xl bg-slate-700 text-white text-2xl font-bold active:bg-slate-600 transition-colors active:scale-95">−</button> <input type="number" id="number-input" value="2" min="1" class="flex-1 h-12 bg-slate-900/50 border border-slate-600 rounded-lg sm:rounded-xl px-3 sm:px-4 text-white text-center text-lg sm:text-xl font-bold focus:outline-none focus:ring-2 focus:ring-cyan-500"> <button id="btn-increase" class="w-12 h-12 sm:w-12 sm:h-12 rounded-lg sm:rounded-xl bg-slate-700 text-white text-2xl font-bold active:bg-slate-600 transition-colors active:scale-95">+</button>
       </div>
      </div>
     </div><!-- Shuffle Button --> <button id="shuffle-btn" class="shuffle-btn w-full py-3 sm:py-4 bg-gradient-to-r from-cyan-500 to-purple-500 active:from-cyan-400 active:to-purple-400 text-white font-display font-bold text-lg sm:text-xl rounded-lg sm:rounded-xl transition-all shadow-lg shadow-cyan-500/25 active:shadow-cyan-500/40 active:scale-98"> 🎲 Shuffle Groups </button>
    </div><!-- Results Section -->
    <div id="results-container" class="hidden">
     <div class="flex items-center justify-between mb-3 sm:mb-4">
      <h2 class="font-display text-xl sm:text-2xl font-bold text-white">✨ Your Groups</h2><button id="reshuffle-btn" class="px-3 sm:px-4 py-2 bg-slate-700 active:bg-slate-600 text-white rounded-lg transition-colors text-xs sm:text-sm font-medium active:scale-95"> 🔄 Reshuffle </button>
     </div>
     <div id="groups-grid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-3 sm:gap-4"></div>
    </div><!-- Empty State -->
    <div id="empty-state" class="text-center py-8 sm:py-12">
     <div class="text-5xl sm:text-6xl mb-3 sm:mb-4">
      🎯
     </div>
     <p class="text-slate-400 text-base sm:text-lg">Enter some names above and hit shuffle!</p>
    </div>
   </div>
  </div>
  <script>
    let splitByGroups = true;

    // DOM Elements
    const namesInput = document.getElementById('names-input');
    const nameCount = document.getElementById('name-count');
    const numberInput = document.getElementById('number-input');
    const numberLabel = document.getElementById('number-label');
    const btnByGroups = document.getElementById('btn-by-groups');
    const btnBySize = document.getElementById('btn-by-size');
    const btnDecrease = document.getElementById('btn-decrease');
    const btnIncrease = document.getElementById('btn-increase');
    const shuffleBtn = document.getElementById('shuffle-btn');
    const reshuffleBtn = document.getElementById('reshuffle-btn');
    const resultsContainer = document.getElementById('results-container');
    const groupsGrid = document.getElementById('groups-grid');
    const emptyState = document.getElementById('empty-state');
    const pageTitle = document.getElementById('page-title');

    // Group colors
    const groupColors = [
      { bg: 'bg-cyan-500/20', border: 'border-cyan-500/50', badge: 'bg-cyan-500' },
      { bg: 'bg-purple-500/20', border: 'border-purple-500/50', badge: 'bg-purple-500' },
      { bg: 'bg-emerald-500/20', border: 'border-emerald-500/50', badge: 'bg-emerald-500' },
      { bg: 'bg-amber-500/20', border: 'border-amber-500/50', badge: 'bg-amber-500' },
      { bg: 'bg-rose-500/20', border: 'border-rose-500/50', badge: 'bg-rose-500' },
      { bg: 'bg-indigo-500/20', border: 'border-indigo-500/50', badge: 'bg-indigo-500' },
      { bg: 'bg-teal-500/20', border: 'border-teal-500/50', badge: 'bg-teal-500' },
      { bg: 'bg-orange-500/20', border: 'border-orange-500/50', badge: 'bg-orange-500' },
    ];

    // Parse names from input
    function parseNames() {
      const text = namesInput.value.trim();
      if (!text) return [];
      
      // Split by newlines or commas
      return text
        .split(/[\n,]+/)
        .map(name => name.trim())
        .filter(name => name.length > 0);
    }

    // Update name count
    function updateNameCount() {
      const names = parseNames();
      const count = names.length;
      nameCount.textContent = `${count} name${count !== 1 ? 's' : ''} entered`;
    }

    // Shuffle array (Fisher-Yates)
    function shuffleArray(array) {
      const arr = [...array];
      for (let i = arr.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [arr[i], arr[j]] = [arr[j], arr[i]];
      }
      return arr;
    }

    // Create groups
    function createGroups() {
      const names = parseNames();
      if (names.length === 0) return;

      const shuffled = shuffleArray(names);
      const num = Math.max(1, parseInt(numberInput.value) || 2);
      
      let groups = [];
      
      if (splitByGroups) {
        // Split into N groups
        const numGroups = Math.min(num, shuffled.length);
        groups = Array.from({ length: numGroups }, () => []);
        
        shuffled.forEach((name, i) => {
          groups[i % numGroups].push(name);
        });
      } else {
        // Split by group size
        const groupSize = Math.max(1, num);
        for (let i = 0; i < shuffled.length; i += groupSize) {
          groups.push(shuffled.slice(i, i + groupSize));
        }
      }

      renderGroups(groups);
    }

    // Render groups
    function renderGroups(groups) {
      groupsGrid.innerHTML = '';
      emptyState.classList.add('hidden');
      resultsContainer.classList.remove('hidden');

      groups.forEach((group, index) => {
        const color = groupColors[index % groupColors.length];
        const delay = index * 0.1;
        
        const card = document.createElement('div');
        card.className = `group-card ${color.bg} ${color.border} border-2 rounded-2xl p-5`;
        card.style.animationDelay = `${delay}s`;
        card.style.opacity = '0';
        
        card.innerHTML = `
          <div class="flex items-center gap-2 sm:gap-3 mb-3 sm:mb-4">
            <span class="${color.badge} w-7 h-7 sm:w-8 sm:h-8 rounded-lg flex items-center justify-center text-white font-bold font-display text-sm sm:text-base">
              ${index + 1}
            </span>
            <h3 class="text-white font-display font-bold text-base sm:text-lg">Group ${index + 1}</h3>
            <span class="ml-auto text-slate-400 text-xs sm:text-sm">${group.length} member${group.length !== 1 ? 's' : ''}</span>
          </div>
          <div class="space-y-1.5 sm:space-y-2">
            ${group.map(name => `
              <div class="name-tag flex items-center gap-2 bg-slate-900/30 rounded-lg px-2.5 sm:px-3 py-1.5 sm:py-2">
                <span class="w-1.5 h-1.5 sm:w-2 sm:h-2 ${color.badge} rounded-full flex-shrink-0"></span>
                <span class="text-white text-sm sm:text-base break-words">${escapeHtml(name)}</span>
              </div>
            `).join('')}
          </div>
        `;
        
        groupsGrid.appendChild(card);
      });
    }

    // Escape HTML
    function escapeHtml(text) {
      const div = document.createElement('div');
      div.textContent = text;
      return div.innerHTML;
    }

    // Toggle split method
    function setSplitMethod(byGroups) {
      splitByGroups = byGroups;
      
      if (byGroups) {
        btnByGroups.className = 'flex-1 px-3 sm:px-4 py-3 rounded-lg sm:rounded-xl text-sm sm:text-base font-medium transition-all bg-cyan-500 text-white active:scale-95';
        btnBySize.className = 'flex-1 px-3 sm:px-4 py-3 rounded-lg sm:rounded-xl text-sm sm:text-base font-medium transition-all bg-slate-700 text-slate-300 active:bg-slate-600 active:scale-95';
        numberLabel.textContent = '🔢 Number of Groups';
        numberInput.value = '2';
      } else {
        btnBySize.className = 'flex-1 px-3 sm:px-4 py-3 rounded-lg sm:rounded-xl text-sm sm:text-base font-medium transition-all bg-cyan-500 text-white active:scale-95';
        btnByGroups.className = 'flex-1 px-3 sm:px-4 py-3 rounded-lg sm:rounded-xl text-sm sm:text-base font-medium transition-all bg-slate-700 text-slate-300 active:bg-slate-600 active:scale-95';
        numberLabel.textContent = '🔢 People Per Group';
        numberInput.value = '3';
      }
    }

    // Event Listeners
    namesInput.addEventListener('input', updateNameCount);
    
    btnByGroups.addEventListener('click', () => setSplitMethod(true));
    btnBySize.addEventListener('click', () => setSplitMethod(false));
    
    btnDecrease.addEventListener('click', () => {
      const current = parseInt(numberInput.value) || 2;
      if (current > 1) numberInput.value = current - 1;
    });
    
    btnIncrease.addEventListener('click', () => {
      const current = parseInt(numberInput.value) || 2;
      numberInput.value = current + 1;
    });
    
    shuffleBtn.addEventListener('click', createGroups);
    reshuffleBtn.addEventListener('click', createGroups);

    // Config change handler
    async function onConfigChange(cfg) {
      const title = cfg.page_title || defaultConfig.page_title;
      const btnText = cfg.button_text || defaultConfig.button_text;
      
      pageTitle.textContent = title;
      shuffleBtn.innerHTML = `🎲 ${btnText}`;
      
      // Apply font
      const fontFamily = cfg.font_family || defaultConfig.font_family;
      document.querySelectorAll('.font-display').forEach(el => {
        el.style.fontFamily = `${fontFamily}, sans-serif`;
      });
      
      // Apply font size scaling
      const baseSize = cfg.font_size || defaultConfig.font_size;
      const isMobile = window.innerWidth < 640;
      pageTitle.style.fontSize = isMobile ? `${baseSize * 1.875}px` : `${baseSize * 2.5}px`;
    }
  </script>
 </body>
</html>
