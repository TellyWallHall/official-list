<!doctype html>
<html lang="en" class="h-full">
 <head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Wordle</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&amp;display=swap" rel="stylesheet">
  <style>
    body {
      box-sizing: border-box;
    }
    
    * {
      font-family: 'Space Mono', monospace;
    }
    
    @keyframes flip {
      0% { transform: rotateX(0); }
      50% { transform: rotateX(90deg); }
      100% { transform: rotateX(0); }
    }
    
    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      20%, 60% { transform: translateX(-5px); }
      40%, 80% { transform: translateX(5px); }
    }
    
    @keyframes bounce {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-10px); }
    }
    
    @keyframes pop {
      0% { transform: scale(1); }
      50% { transform: scale(1.1); }
      100% { transform: scale(1); }
    }
    
    .flip {
      animation: flip 0.5s ease-in-out;
    }
    
    .shake {
      animation: shake 0.5s ease-in-out;
    }
    
    .bounce {
      animation: bounce 0.5s ease-in-out;
    }
    
    .pop {
      animation: pop 0.1s ease-in-out;
    }
    
    @keyframes confetti-fall {
      0% { transform: translateY(-100vh) rotate(0deg); opacity: 1; }
      100% { transform: translateY(100vh) rotate(720deg); opacity: 0; }
    }
    
    .confetti {
      position: fixed;
      width: 10px;
      height: 10px;
      pointer-events: none;
      z-index: 100;
    }
  </style>
 </head>

      }

    // Game state
    let targetWord = '';
    let currentRow = 0;
    let currentTile = 0;
    let gameOver = false;
    let guesses = [];
    
    // Stats tracking
    let stats = {
      currentStreak: 0,
      maxStreak: 0,
      gamesPlayed: 0,
      gamesWon: 0,
      guessDistribution: [0, 0, 0, 0, 0, 0]
    };
    
    // Load stats from localStorage
    function loadStats() {
      const saved = localStorage.getItem('wordleStats');
      if (saved) {
        stats = JSON.parse(saved);
        updateStreakDisplay();
      }
    }
    
    // Save stats to localStorage
    function saveStats() {
      localStorage.setItem('wordleStats', JSON.stringify(stats));
    }
    
    // Update streak display
    function updateStreakDisplay() {
      document.getElementById('streak-count').textContent = stats.currentStreak;
    }
    
    // Keyboard layouts
    const KEYBOARD_LAYOUTS = {
      QWERTY: [
        ['Q', 'W', 'E', 'R', 'T', 'Y', 'U', 'I', 'O', 'P'],
        ['A', 'S', 'D', 'F', 'G', 'H', 'J', 'K', 'L'],
        ['ENTER', 'Z', 'X', 'C', 'V', 'B', 'N', 'M', '⌫']
      ],
      DVORAK: [
        ['⌫', 'P', 'Y', 'F', 'G', 'C', 'R', 'L'],
        ['A', 'O', 'E', 'U', 'I', 'D', 'H', 'T', 'N', 'S'],
        ['Q', 'J', 'K', 'X', 'B', 'M', 'W', 'V', 'Z', 'ENTER']
      ]
    };
    
    // Current layout
    let currentLayout = 'DVORAK';
    
    // Key colors tracking
    let keyColors = {};
    
    // Initialize game
    function initGame() {
      if (!wordsLoaded || WORDS.length === 0) {
        showToast('Loading words...', 2000);
        setTimeout(initGame, 500);
        return;
      }
      
      targetWord = WORDS[Math.floor(Math.random() * WORDS.length)];
      currentRow = 0;
      currentTile = 0;
      gameOver = false;
      guesses = [];
      keyColors = {};
      
      createBoard();
      createKeyboard();
      document.getElementById('play-again').classList.add('hidden');
    }
    
    // Create confetti effect
    function createConfetti() {
      const colors = ['#10b981', '#f59e0b', '#60a5fa', '#ec4899', '#a78bfa', '#8b5cf6'];
      for (let i = 0; i < 50; i++) {
        setTimeout(() => {
          const confetti = document.createElement('div');
          confetti.className = 'confetti';
          confetti.style.left = Math.random() * 100 + '%';
          confetti.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
          confetti.style.animation = `confetti-fall ${2 + Math.random() * 2}s linear`;
          document.body.appendChild(confetti);
          
          setTimeout(() => confetti.remove(), 4000);
        }, i * 30);
      }
    }
    
    // Create the game board
    function createBoard() {
      const board = document.getElementById('board');
      board.innerHTML = '';
      
      for (let i = 0; i < 6; i++) {
        const row = document.createElement('div');
        row.className = 'flex gap-1.5';
        row.id = `row-${i}`;
        
        for (let j = 0; j < 5; j++) {
          const tile = document.createElement('div');
          tile.className = 'w-14 h-14 sm:w-16 sm:h-16 border-2 flex items-center justify-center text-2xl sm:text-3xl font-bold transition-all duration-200 rounded-lg';
          tile.style.borderColor = '#7c3aed';
          tile.style.color = '#ffffff';
          tile.style.backgroundColor = 'rgba(124, 58, 237, 0.1)';
          tile.style.boxShadow = '0 2px 8px rgba(124, 58, 237, 0.2)';
          tile.id = `tile-${i}-${j}`;
          row.appendChild(tile);
        }
        
        board.appendChild(row);
      }
    }
    
    // Create the keyboard
    function createKeyboard() {
      const keyboard = document.getElementById('keyboard');
      keyboard.innerHTML = '';
      
      const rows = KEYBOARD_LAYOUTS[currentLayout];
      
      rows.forEach((row, rowIndex) => {
        const rowDiv = document.createElement('div');
        rowDiv.className = 'flex justify-center gap-1 mb-1.5';
        
        row.forEach(key => {
          const keyBtn = document.createElement('button');
          const isWide = key === 'ENTER' || key === '⌫';
          const isLetter = /^[A-Z]$/.test(key);
          keyBtn.className = `${isWide ? 'px-3 sm:px-4' : isLetter ? 'w-8 sm:w-10' : 'w-7 sm:w-9'} h-12 sm:h-14 rounded-lg font-bold text-xs sm:text-sm transition-all duration-100 hover:scale-105 active:scale-95`;
          keyBtn.style.background = 'linear-gradient(135deg, #4c1d95 0%, #5b21b6 100%)';
          keyBtn.style.color = '#ffffff';
          keyBtn.style.touchAction = 'manipulation';
          keyBtn.style.boxShadow = '0 2px 8px rgba(91, 33, 182, 0.3)';
          keyBtn.textContent = key;
          keyBtn.id = `key-${key}`;
          
          // Better event handling with both click and touch
          const pressKey = (e) => {
            e.preventDefault();
            handleKeyPress(key);
          };
          
          keyBtn.addEventListener('click', pressKey);
          keyBtn.addEventListener('touchend', pressKey);
          
          rowDiv.appendChild(keyBtn);
        });
        
        keyboard.appendChild(rowDiv);
      });
    }
    
    // Toggle keyboard layout
    function toggleLayout() {
      currentLayout = currentLayout === 'QWERTY' ? 'DVORAK' : 'QWERTY';
      document.getElementById('layout-toggle').textContent = currentLayout;
      createKeyboard();
      updateKeyboardColors();
    }
    
    // Handle key press
    function handleKeyPress(key) {
      if (gameOver) return;
      
      if (key === '⌫') {
        deleteLetter();
      } else if (key === 'ENTER') {
        submitGuess();
      } else {
        addLetter(key);
      }
    }
    
    // Add letter to current tile
    function addLetter(letter) {
      if (currentTile < 5) {
        const tile = document.getElementById(`tile-${currentRow}-${currentTile}`);
        tile.textContent = letter;
        tile.style.borderColor = '#a78bfa';
        tile.style.backgroundColor = 'rgba(167, 139, 250, 0.2)';
        tile.style.boxShadow = '0 4px 12px rgba(167, 139, 250, 0.4)';
        tile.classList.add('pop');
        
        // Flash the key that was pressed
        const key = document.getElementById(`key-${letter}`);
        if (key) {
          key.style.transform = 'scale(0.95)';
          setTimeout(() => {
            key.style.transform = 'scale(1)';
          }, 100);
        }
        
        setTimeout(() => tile.classList.remove('pop'), 100);
        currentTile++;
      }
    }
    
    // Delete last letter
    function deleteLetter() {
      if (currentTile > 0) {
        currentTile--;
        const tile = document.getElementById(`tile-${currentRow}-${currentTile}`);
        tile.textContent = '';
        tile.style.borderColor = '#7c3aed';
        tile.style.backgroundColor = 'rgba(124, 58, 237, 0.1)';
        tile.style.boxShadow = '0 2px 8px rgba(124, 58, 237, 0.2)';
      }
    }
    
    // Show toast message
    function showToast(message, duration = 1500) {
      const toast = document.getElementById('toast');
      toast.textContent = message;
      toast.style.opacity = '1';
      setTimeout(() => {
        toast.style.opacity = '0';
      }, duration);
    }
    
    // Submit guess
    function submitGuess() {
      if (currentTile !== 5) {
        const row = document.getElementById(`row-${currentRow}`);
        row.classList.add('shake');
        setTimeout(() => row.classList.remove('shake'), 500);
        showToast('Not enough letters');
        return;
      }
      
      let guess = '';
      for (let i = 0; i < 5; i++) {
        guess += document.getElementById(`tile-${currentRow}-${i}`).textContent;
      }
      
      if (!VALID_WORDS.has(guess)) {
        const row = document.getElementById(`row-${currentRow}`);
        row.classList.add('shake');
        setTimeout(() => row.classList.remove('shake'), 500);
        showToast('Not in word list');
        return;
      }
      
      guesses.push(guess);
      revealTiles(guess);
    }
    
    // Reveal tiles with animation
    function revealTiles(guess) {
      const targetArray = targetWord.split('');
      const guessArray = guess.split('');
      const colors = new Array(5).fill('absent');
      const targetCounts = {};
      
      // Count letters in target word
      targetArray.forEach(letter => {
        targetCounts[letter] = (targetCounts[letter] || 0) + 1;
      });
      
      // First pass: mark correct positions
      guessArray.forEach((letter, i) => {
        if (letter === targetArray[i]) {
          colors[i] = 'correct';
          targetCounts[letter]--;
        }
      });
      
      // Second pass: mark present letters
      guessArray.forEach((letter, i) => {
        if (colors[i] !== 'correct' && targetCounts[letter] > 0) {
          colors[i] = 'present';
          targetCounts[letter]--;
        }
      });
      
      // Animate tiles
      for (let i = 0; i < 5; i++) {
        setTimeout(() => {
          const tile = document.getElementById(`tile-${currentRow}-${i}`);
          tile.classList.add('flip');
          
          setTimeout(() => {
            let bgColor, boxShadow;
            if (colors[i] === 'correct') {
              bgColor = 'linear-gradient(135deg, #10b981 0%, #059669 100%)';
              boxShadow = '0 4px 15px rgba(16, 185, 129, 0.5)';
              tile.style.borderColor = '#10b981';
            } else if (colors[i] === 'present') {
              bgColor = 'linear-gradient(135deg, #f59e0b 0%, #d97706 100%)';
              boxShadow = '0 4px 15px rgba(245, 158, 11, 0.5)';
              tile.style.borderColor = '#f59e0b';
            } else {
              bgColor = 'linear-gradient(135deg, #374151 0%, #1f2937 100%)';
              boxShadow = '0 2px 8px rgba(55, 65, 81, 0.3)';
              tile.style.borderColor = '#374151';
            }
            
            tile.style.background = bgColor;
            tile.style.boxShadow = boxShadow;
            
            // Update keyboard colors
            const letter = guessArray[i];
            const currentKeyColor = keyColors[letter];
            
            if (colors[i] === 'correct') {
              keyColors[letter] = 'correct';
            } else if (colors[i] === 'present' && currentKeyColor !== 'correct') {
              keyColors[letter] = 'present';
            } else if (!currentKeyColor) {
              keyColors[letter] = 'absent';
            }
            
            updateKeyboardColors();
          }, 250);
        }, i * 300);
      }
      
      // Check win/lose after animations
      setTimeout(() => {
        if (guess === targetWord) {
          gameWon();
        } else if (currentRow === 5) {
          gameLost();
        } else {
          currentRow++;
          currentTile = 0;
        }
      }, 1800);
    }
    
    // Update keyboard colors
    function updateKeyboardColors() {
      Object.entries(keyColors).forEach(([letter, status]) => {
        const key = document.getElementById(`key-${letter}`);
        if (key) {
          if (status === 'correct') {
            key.style.background = 'linear-gradient(135deg, #10b981 0%, #059669 100%)';
            key.style.color = '#ffffff';
            key.style.boxShadow = '0 4px 12px rgba(16, 185, 129, 0.5)';
          } else if (status === 'present') {
            key.style.background = 'linear-gradient(135deg, #f59e0b 0%, #d97706 100%)';
            key.style.color = '#ffffff';
            key.style.boxShadow = '0 4px 12px rgba(245, 158, 11, 0.5)';
          } else if (status === 'absent') {
            key.style.background = 'linear-gradient(135deg, #374151 0%, #1f2937 100%)';
            key.style.boxShadow = '0 2px 8px rgba(55, 65, 81, 0.3)';
          }
        }
      });
    }
    
    // Game won
    function gameWon() {
      gameOver = true;
      const messages = ['Genius!', 'Magnificent!', 'Impressive!', 'Splendid!', 'Great!', 'Phew!'];
      showToast(messages[currentRow] || 'You won!', 3000);
      
      // Update stats
      stats.gamesPlayed++;
      stats.gamesWon++;
      stats.currentStreak++;
      stats.maxStreak = Math.max(stats.maxStreak, stats.currentStreak);
      stats.guessDistribution[currentRow]++;
      saveStats();
      updateStreakDisplay();
      
      // Confetti for wins
      createConfetti();
      
      // Bounce animation for winning row
      for (let i = 0; i < 5; i++) {
        setTimeout(() => {
          const tile = document.getElementById(`tile-${currentRow}-${i}`);
          tile.classList.add('bounce');
        }, i * 100);
      }
      
      setTimeout(() => {
        document.getElementById('play-again').classList.remove('hidden');
      }, 1500);
    }
    
    // Game lost
    function gameLost() {
      gameOver = true;
      showToast(targetWord, 3000);
      
      // Update stats
      stats.gamesPlayed++;
      stats.currentStreak = 0;
      saveStats();
      updateStreakDisplay();
      
      setTimeout(() => {
        document.getElementById('play-again').classList.remove('hidden');
      }, 1500);
    }
    
    // Physical keyboard support
    document.addEventListener('keydown', (e) => {
      if (gameOver) return;
      
      if (e.key === 'Enter') {
        handleKeyPress('ENTER');
      } else if (e.key === 'Backspace') {
        handleKeyPress('⌫');
      } else if (/^[a-zA-Z]$/.test(e.key)) {
        handleKeyPress(e.key.toUpperCase());
      }
    });
    
    // Play again button
    document.getElementById('play-again').addEventListener('click', initGame);
    
    // Layout toggle button
    document.getElementById('layout-toggle').addEventListener('click', toggleLayout);
    
    // Start the game
    loadStats();
    loadWords().then(() => {
      initGame();
    });
  </script>
</body>
</html>
