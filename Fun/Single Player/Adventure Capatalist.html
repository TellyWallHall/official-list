    <script type='text/javascript'>
        // connect to canvas
var Module = {
    TOTAL_MEMORY: 201326592,
    filePackagePrefixURL: "Release/",
    memoryInitializerPrefixURL: "Release/",
    preRun: [],
    postRun: [],
    
    // NEW: This fires when the engine is ready
    onRuntimeInitialized: function() {
        var canvas = document.getElementById('canvas');
        if (canvas) {
            // Force focus on any touch to bypass browser security "gates"
            window.addEventListener('touchstart', function() {
                canvas.focus();
                window.focus();
            }, false);
            
            // Prevent the browser from trying to scroll/bounce the page
            canvas.addEventListener('touchmove', function(e) {
                e.preventDefault();
            }, { passive: false });
        }
    },

    print: (function() {
        return function(text) { console.log(text); };
    })(),
    printErr: function(text) {
        console.error(text);
    },
    canvas: document.getElementById('canvas'),
    progress: null,
    setStatus: function(text) {
        if (this.progress == null) {
            if (typeof UnityProgress != 'function') return;
            // Use the canvas variable directly
            this.progress = new UnityProgress(document.getElementById('canvas'));
        }
        if (!Module.setStatus.last) Module.setStatus.last = { time: Date.now(), text: '' };
        if (text === Module.setStatus.text) return;
        this.progress.SetMessage(text);
        var m = text.match(/([^(]+)\((\d+(\.\d+)?)\/(\d+)\)/);
        if (m) this.progress.SetProgress(parseInt(m[2]) / parseInt(m[4]));
        if (text === "") this.progress.Clear();
    },
    totalDependencies: 0,
    monitorRunDependencies: function(left) {
        this.totalDependencies = Math.max(this.totalDependencies, left);
        Module.setStatus(left ? 'Preparing... (' + (this.totalDependencies - left) + '/' + this.totalDependencies + ')' : 'All downloads complete.');
    }
};
        Module.setStatus('Downloading (0.0/1)');

    <script>
        if (!(!Math.fround)) {
            var script = document.createElement('script');
            script.src = "Release/webgl.js";
            document.body.appendChild(script);
        } else {
            var codeXHR = new XMLHttpRequest();
            codeXHR.open('GET', 'Release/webgl.js', true);
            codeXHR.onload = function() {
                var code = codeXHR.responseText;
                if (!Math.fround) {
                    try {
                        console.log('optimizing out Math.fround calls');
                        var m = /var ([^=]+)=global\.Math\.fround;/.exec(code);
                        var minified = m[1];
                        if (!minified) throw 'fail';
                        var startAsm = code.indexOf('// EMSCRIPTEN_START_FUNCS');
                        var endAsm = code.indexOf('// EMSCRIPTEN_END_FUNCS');
                        var asm = code.substring(startAsm, endAsm);
                        do {
                            var moar = false; // we need to re-do, as x(x( will not be fixed
                            asm = asm.replace(new RegExp('[^a-zA-Z0-9\\$\\_]' + minified + '\\(', 'g'), function(s) {
                                moar = true;
                                return s[0] + '('
                            });
                        } while (moar);
                        code = code.substring(0, startAsm) + asm + code.substring(endAsm);
                        code = code.replace("'use asm'", "'almost asm'");
                    } catch (e) {
                        console.log('failed to optimize out Math.fround calls ' + e)
                    }
                }
                var blob = new Blob([code], {
                    type: 'text/javascript'
                });
                codeXHR = null;
                var src = URL.createObjectURL(blob);
                var script = document.createElement('script');
                script.src = URL.createObjectURL(blob);
                script.onload = function() {
                    URL.revokeObjectURL(script.src);
                };
                document.body.appendChild(script);
            };
            codeXHR.send(null);
        }

    </script><script>
  var isDragging = false;

  function emitMouseEvent(type, touch, canvas) {
    var rect = canvas.getBoundingClientRect();
    var scaleX = canvas.width / rect.width;
    var scaleY = canvas.height / rect.height;
    
    var x = (touch.clientX - rect.left) * scaleX;
    var y = (touch.clientY - rect.top) * scaleY;

    var mouseEvent = new MouseEvent(type, {
      clientX: x,
      clientY: y,
      button: 0,
      buttons: 1, // Indicates left mouse button is held
      bubbles: true,
      cancelable: true,
      view: window
    });
    canvas.dispatchEvent(mouseEvent);
  }

  window.addEventListener('touchstart', function(e) {
    var canvas = document.getElementById('canvas');
    if (!canvas || !e.touches[0]) return;
    
    isDragging = true;
    canvas.focus();
    emitMouseEvent("mousedown", e.touches[0], canvas);
    e.preventDefault(); 
  }, { passive: false });

  window.addEventListener('touchmove', function(e) {
    var canvas = document.getElementById('canvas');
    if (!canvas || !isDragging || !e.touches[0]) return;

    // This allows the "scrolling/dragging" behavior in Unity
    emitMouseEvent("mousemove", e.touches[0], canvas);
    e.preventDefault();
  }, { passive: false });

  window.addEventListener('touchend', function(e) {
    var canvas = document.getElementById('canvas');
    if (!canvas || !isDragging) return;

    isDragging = false;
    // We use changedTouches for the end event
    var touch = e.changedTouches[0];
    emitMouseEvent("mouseup", touch, canvas);
    emitMouseEvent("click", touch, canvas);
    
    e.preventDefault();
  }, { passive: false });
</script></body>
