<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>The Custom Impossible Quiz</title>
    <style>
        :root { --bg: #ffde59; --card: #fff; --red: #ff3131; }
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body { margin: 0; padding: 20px; background: var(--bg); font-family: 'Comic Sans MS', sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; user-select: none; }
        #quiz-container { width: 100%; max-width: 500px; background: var(--card); border: 4px solid #000; border-radius: 20px; padding: 20px; box-shadow: 8px 8px 0px #000; position: relative; }
        #status-bar { display: flex; justify-content: space-between; font-weight: bold; font-size: 1.1rem; margin-bottom: 20px; border-bottom: 3px solid #000; padding-bottom: 10px; }
        #lives-display { color: var(--red); letter-spacing: 2px; }
        #question-box { font-size: 1.3rem; font-weight: bold; text-align: center; margin-bottom: 25px; min-height: 60px; display: flex; align-items: center; justify-content: center; }
        .options-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; width: 100%; }
        button.option-btn { background: #fff; border: 3px solid #000; border-radius: 12px; padding: 15px 10px; font-family: inherit; font-size: 1rem; font-weight: bold; cursor: pointer; box-shadow: 4px 4px 0px #000; }
        button.option-btn:active { transform: translate(2px, 2px); box-shadow: 2px 2px 0px #000; }
        .screen-overlay { display: none; flex-direction: column; align-items: center; justify-content: center; text-align: center; }
        button.action-btn { background: #00bf63; color: white; padding: 15px 30px; font-size: 1.2rem; border: 3px solid #000; border-radius: 12px; box-shadow: 4px 4px 0px #000; cursor: pointer; margin-top: 20px; }
        .secret-click { text-decoration: underline; cursor: pointer; color: blue; }
    </style>
</head>
<body>
    <div id="quiz-container">
        <div id="game-interface">
            <div id="status-bar"><span id="question-number">Q1.</span><span id="lives-display">❤️❤️❤️</span></div>
            <div id="question-box"></div>
            <div id="options-zone" class="options-grid"></div>
        </div>
        <div id="game-over-screen" class="screen-overlay">
            <h1 style="color: var(--red);">GAME OVER</h1>
            <button class="action-btn" onclick="startGame()">Try Again</button>
        </div>
        <div id="victory-screen" class="screen-overlay">
            <h1 style="color: #00bf63;">YOU WIN!</h1>
            <button class="action-btn" onclick="startGame()">Play Again</button>
        </div>
    </div>

        function startGame() { lives = 3; currentQuestionIdx = 0; gameOverScreen.style.display = 'none'; victoryScreen.style.display = 'none'; gameInterface.style.display = 'block'; updateLivesDisplay(); loadQuestion(); }
        function updateLivesDisplay() { livesDisplay.innerText = "❤️".repeat(lives); }
        function loadQuestion() { optionsZone.innerHTML = ""; const currentData = quizData[currentQuestionIdx]; qNumberDisplay.innerText = `Q${currentQuestionIdx + 1}.`; if (currentData.isCustom) { currentData.render(); } else { questionBox.innerText = currentData.q; currentData.options.forEach(opt => { const btn = document.createElement('button'); btn.className = 'option-btn'; btn.innerText = opt; btn.onclick = () => handleAnswer(opt === currentData.correct); optionsZone.appendChild(btn); }); } }
        function handleAnswer(isCorrect) { if (isCorrect) { currentQuestionIdx++; if (currentQuestionIdx >= quizData.length) { gameInterface.style.display = 'none'; victoryScreen.style.display = 'flex'; } else { loadQuestion(); } } else { lives--; updateLivesDisplay(); if (lives <= 0) { gameInterface.style.display = 'none'; gameOverScreen.style.display = 'flex'; } } }
