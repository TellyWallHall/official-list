<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/drippy-cat/snowrider3D@c82fe583cbffafa502b0aa3ed2da0053972e0c80/TemplateData/style.css">
<script src="https://cdn.jsdelivr.net/gh/drippy-cat/snowrider3D@c82fe583cbffafa502b0aa3ed2da0053972e0c80/TemplateData/UnityProgress.js"></script>
<script src="https://cdn.jsdelivr.net/gh/drippy-cat/snowrider3D@c82fe583cbffafa502b0aa3ed2da0053972e0c80/Build/UnityLoader.js"></script>

<script>
  var gameInstance = UnityLoader.instantiate("gameContainer", "https://cdn.jsdelivr.net/gh/drippy-cat/snowrider3D@c82fe583cbffafa502b0aa3ed2da0053972e0c80/Build/SnowRider3D-gd-1.json", {
    onProgress: UnityProgress,
    Module: {
      onRuntimeInitialized: function() {
        UnityProgress(gameInstance, "complete")
      }
    }
  });

</script>
<div class="webgl-content" id="unity-canvas">
  <div id="gameContainer" style="width: 100%; height: 100%; margin: auto"></div>
  <div id="m-controls">
    <button id="m-left">◀</button>
    <button id="m-up">▲</button>
    <button id="m-right">▶</button>
  </div>
  <style>
    #m-controls {
      position: fixed;
      bottom: 60px;
      left: 0;
      right: 0;
      z-index: 9999;
      display: flex;
      justify-content: center;
      align-items: flex-end;
      gap: 30px;
      pointer-events: none;
      padding-bottom: env(safe-area-inset-bottom)
    }

    #m-controls button {
      pointer-events: auto;
      width: 300px;
      height: 300px;
      border-radius: 50%;
      border: none;
      background: rgba(25, 25, 25, .2);
      color: #fff;
      font-size: 70px;
      touch-action: none;
      -webkit-user-select: none;
      user-select: none
    }

    #m-controls button:active {
      background: rgba(255, 255, 255, .4)
    }

    #m-up {
      margin-bottom: 35px;
      width: 80px;
      height: 80px
    }

    @media (hover:hover) {
      #m-controls {
        display: none
      }
    }

  </style>
  <script>
    (() => {
      const map = {
        'm-left': 'ArrowLeft',
        'm-up': 'ArrowUp',
        'm-right': 'ArrowRight'
      };

      function send(type, key) {
        window.dispatchEvent(new KeyboardEvent(type, {
          key: key,
          code: key,
          keyCode: key === 'ArrowLeft' ? 37 : key === 'ArrowUp' ? 38 : 39,
          which: key === 'ArrowLeft' ? 37 : key === 'ArrowUp' ? 38 : 39,
          bubbles: true
        }));
        // Also hit the canvas so Unity definitely gets it
        const c = document.querySelector('canvas');
        if (c) c.dispatchEvent(new KeyboardEvent(type, {
          key: key,
          code: key,
          bubbles: true
        }));
      }
      for (let id in map) {
        const btn = document.getElementById(id);
        const key = map[id];
        const down = e => {
          e.preventDefault();
          send('keydown', key);
        };
        const up = e => {
          e.preventDefault();
          send('keyup', key);
        };
        btn.addEventListener('touchstart', down, {
          passive: false
        });
        btn.addEventListener('touchend', up, {
          passive: false
        });
        btn.addEventListener('touchcancel', up, {
          passive: false
        });
        btn.addEventListener('mousedown', down);
        btn.addEventListener('mouseup', up);
        btn.addEventListener('mouseleave', up);
      }
    })();

  </script>
