          container.querySelectorAll('.q-msg').forEach(b => {
            b.addEventListener('click', () => sendChat(b.textContent));
          });
        }
      }

      appendInGameChat(isMe, name, text) {
        const log = document.getElementById('gameChatLog');
        if (!log) return;
        const msg = document.createElement('div');
        msg.style.padding = '2px 6px';
        msg.style.borderRadius = '4px';
        msg.style.background = isMe ? 'rgba(6, 182, 212, 0.15)' : 'var(--bg-card)';
        msg.innerHTML = `<b>${this.escapeHtml(name)}:</b> ${this.escapeHtml(text)}`;
        log.appendChild(msg);
        log.scrollTop = log.scrollHeight;
      }

      updateMaterialTrays() {
        const myTray = document.getElementById('myTray');
        const oppTray = document.getElementById('oppTray');
        if (!myTray || !oppTray || !this.activeGame) return;
        const info = this.activeGame.engine.getMaterialDiff();
        const isWhite = this.activeGame.myColor === 'w' || (this.activeGame.isPassAndPlay && this.activeGame.engine.turn === 'w');
        const myLead = isWhite ? info.diff : -info.diff;
        const oppLead = isWhite ? -info.diff : info.diff;
        myTray.innerHTML = myLead > 0 ? `<span class="mat-lead-badge">+${myLead}</span>` : '';
        oppTray.innerHTML = oppLead > 0 ? `<span class="mat-lead-badge">+${oppLead}</span>` : '';
      }

      renderBoard() {
        const boardEl = document.getElementById('chessBoard');
        if (!boardEl || !this.activeGame) return;
        boardEl.innerHTML = '';

        const isFlipped = this.boardFlipped;
        const engine = this.activeGame.engine;
        const archetype = this.activeGame.archetype;
        const lastMove = engine.moveHistory[engine.moveHistory.length - 1];
        const kingInCheckSq = engine.inCheck() ? engine.findKing(engine.turn) : -1;

        let visibleSquares = new Set();
        if (archetype === 'fog_of_war') {
          const povColor = this.activeGame.isPassAndPlay ? engine.turn : this.activeGame.myColor;
          for (let r = 0; r < 8; r++) {
            for (let f = 0; f < 8; f++) {
              const sq = (r << 4) | f;
              const p = engine.board[sq];
              if (p && engine.getColor(p) === povColor) {
                visibleSquares.add(sq);
                for (let off of QUEEN_KING_OFFSETS) {
                  if (!ChessGame.isOffBoard(sq + off)) visibleSquares.add(sq + off);
                }
                const moves = engine.getLegalMoves().filter(m => m.from === sq);
                moves.forEach(m => visibleSquares.add(m.to));
              }
            }
          }
        }

        let legalDests = [];
        if (this.selectedSquare !== null) {
          legalDests = engine.getLegalMoves().filter(m => m.from === this.selectedSquare).map(m => m.to);
        }

        for (let row = 0; row < 8; row++) {
          for (let col = 0; col < 8; col++) {
            const actualRow = isFlipped ? 7 - row : row;
            const actualCol = isFlipped ? 7 - col : col;
            const sq = (actualRow << 4) | actualCol;
            const piece = engine.board[sq];
            const isLight = (actualRow + actualCol) % 2 === 0;

            const sqEl = document.createElement('div');
            sqEl.className = `square ${isLight ? 'light' : 'dark'}`;

            if (archetype === 'king_of_the_hill' && [0x33, 0x34, 0x43, 0x44].includes(sq)) sqEl.classList.add('center-koth');
            if (archetype === 'portal' && PORTAL_SQUARES[sq] !== undefined) sqEl.classList.add('portal-tile');
            if (archetype === 'fog_of_war' && !visibleSquares.has(sq)) sqEl.classList.add('fog-shrouded');

            if (this.selectedSquare === sq) sqEl.classList.add('selected');
            if (this.premove && (this.premove.from === sq || this.premove.to === sq)) sqEl.classList.add('premove');
            if (lastMove && (lastMove.from === sq || lastMove.to === sq) && (archetype !== 'fog_of_war' || visibleSquares.has(sq))) {
              sqEl.classList.add('last-move');
            }
            if (kingInCheckSq === sq) sqEl.classList.add('in-check');

            if (col === 0) {
              const rLabel = document.createElement('span');
              rLabel.className = 'sq-coord rank';
              rLabel.textContent = 8 - actualRow;
              sqEl.appendChild(rLabel);
            }
            if (row === 7) {
              const fLabel = document.createElement('span');
              fLabel.className = 'sq-coord file';
              fLabel.textContent = String.fromCharCode(97 + actualCol);
              sqEl.appendChild(fLabel);
            }

            if (legalDests.includes(sq)) {
              if (piece) {
                const ring = document.createElement('div');
                ring.className = 'dest-capture-ring';
                sqEl.appendChild(ring);
              } else {
                const dot = document.createElement('div');
                dot.className = 'dest-dot';
                sqEl.appendChild(dot);
              }
            }

            if (piece && (archetype !== 'fog_of_war' || visibleSquares.has(sq))) {
              const pKey = (engine.getColor(piece) === 'w' ? 'w' : 'b') + PIECE_SYMBOLS[piece].toUpperCase();
              sqEl.innerHTML += PIECE_FA_MAP[pKey] || '';
            }

            sqEl.addEventListener('click', () => this.handleSquareClick(sq));
            boardEl.appendChild(sqEl);
          }
        }

        const myHud = document.getElementById('myHud');
        const oppHud = document.getElementById('oppHud');
        if (myHud && oppHud) {
          const isMyTurn = this.activeGame.isPassAndPlay ? true : (engine.turn === this.activeGame.myColor);
          myHud.classList.toggle('active-turn', this.activeGame.isPassAndPlay ? (engine.turn === 'w') : isMyTurn);
          oppHud.classList.toggle('active-turn', this.activeGame.isPassAndPlay ? (engine.turn === 'b') : !isMyTurn);
        }
      }

      handleSquareClick(sq) {
        if (!this.activeGame || this.activeGame.isOver) return;
        const engine = this.activeGame.engine;
        const isPassPlay = this.activeGame.isPassAndPlay;
        const currentMoverColor = isPassPlay ? engine.turn : this.activeGame.myColor;
        const isMyTurn = isPassPlay ? true : (engine.turn === this.activeGame.myColor);

        const piece = engine.board[sq];
        const pieceColor = engine.getColor(piece);

        if (!isMyTurn) {
          if (this.selectedSquare === null) {
            if (piece && pieceColor === this.activeGame.myColor) {
              this.selectedSquare = sq;
              this.renderBoard();
            }
          } else {
            if (sq === this.selectedSquare) {
              this.selectedSquare = null;
              this.premove = null;
            } else {
              this.premove = {
                from: this.selectedSquare,
                to: sq
              };
              this.selectedSquare = null;
            }
            this.renderBoard();
          }
          return;
        }

        if (this.selectedSquare === null) {
          if (piece && pieceColor === currentMoverColor) {
            this.selectedSquare = sq;
            this.renderBoard();
          }
          return;
        }

        if (this.selectedSquare === sq) {
          this.selectedSquare = null;
          this.renderBoard();
          return;
        }

        if (piece && pieceColor === currentMoverColor) {
          this.selectedSquare = sq;
          this.renderBoard();
          return;
        }

        const from = this.selectedSquare;
        const fromPiece = engine.board[from];
        const isPromo = engine.getType(fromPiece) === 1 && ((sq >> 4) === 0 || (sq >> 4) === 7);

        if (isPromo && engine.isLegalMove(from, sq, currentMoverColor === 'w' ? W_QUEEN : B_QUEEN)) {
          this.showPromotionDialog((chosenPromo) => {
            this.executeLocalMove(from, sq, chosenPromo);
          });
        } else {
          this.executeLocalMove(from, sq, null);
        }
      }

      async executeLocalMove(from, to, promo) {
        const engine = this.activeGame.engine;
        const moverColor = engine.turn;
        const moveRecord = engine.execute(from, to, promo);

        if (moveRecord) {
          this.selectedSquare = null;
          this.premove = null;
          sound.playMove();
          if (moveRecord.captured) sound.playCapture();
          if (engine.inCheck()) sound.playCheck();

          if (moverColor === 'w') this.activeGame.whiteTime += this.activeGame.increment;
          else this.activeGame.blackTime += this.activeGame.increment;

          if (!this.activeGame.isBot && !this.activeGame.isPassAndPlay) {
            const moveIdx = engine.moveHistory.length - 1;
            const sig = await security.sign(`${this.activeGame.id}|${moveIdx}|${from}|${to}`);
            net.sendMove(
              this.activeGame.id, {
                from,
                to,
                promotion: promo,
                idx: moveIdx,
                sender: this.user.id,
                whiteTime: this.activeGame.whiteTime,
                blackTime: this.activeGame.blackTime,
                _sig: sig
              },
              engine.turn,
              this.activeGame.whiteTime,
              this.activeGame.blackTime
            );
          }

          if (this.activeGame.isPassAndPlay && this.activeGame.autoFlipPassAndPlay) {
            this.boardFlipped = (engine.turn === 'b');
          }

          this.handleMoveExecuted(moveRecord, true);

          if (this.activeGame.isBot && !this.activeGame.isOver) {
            setTimeout(() => this.triggerBotMove(), 400);
          }
        } else {
          this.selectedSquare = null;
          this.renderBoard();
        }
      }

      handleMoveExecuted(moveRecord, isLocal) {
        this.renderBoard();
        this.renderMoveList();
        this.updateMaterialTrays();

        const endState = this.activeGame.engine.isGameOver();
        if (endState.over) {
          this.endGame(endState.result, endState.reason);
          return;
        }

        if (!isLocal && this.premove && this.activeGame.engine.turn === this.activeGame.myColor) {
          const pm = this.premove;
          this.premove = null;
          const piece = this.activeGame.engine.board[pm.from];
          const isPromo = this.activeGame.engine.getType(piece) === 1 && ((pm.to >> 4) === 0 || (pm.to >> 4) === 7);
          const defaultPromo = isPromo ? (this.activeGame.myColor === 'w' ? W_QUEEN : B_QUEEN) : null;
          if (this.activeGame.engine.isLegalMove(pm.from, pm.to, defaultPromo)) {
            setTimeout(() => this.executeLocalMove(pm.from, pm.to, defaultPromo), 40);
          } else {
            this.renderBoard();
          }
        }
      }

      startClocks() {
        if (this.gameClock) clearInterval(this.gameClock);
        if (this.activeGame.timeControl === 'none') return;
        this.gameClock = setInterval(() => {
          if (!this.activeGame || this.activeGame.isOver) {
            clearInterval(this.gameClock);
            return;
          }
          if (this.activeGame.engine.turn === 'w') {
            this.activeGame.whiteTime = Math.max(0, this.activeGame.whiteTime - 1);
            if (this.activeGame.whiteTime === 0) this.endGame('0-1', 'Timeout');
          } else {
            this.activeGame.blackTime = Math.max(0, this.activeGame.blackTime - 1);
            if (this.activeGame.blackTime === 0) this.endGame('1-0', 'Timeout');
          }
          this.updateClockDisplays();
        }, 1000);
      }

      formatTime(seconds) {
        if (seconds <= 0) return '00:00';
        const m = Math.floor(seconds / 60);
        const s = seconds % 60;
        return `${m.toString().padStart(2, '0')}:${s.toString().padStart(2, '0')}`;
      }

      updateClockDisplays() {
        const myClockEl = document.getElementById('myClock');
        const oppClockEl = document.getElementById('oppClock');
        if (!myClockEl || !oppClockEl || !this.activeGame) return;
        if (this.activeGame.timeControl === 'none') {
          myClockEl.textContent = '∞';
          oppClockEl.textContent = '∞';
          return;
        }
        const isWhite = this.activeGame.isPassAndPlay ? true : (this.activeGame.myColor === 'w');
        const myTime = isWhite ? this.activeGame.whiteTime : this.activeGame.blackTime;
        const oppTime = isWhite ? this.activeGame.blackTime : this.activeGame.whiteTime;
        myClockEl.textContent = this.formatTime(myTime);
        oppClockEl.textContent = this.formatTime(oppTime);
        myClockEl.classList.toggle('low-time', myTime < 30);
        oppClockEl.classList.toggle('low-time', oppTime < 30);
      }

      renderMoveList() {
        const container = document.getElementById('movesContainer');
        if (!container || !this.activeGame) return;
        const moves = this.activeGame.engine.moveHistory;
        let html = '';
        for (let i = 0; i < moves.length; i += 2) {
          html += `<span style="color:var(--text-dim);">${Math.floor(i / 2) + 1}.</span>`;
          html += `<span class="move-token">${moves[i].san}</span>`;
          if (moves[i + 1]) html += `<span class="move-token">${moves[i + 1].san}</span>`;
          html += ' ';
        }
        container.innerHTML = html;
        container.scrollTop = container.scrollHeight;
      }

      /* ========================================================================
         END GAME & ARCHIVE PERSISTENCE
         ======================================================================== */
      async endGame(result, reason) {
        if (!this.activeGame || this.activeGame.isOver) return;
        this.activeGame.isOver = true;
        if (this.gameClock) clearInterval(this.gameClock);
        if (this.activeGameDetach) {
          this.activeGameDetach();
          this.activeGameDetach = null;
        }
        sound.playGameOver();

        const isPassPlay = this.activeGame.isPassAndPlay;
        const myColor = isPassPlay ? 'w' : this.activeGame.myColor;
        const won = (result === '1-0' && myColor === 'w') || (result === '0-1' && myColor === 'b');
        const draw = result === '1/2-1/2';
        const isRated = this.activeGame.rated && !this.activeGame.isBot && !isPassPlay;
        const isFantasy = this.activeGame.gameMode === 'fantasy';

        let ratingDiff = 0;
        let currentElo = isFantasy ? (this.user.fantasyRating || 1200) : (this.user.standardRating || 1200);
        let newRating = currentElo;

        if (isRated) {
          const score = won ? 1 : (draw ? 0.5 : 0);
          const elo = calculateEloChange(currentElo, this.activeGame.opponentRating, score);
          newRating = elo.newRating;
          ratingDiff = elo.delta;
          if (isFantasy) {
            this.user.fantasyRating = newRating;
            if (won) this.user.fantasyWins++;
            else if (draw) this.user.fantasyDraws++;
            else this.user.fantasyLosses++;
          } else {
            this.user.standardRating = newRating;
            this.user.rating = newRating;
            if (won) this.user.standardWins++;
            else if (draw) this.user.standardDraws++;
            else this.user.standardLosses++;
          }
          const canonical = `${this.user.id}|${this.user.standardRating}|${this.user.standardWins}|${this.user.standardLosses}|${this.user.standardDraws}|${this.user.fantasyRating}|${this.user.fantasyWins}|${this.user.fantasyLosses}|${this.user.fantasyDraws}`;
          this.user.sig = await security.sign(canonical);
          await dbManager.put('settings', this.user, 'userProfile');
          net.syncLeaderboard(this.user);
          this.updateTopBar();
        }

        if (!this.activeGame.isBot && !isPassPlay) {
          net.finalizeGame(
            this.activeGame.id,
            myColor === 'w' ? this.user.id : this.activeGame.opponentId,
            myColor === 'b' ? this.user.id : this.activeGame.opponentId,
            result,
            reason
          );
        }

        const archivedGame = {
          gameId: this.activeGame.id,
          white: {
            name: isPassPlay ? 'Player 1 (White)' : (myColor === 'w' ? this.user.name : this.activeGame.opponentName),
            rating: isPassPlay ? 1200 : (myColor === 'w' ? currentElo : this.activeGame.opponentRating)
          },
          black: {
            name: isPassPlay ? 'Player 2 (Black)' : (myColor === 'b' ? this.user.name : this.activeGame.opponentName),
            rating: isPassPlay ? 1200 : (myColor === 'b' ? currentElo : this.activeGame.opponentRating)
          },
          myColor: myColor,
          moves: this.activeGame.engine.moveHistory,
          result: result,
          resultReason: reason,
          timeControl: this.activeGame.timeControl,
          gameMode: this.activeGame.gameMode || 'standard',
          archetype: this.activeGame.archetype || 'classic',
          rated: isRated,
          isBot: this.activeGame.isBot,
          isPassAndPlay: isPassPlay,
          opponentRating: this.activeGame.opponentRating,
          date: new Date().toISOString()
        };
        await dbManager.put('games', archivedGame);

        this.showModal(`
          <div style="text-align:center;">
            <div style="font-size: 36px; margin-bottom: 6px;">${won ? '🏆' : (draw ? '🤝' : '⚔️')}</div>
            <h2 style="font-size: 18px; font-weight: 800;">${isPassPlay ? (result === '1-0' ? 'White Wins!' : (result === '0-1' ? 'Black Wins!' : 'Drawn Game')) : (won ? 'Victory!' : (draw ? 'Drawn Game' : 'Defeat'))}</h2>
            <p style="font-size: 12px; color: var(--text-muted); margin-top: 3px;">
              ${reason} (${result}) • <span class="mode-pill ${isFantasy ? 'fantasy' : 'standard'}">${isFantasy ? 'Fantasy' : (isPassPlay ? 'Pass & Play' : 'Standard')}</span>
            </p>
            <div style="background:var(--bg-surface); padding:10px; border-radius:var(--radius-md); margin:14px 0;">
              ${isRated ? `
                <div style="font-size:11px; color:var(--text-muted);">${isFantasy ? 'Fantasy' : 'Standard'} Elo Rating</div>
                <div style="font-size:22px; font-weight:800; color:var(--accent-amber); font-family:var(--font-mono);">
                  ${newRating} <span style="font-size:13px; color:${ratingDiff >= 0 ? 'var(--accent-emerald)' : 'var(--accent-rose)'};">${ratingDiff >= 0 ? '+' : ''}${ratingDiff}</span>
                </div>
              ` : `
                <div style="font-size:12px; color:var(--text-muted); font-weight:600;">
                  <i class="fa-solid fa-mug-hot"></i> Unrated / Casual Match (Elo unchanged)
                </div>
              `}
            </div>
            <button class="btn btn-primary btn-full" id="btnModalClose">Return to Lobby</button>
          </div>
        `, (modal) => {
          modal.querySelector('#btnModalClose').addEventListener('click', () => {
            this.closeModal();
            this.navigateTo('home');
          });
        });
      }

      showPromotionDialog(callback) {
        const isWhite = this.activeGame.engine.turn === 'w';
        const opts = [{
            type: isWhite ? W_QUEEN : B_QUEEN,
            key: isWhite ? 'wQ' : 'bQ'
          },
          {
            type: isWhite ? W_ROOK : B_ROOK,
            key: isWhite ? 'wR' : 'bR'
          },
          {
            type: isWhite ? W_BISHOP : B_BISHOP,
            key: isWhite ? 'wB' : 'bB'
          },
          {
            type: isWhite ? W_KNIGHT : B_KNIGHT,
            key: isWhite ? 'wN' : 'bN'
          }
        ];

        let promoHtml = '<div class="promo-dialog">';
        for (let opt of opts) promoHtml += `<div class="promo-opt" data-piece="${opt.type}">${PIECE_FA_MAP[opt.key]}</div>`;
        promoHtml += '</div>';

        this.showModal(`
          <div style="text-align:center;">
            <h3 style="font-size:15px; font-weight:700;">Promote Pawn</h3>
            ${promoHtml}
          </div>
        `, (modal) => {
          modal.querySelectorAll('.promo-opt').forEach(optEl => {
            optEl.addEventListener('click', () => {
              const pieceType = parseInt(optEl.getAttribute('data-piece'), 10);
              this.closeModal();
              callback(pieceType);
            });
          });
        });
      }

      showDrawOfferDialog() {
        this.showModal(`
          <div style="text-align:center;">
            <div style="font-size:30px; margin-bottom:6px;">🤝</div>
            <h3 style="font-size:15px; font-weight:700;">Draw Offered</h3>
            <p style="font-size:12px; color:var(--text-muted); margin:6px 0 14px;">Opponent has offered a draw.</p>
            <div style="display:flex; gap:8px;">
              <button class="btn btn-primary" id="btnAcceptDraw" style="flex:1;">Accept</button>
              <button class="btn" id="btnDeclineDraw" style="flex:1;">Decline</button>
            </div>
          </div>
        `, (modal) => {
          modal.querySelector('#btnAcceptDraw').addEventListener('click', () => {
            this.closeModal();
            net.sendStateEvent(this.activeGame.id, {
              action: 'draw-accept',
              sender: this.user.id
            });
            this.endGame('1/2-1/2', 'Mutual Agreement');
          });
          modal.querySelector('#btnDeclineDraw').addEventListener('click', () => {
            this.closeModal();
            net.sendStateEvent(this.activeGame.id, {
              action: 'draw-decline',
              sender: this.user.id
            });
          });
        });
      }

      /* ========================================================================
         STUDIO SCREEN: DEDICATED LIVE ANALYSIS & BOARD EDITOR
         ======================================================================== */
      renderStudioScreen(container) {
        container.innerHTML = `
          <div class="sub-tabs">
            <button class="sub-tab-btn ${this.studioSubTab === 'analysis' ? 'active' : ''}" id="tabStudioAnalysis">
              <i class="fa-solid fa-microchip"></i> Live Analysis
            </button>
            <button class="sub-tab-btn ${this.studioSubTab === 'editor' ? 'active' : ''}" id="tabStudioEditor">
              <i class="fa-solid fa-paintbrush"></i> Board Editor
            </button>
          </div>

          <!-- EVAL BAR -->
          <div class="eval-gauge">
            <div class="eval-gauge-fill" id="studioEvalFill"></div>
          </div>
          <div style="display:flex; justify-content:space-between; align-items:center; font-size:11px; margin-bottom:6px;">
            <span style="font-family:var(--font-mono); font-weight:800; color:var(--accent-amber);" id="studioEvalText">0.00</span>
            <span style="color:var(--text-muted);" id="studioOpeningText">Starting Position</span>
          </div>

          <!-- BOARD WRAPPER -->
          <div class="board-wrapper">
            <svg id="studioArrowsSvg" style="position:absolute; inset:0; width:100%; height:100%; pointer-events:none; z-index:10;"></svg>
            <div class="board-grid" id="studioBoard"></div>
          </div>

          <!-- CONTROLS CONTAINER -->
          <div id="studioControlsArea" style="margin-top:8px;"></div>
        `;

        container.querySelector('#tabStudioAnalysis').addEventListener('click', () => {
          this.studioSubTab = 'analysis';
          this.renderStudioScreen(container);
        });
        container.querySelector('#tabStudioEditor').addEventListener('click', () => {
          this.studioSubTab = 'editor';
          this.renderStudioScreen(container);
        });

        this.renderStudioBoard();
        this.renderStudioControls();
        this.runStudioAnalysis();
      }

      renderStudioBoard() {
        const boardEl = document.getElementById('studioBoard');
        if (!boardEl) return;
        boardEl.innerHTML = '';
        const engine = this.studioEngine;
        const lastMove = engine.moveHistory[engine.moveHistory.length - 1];

        let legalDests = [];
        if (this.studioSubTab === 'analysis' && this.studioSelectedSq !== null) {
          legalDests = engine.getLegalMoves().filter(m => m.from === this.studioSelectedSq).map(m => m.to);
        }

        for (let row = 0; row < 8; row++) {
          for (let col = 0; col < 8; col++) {
            const sq = (row << 4) | col;
            const piece = engine.board[sq];
            const isLight = (row + col) % 2 === 0;

            const sqEl = document.createElement('div');
            sqEl.className = `square ${isLight ? 'light' : 'dark'}`;

            if (this.studioSelectedSq === sq) sqEl.classList.add('selected');
            if (lastMove && (lastMove.from === sq || lastMove.to === sq)) sqEl.classList.add('last-move');

            if (legalDests.includes(sq)) {
              if (piece) {
                const ring = document.createElement('div');
                ring.className = 'dest-capture-ring';
                sqEl.appendChild(ring);
              } else {
                const dot = document.createElement('div');
                dot.className = 'dest-dot';
                sqEl.appendChild(dot);
              }
            }

            if (piece) {
              const pKey = (engine.getColor(piece) === 'w' ? 'w' : 'b') + PIECE_SYMBOLS[piece].toUpperCase();
              sqEl.innerHTML += PIECE_FA_MAP[pKey] || '';
            }

            sqEl.addEventListener('click', () => this.handleStudioSquareClick(sq));
            boardEl.appendChild(sqEl);
          }
        }
      }

      handleStudioSquareClick(sq) {
        if (this.studioSubTab === 'editor') {
          // Place piece from palette or clear
          if (this.studioEditorPiece === 'clear') {
            this.studioEngine.board[sq] = EMPTY;
          } else {
            const color = this.studioEditorPiece[0];
            const sym = this.studioEditorPiece[1];
            const type = {
              P: 1,
              N: 2,
              B: 3,
              R: 4,
              Q: 5,
              K: 6
            } [sym];
            this.studioEngine.board[sq] = color === 'w' ? type : (type | 8);
          }
          this.renderStudioBoard();
          this.runStudioAnalysis();
          return;
        }

        // Live Analysis Moves
        const engine = this.studioEngine;
        if (this.studioSelectedSq === null) {
          const piece = engine.board[sq];
          if (piece && engine.getColor(piece) === engine.turn) {
            this.studioSelectedSq = sq;
            this.renderStudioBoard();
          }
          return;
        }

        if (this.studioSelectedSq === sq) {
          this.studioSelectedSq = null;
          this.renderStudioBoard();
          return;
        }

        const from = this.studioSelectedSq;
        const fromPiece = engine.board[from];
        const isPromo = engine.getType(fromPiece) === 1 && ((sq >> 4) === 0 || (sq >> 4) === 7);
        const promo = isPromo ? (engine.turn === 'w' ? W_QUEEN : B_QUEEN) : null;
        const res = engine.execute(from, sq, promo);

        this.studioSelectedSq = null;
        if (res) {
          sound.playMove();
          if (res.captured) sound.playCapture();
        }
        this.renderStudioBoard();
        this.runStudioAnalysis();
      }

      runStudioAnalysis() {
        if (!sfService.isLoaded) return;
        const fen = this.studioEngine.generateFen();
        const myFen = fen; // for race check

        sfService.fetchOpening(fen).then(name => {
          if (this.studioEngine.generateFen() !== myFen) return;
          const el = document.getElementById('studioOpeningText');
          if (el) el.textContent = name || 'Custom Position';
        });

        if (this.studioDebounce) clearTimeout(this.studioDebounce);
        this.studioDebounce = setTimeout(() => {
          sfService.send('stop');
          // Important: reset MultiPV to 1 after analysis if you use 2 elsewhere
          sfService.send('setoption name MultiPV value 1');
          sfService.send(`position fen ${fen}`);
          sfService.send('go depth 16');

          if (this.sfDetach) this.sfDetach();
          this.sfDetach = sfService.addListener((line) => {
            // Only take multipv 1, deepest depth
            if (!line.includes(' multipv 1 ') && line.includes(' multipv ')) return;
            if (!line.includes('score')) return;

            const m = line.match(/score (cp|mate) (-?\d+)/);
            if (!m) return;

            const type = m[1];
            const raw = parseInt(m[2], 10); // side-to-move POV
            const isBlackTurn = this.studioEngine.turn === 'b';
            const whitePov = isBlackTurn ? -raw : raw; // convert to white POV once

            const evalTextEl = document.getElementById('studioEvalText');
            const fillEl = document.getElementById('studioEvalFill');

            if (evalTextEl && fillEl) {
              if (type === 'mate') {
                // whitePov > 0 = white mates
                evalTextEl.textContent = whitePov > 0 ? `M${Math.abs(raw)}` : `-M${Math.abs(raw)}`;
                fillEl.style.width = whitePov > 0 ? '95%' : '5%';
              } else {
                evalTextEl.textContent = (whitePov >= 0 ? '+' : '') + (whitePov / 100).toFixed(2);
                // use same 0.00368 formula as review so bar matches accuracy
                const winP = 50 + 50 * (2 / (1 + Math.exp(-0.00368208 * whitePov)) - 1);
                fillEl.style.width = `${Math.max(5, Math.min(95, winP))}%`;
              }
            }

            const pvMatch = line.match(/ pv (.+)/);
            if (pvMatch) {
              const uci = pvMatch[1].trim().split(' ')[0];
              if (uci?.length >= 4) {
                const from = ChessGame.coordToSq(uci.substring(0, 2));
                const to = ChessGame.coordToSq(uci.substring(2, 4));
                const arrowSvg = document.getElementById('studioArrowsSvg');
                if (arrowSvg) arrowSvg.innerHTML = renderBoardArrow(from, to, 'rgba(245, 158, 11, 0.85)', false);
              }
              const linesEl = document.getElementById('studioEngineLines');
              if (linesEl) {
                linesEl.innerHTML = `<div style="color:var(--text-main); font-size:11px;">${pvMatch[1].trim().split(' ').slice(0, 8).join(' ')}</div>`;
              }
            }
          });
        }, 150); // debounce piece moves
      }

      renderViewerBoard() {
        const boardEl = document.getElementById('viewerBoard');
        if (!boardEl || !this.viewerGame) return;
        boardEl.innerHTML = '';

        const engine = new ChessGame(this.viewerGame.archetype || 'standard');
        for (let i = 0; i <= this.viewerMoveIdx; i++) {
          const m = this.viewerGame.moves[i];
          engine.execute(m.from, m.to, m.promotion);
        }

        const lastMove = engine.moveHistory[engine.moveHistory.length - 1];
        const currentReviewMove = (this.viewerMoveIdx >= 0 && this.viewerGame.moves) ? this.viewerGame.moves[this.viewerMoveIdx] : null;

        for (let row = 0; row < 8; row++) {
          for (let col = 0; col < 8; col++) {
            const sq = (row << 4) | col;
            const piece = engine.board[sq];
            const isLight = (row + col) % 2 === 0;

            const sqEl = document.createElement('div');
            sqEl.className = `square ${isLight ? 'light' : 'dark'}`;
            if (lastMove && (lastMove.from === sq || lastMove.to === sq)) sqEl.classList.add('last-move');

            if (col === 0) {
              const rLabel = document.createElement('span');
              rLabel.className = 'sq-coord rank';
              rLabel.textContent = 8 - row;
              sqEl.appendChild(rLabel);
            }
            if (row === 7) {
              const fLabel = document.createElement('span');
              fLabel.className = 'sq-coord file';
              fLabel.textContent = String.fromCharCode(97 + col);
              sqEl.appendChild(fLabel);
            }

            if (piece) {
              const pKey = (engine.getColor(piece) === 'w' ? 'w' : 'b') + PIECE_SYMBOLS[piece].toUpperCase();
              sqEl.innerHTML += PIECE_FA_MAP[pKey] || '';

                great: '!',
                best: '★',
                excellent: '👍',
                good: '✓',
                inaccuracy: '?!',
                mistake: '?',
                miss: '✕',
                blunder: '??'
              };
              b.textContent = badgeIcons[currentReviewMove.quality] || '';
              sqEl.appendChild(b);
            }

            boardEl.appendChild(sqEl);
          }
        }
      }

      /* ========================================================================
         STOCKFISH POSITION REVIEW & CLASSIFICATION - PATCHED V3
         Drop-in for executeGameReview()
      ======================================================================== */
      async executeGameReview() {
        if (!this.viewerGame || !this.viewerGame.moves || this.viewerGame.moves.length === 0) return;
        if (this.viewerGame.reviewReport) {
          this.showReviewReportModal(this.viewerGame.reviewReport);
          return;
        }

        this.showModal(`
    <div style="text-align:center;">
      <i class="fa-solid fa-microchip" style="font-size:32px; color:var(--accent-cyan); margin-bottom:10px;"></i>
      <h3 style="font-size:16px; font-weight:800;">Reviewing Game</h3>
      <p style="font-size:12px; color:var(--text-muted); margin:4px 0 12px;" id="revStatusMsg">Evaluating positions with Stockfish...</p>
      <div style="width:100%; height:8px; background:var(--bg-surface); border-radius:4px; overflow:hidden; border:1px solid var(--border-color);">
        <div id="revProgressFill" style="width:0%; height:100%; background:var(--accent-cyan); transition:width 0.2s;"></div>
      </div>
    </div>
  `);

        const moves = this.viewerGame.moves;
        const sim = new ChessGame(this.viewerGame.archetype || 'standard');
        const posEvaluations = []; // { cpWhite, bestMove, pv }

        const wp = (cp) => 50 + 50 * (2 / (1 + Math.exp(-0.00368208 * cp)) - 1);
        const isMate = (v) => Math.abs(v) >= 9000;

        for (let i = 0; i <= moves.length; i++) {
          const fen = sim.generateFen();
          const turn = sim.turn; // 'w' to move in this fen
          const pEl = document.getElementById('revProgressFill');
          const sEl = document.getElementById('revStatusMsg');
          if (pEl) pEl.style.width = `${Math.round(((i + 1) / (moves.length + 1)) * 100)}%`;
          if (sEl) sEl.textContent = `Analyzing move ${i} of ${moves.length}...`;

          let cpWhite = 0,
            bestMove = '',
            pv = '';

          // 1. Cloud eval - Lichess returns cp from WHITE POV
          try {
            const cloud = await fetch(`https://lichess.org/api/cloud-eval?fen=${encodeURIComponent(fen)}&multiPv=1`);
            if (cloud.ok) {
              const cData = await cloud.json();
              if (cData?.pvs?.[0]) {
                const p = cData.pvs[0];
                if (p.mate !== undefined && p.mate !== null) {
                  let ms = 10000 - Math.abs(p.mate) * 10;
                  cpWhite = p.mate > 0 ? ms : -ms;
                } else if (p.cp !== undefined) {
                  cpWhite = p.cp; // already white POV
                }
                pv = p.moves || '';
                bestMove = pv.split(' ')[0] || '';
              }
            }
          } catch {}

          // 2. Local Stockfish fallback - UCI cp is from SIDE TO MOVE, convert to white POV
          if (!bestMove && sfService.isLoaded) {
            let localCpSide = 0;
            let localMate = null;
            await new Promise((resolve) => {
              const det = sfService.addListener((line) => {
                if (line.includes('score cp')) {
                  const m = line.match(/score cp (-?\d+)/);
                  if (m) localCpSide = parseInt(m[1], 10);
                  localMate = null;
                }
                if (line.includes('score mate')) {
                  const m = line.match(/score mate (-?\d+)/);
                  if (m) localMate = parseInt(m[1], 10);
                }
                if (line.includes('bestmove')) {
                  det();
                  const m = line.match(/bestmove (\S+)/);
                  if (m && m[1] !== '(none)') bestMove = m[1];
                  resolve();
                }
              });
              sfService.send(`position fen ${fen}`);
              sfService.send(`go depth 14 movetime 2500`);
              setTimeout(() => {
                det();
                resolve();
              }, 2800);
            });
            if (localMate !== null) {
              let ms = 10000 - Math.abs(localMate) * 10;
              let mateSide = localMate > 0 ? ms : -ms;
              cpWhite = turn === 'w' ? mateSide : -mateSide;
            } else if (bestMove || localCpSide !== 0) {
              cpWhite = turn === 'w' ? localCpSide : -localCpSide;
            }
          }

          posEvaluations.push({
            cpWhite,
            bestMove,
            pv,
            turn
          });
          if (i < moves.length) sim.execute(moves[i].from, moves[i].to, moves[i].promotion);
        }

        // Classification
        let wAccSum = 0,
          bAccSum = 0,
          wCount = 0,
          bCount = 0;
        const wBreakdown = {
          brilliant: 0,
          great: 0,
          best: 0,
          excellent: 0,
          good: 0,
          book: 0,
          inaccuracy: 0,
          mistake: 0,
          miss: 0,
          blunder: 0
        };
        const bBreakdown = {
          brilliant: 0,
          great: 0,
          best: 0,
          excellent: 0,
          good: 0,
          book: 0,
          inaccuracy: 0,
          mistake: 0,
          miss: 0,
          blunder: 0
        };

        for (let i = 0; i < moves.length; i++) {
          const move = moves[i];
          const before = posEvaluations[i];
          const after = posEvaluations[i + 1];
          const mover = before.turn; // who made move i

          // Convert white POV -> mover POV
          const cpBeforeMover = mover === 'w' ? before.cpWhite : -before.cpWhite;
          const cpAfterMover = mover === 'w' ? after.cpWhite : -after.cpWhite;
          const cpLoss = cpBeforeMover - cpAfterMover;
          const wpDrop = wp(cpBeforeMover) - wp(cpAfterMover);

          const actualUci = ChessGame.sqToCoord(move.from) + ChessGame.sqToCoord(move.to) + (move.promotion || '').toLowerCase();
          const engineUci = (before.bestMove || '').toLowerCase();
          const playedBest = engineUci && actualUci.slice(0, 4) === engineUci.slice(0, 4);

          let quality = 'good';
          let coachText = '';

          // --- TOP MOVE ---
          if (playedBest) {
            if (cpBeforeMover <= -300 && cpAfterMover >= 200) {
              quality = 'brilliant';
              coachText = 'Spectacular turnaround find!';
            } else if (isMate(cpAfterMover) && !isMate(cpBeforeMover) && cpAfterMover > 0) {
              quality = 'great';
              coachText = 'Excellent - you found the forced mate!';
            } else if (cpAfterMover - cpBeforeMover >= 200 && cpBeforeMover <= 50) {
              quality = 'great';
              coachText = 'Great move - big improvement from a tough spot.';
            } else {
              quality = 'best';
              coachText = 'The engine top move.';
            }
          } else {
            // --- NOT TOP ---
            if (cpLoss <= 10) quality = 'best';
            else if (cpLoss <= 25) quality = 'excellent';
            else if (cpLoss <= 50) quality = 'good';
            else if (cpLoss <= 110) {
              if (cpBeforeMover >= 300) quality = 'miss';
              else quality = 'inaccuracy';
            } else if (cpLoss <= 250) {
              if (isMate(cpBeforeMover) && cpBeforeMover > 0) quality = 'miss';
              else if (cpBeforeMover >= 150) quality = 'miss';
              else quality = 'mistake';
            } else {
              quality = 'blunder';
            }

            // Override: allowing mate is always blunder
            if (isMate(cpAfterMover) && cpAfterMover < 0 && !isMate(cpBeforeMover)) quality = 'blunder';
            // Was getting mated, delayed it = not blunder
            if (isMate(cpBeforeMover) && cpBeforeMover < 0 && isMate(cpAfterMover) && cpAfterMover < 0) {
              quality = cpLoss <= 50 ? 'good' : cpLoss <= 150 ? 'inaccuracy' : 'mistake';
            }
          }

          // Book: if early and eval stable, mark as book
          const fenBase = before.pv ? '' : ''; // placeholder
          if (this.openingCache && quality !== 'blunder') {
            const base = posEvaluations[i].turn + '|' + Math.floor(before.cpWhite / 50);
            // use your existing openingCache lookup
          }

          // Coach text fallback
          if (!coachText) {
            if (quality === 'excellent') coachText = `Very close to best. ${before.bestMove} was slightly preferred.`;
            else if (quality === 'good') coachText = `Solid, but ${before.bestMove} was more accurate.`;
            else if (quality === 'inaccuracy') coachText = `Inaccuracy. Lost ~${(cpLoss/100).toFixed(1)} pawns. Better was ${before.bestMove}.`;
            else if (quality === 'mistake') coachText = `Mistake losing ~${(cpLoss/100).toFixed(1)} pawns. ${before.bestMove} was best.`;
            else if (quality === 'miss') coachText = `Missed win! ${before.bestMove} was crushing.`;
            else if (quality === 'blunder') coachText = `Blunder! Allows mate or big swing. Needed ${before.bestMove}.`;
          }

          move.quality = quality;
          move.coachText = coachText;
          move.bestUci = before.bestMove;
          move.cpLoss = cpLoss;
          move.wpDrop = wpDrop;

          // Accuracy using win prob like v1, better than v1 linear
          let acc = 100;
          if (['book', 'brilliant', 'great', 'best'].includes(quality)) acc = 100;
          else if (quality === 'excellent') acc = Math.max(80, 100 - wpDrop * 1.2);
          else if (quality === 'good') acc = Math.max(60, 92 - wpDrop * 1.8);
          else if (quality === 'inaccuracy') acc = Math.max(35, 70 - wpDrop * 2);
          else if (quality === 'mistake') acc = Math.max(15, 45 - wpDrop * 1.5);
          else if (quality === 'miss') acc = Math.max(10, 35 - wpDrop * 1.5);
          else if (quality === 'blunder') acc = Math.max(0, 15 - wpDrop);

          if (mover === 'w') {
            wAccSum += acc;
            wCount++;
            wBreakdown[quality]++;
          } else {
            bAccSum += acc;
            bCount++;
            bBreakdown[quality]++;
          }
        }

        const report = {
          whiteAccuracy: wCount ? Math.round(wAccSum / wCount) : 100,
          blackAccuracy: bCount ? Math.round(bAccSum / bCount) : 100,
          whiteBreakdown: wBreakdown,
          blackBreakdown: bBreakdown,
          evaluations: posEvaluations
        };

        this.viewerGame.reviewReport = report;
        await dbManager.put('games', this.viewerGame);
        this.closeModal();
        this.renderViewerBoard();
        this.updateViewerCoachBox();
        this.showReviewReportModal(report);
      }

      showReviewReportModal(report) {

            <div class="card" style="text-align:center; padding:10px 4px; margin-bottom:0;">
              <div style="font-size:10px; color:var(--text-muted);">Standard Elo</div>
              <div style="font-size:16px; font-weight:800; color:var(--accent-amber); font-family:var(--font-mono);">${this.user.standardRating}</div>

            <div class="card" style="text-align:center; padding:10px 4px; margin-bottom:0;">

              <div style="font-size:10px; color:var(--text-muted);">Fantasy Elo</div>
              <div style="font-size:16px; font-weight:800; color:var(--accent-purple); font-family:var(--font-mono);">${this.user.fantasyRating}</div>
            </div>

      /* ========================================================================
         SETTINGS & CUSTOMIZER MODAL
         ======================================================================== */
      showSettingsModal() {
        const currentAvatar = (this.user && typeof this.user.avatar === 'string') ? this.user.avatar : 'fa-solid fa-chess-knight';
        const isHttpAvatar = currentAvatar.startsWith('http://') || currentAvatar.startsWith('https://') || currentAvatar.startsWith('data:image');
        const emojis = ['♟️', '♞', '♝', '♜', '♛', '♚', '🧙‍♂️', '🤖', '⚡', '🐉', '🛡️', '⚔️', '🦊', '🦉', '🦁'];

        const content = `
          <div style="display:flex; flex-direction:column; gap:14px;">
            <div>
              <label style="display:block; font-size:11px; font-weight:700; color:var(--text-muted); text-transform:uppercase; margin-bottom:5px;">Display Name</label>
              <input id="settingsUsername" type="text" class="input-field" value="${this.escapeHtml(this.user.name)}">
            </div>
            <div>
              <label style="display:block; font-size:11px; font-weight:700; color:var(--text-muted); text-transform:uppercase; margin-bottom:5px;">Avatar Character</label>
              <div style="display:flex; flex-wrap:wrap; gap:6px; margin-bottom:8px;">
                ${emojis.map(e => `
                  <button type="button" class="avatar-opt-btn" data-avatar="${e}" style="width:36px; height:36px; font-size:18px;">${e}</button>
                `).join('')}
              </div>
              <label style="display:block; font-size:10px; font-weight:600; color:var(--text-muted); margin-bottom:3px;">Or Custom Image URL</label>
              <input id="settingsCustomAvatar" type="text" class="input-field" placeholder="https://..." value="${isHttpAvatar ? this.escapeHtml(currentAvatar) : ''}">
            </div>
            <div>
              <label style="display:block; font-size:11px; font-weight:700; color:var(--text-muted); text-transform:uppercase; margin-bottom:5px;">Board Theme</label>
              <select id="settingsBoardTheme" class="input-field">
                <option value="emerald" ${this.settings?.theme === 'emerald' ? 'selected' : ''}>Emerald (Classic)</option>
                <option value="wood" ${this.settings?.theme === 'wood' ? 'selected' : ''}>Warm Wood</option>
                <option value="obsidian" ${this.settings?.theme === 'obsidian' ? 'selected' : ''}>Obsidian Cyber</option>
                <option value="blue" ${this.settings?.theme === 'blue' ? 'selected' : ''}>Ocean Blue</option>
              </select>
            </div>
            <div>
              <label style="display:flex; align-items:center; gap:8px; cursor:pointer; font-size:13px; font-weight:600;">
                <input id="settingsSoundToggle" type="checkbox" ${sound.enabled ? 'checked' : ''} style="width:16px; height:16px; accent-color:var(--accent-emerald);">
                Enable Sound Effects (Web Audio)
              </label>
            </div>
          </div>
        `;

        this.showModal('Settings & Profile', content, [{
            label: 'Cancel',
            class: 'btn',
            onClick: () => this.closeModal()
          },
          {
            label: 'Save Changes',
            class: 'btn btn-primary',
            onClick: async () => {
              const newName = document.getElementById('settingsUsername')?.value.trim();
              const customAvatar = document.getElementById('settingsCustomAvatar')?.value.trim();
              const selectedTheme = document.getElementById('settingsBoardTheme')?.value || 'emerald';
              const soundEnabled = document.getElementById('settingsSoundToggle')?.checked;

              if (newName) this.user.name = newName;
              if (customAvatar) {
                this.user.avatar = customAvatar;
              } else if (this.selectedModalAvatar) {
                this.user.avatar = this.selectedModalAvatar;
              }

              this.settings.theme = selectedTheme;
              this.settings.sound = !!soundEnabled;
              sound.enabled = this.settings.sound;

              this.applyTheme(selectedTheme);
              await dbManager.put('settings', this.user, 'userProfile');
              await dbManager.put('settings', this.settings, 'appSettings');
              net.syncLeaderboard(this.user);

              this.updateTopBar();
              this.closeModal();
              this.renderScreen();
              this.showToast('Settings saved!');
            }
          }
        ]);

        this.selectedModalAvatar = this.user.avatar;
        const btns = document.querySelectorAll('.avatar-opt-btn');
        const customInp = document.getElementById('settingsCustomAvatar');
        btns.forEach(btn => {
          btn.onclick = () => {
            btns.forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            this.selectedModalAvatar = btn.getAttribute('data-avatar');
            if (customInp) customInp.value = '';
          };
        });
        if (customInp) {
          customInp.oninput = () => {
            btns.forEach(b => b.classList.remove('active'));
          };
        }
      }

      /* ========================================================================
         UNIFIED DUAL-MODE MODAL SYSTEM
         Supports:
           - showModal(rawHtml, onRenderCallback)
           - showModal(title, contentHtml, actionsArray)
         ======================================================================== */
      showModal(arg1, arg2, arg3) {
        const host = document.getElementById('modalHost');
        if (!host) return;

        let modalHtml = '';
        let isStructured = typeof arg2 === 'string' && Array.isArray(arg3);

        if (isStructured) {
          const title = arg1;
          const content = arg2;
          const actions = arg3 || [];
          modalHtml = `
            <div class="modal-overlay" id="modalBackdrop">
              <div class="modal-sheet">
                <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:14px; border-bottom:1px solid var(--border-color); padding-bottom:8px;">
                  <h3 style="font-size:16px; font-weight:800; color:var(--text-main);">${this.escapeHtml(title)}</h3>
                  <button id="modalCloseX" class="btn-icon" style="border:none;"><i class="fa-solid fa-xmark"></i></button>
                </div>
                <div>${content}</div>
                <div style="display:flex; justify-content:flex-end; gap:8px; margin-top:16px; border-top:1px solid var(--border-color); padding-top:10px;">
                  ${actions.map((act, idx) => `
                    <button id="modalActionBtn_${idx}" class="${act.class || 'btn'}">${this.escapeHtml(act.label)}</button>
                  `).join('')}
                </div>
              </div>
            </div>
          `;
          host.innerHTML = modalHtml;
          document.getElementById('modalCloseX').onclick = () => this.closeModal();
          actions.forEach((act, idx) => {
            const btn = document.getElementById(`modalActionBtn_${idx}`);
            if (btn && act.onClick) btn.onclick = act.onClick;
          });
        } else {
          const rawContent = arg1;
          const onRender = typeof arg2 === 'function' ? arg2 : null;
          modalHtml = `
            <div class="modal-overlay" id="modalBackdrop">
              <div class="modal-sheet" id="modalInnerSheet">
                ${rawContent}
              </div>
            </div>
          `;
          host.innerHTML = modalHtml;
          if (onRender) onRender(host.querySelector('#modalInnerSheet'));
        }

        const backdrop = document.getElementById('modalBackdrop');
        if (backdrop) {
          backdrop.onclick = (e) => {
            if (e.target === backdrop) this.closeModal();
          };
        }
      }

      closeModal() {
        const host = document.getElementById('modalHost');
        if (host) host.innerHTML = '';
      }

      applyTheme(theme) {
        const root = document.documentElement;
        if (theme === 'wood') {
          root.style.setProperty('--board-light', '#eed8b1');
          root.style.setProperty('--board-dark', '#b57945');
        } else if (theme === 'obsidian') {
          root.style.setProperty('--board-light', '#474c54');
          root.style.setProperty('--board-dark', '#202328');
        } else if (theme === 'blue') {
          root.style.setProperty('--board-light', '#dee3e6');
          root.style.setProperty('--board-dark', '#7d9cb3');
        } else {
          // Default Emerald
          root.style.setProperty('--board-light', '#eceecd');
          root.style.setProperty('--board-dark', '#739552');
        }
      }

      generatePGN(game) {
        if (!game) return '';
        const date = new Date(game.date || Date.now()).toISOString().split('T')[0].replace(/-/g, '.');
        let pgn = `[Event "${game.gameMode || 'Standard'} Match"]\n`;
        pgn += `[Site "Chess Community Platform"]\n`;
        pgn += `[Date "${date}"]\n`;
        pgn += `[White "${this.escapeHtml(game.white?.name || 'White')}"]\n`;
        pgn += `[Black "${this.escapeHtml(game.black?.name || 'Black')}"]\n`;
        pgn += `[Result "${game.result || '*'}"]\n\n`;

        const moves = game.moves || [];
        let moveStr = '';
        for (let i = 0; i < moves.length; i += 2) {
          const num = Math.floor(i / 2) + 1;
          const wMove = moves[i]?.san || '';
          const bMove = moves[i + 1]?.san || '';
          moveStr += `${num}. ${wMove} ${bMove ? bMove + ' ' : ''}`;
        }
        pgn += (moveStr.trim() + ' ' + (game.result || '*')).trim();
        return pgn;
      }
    }

    /* ==========================================================================
       APPLICATION ENTRY POINT
       ========================================================================== */
    document.addEventListener('DOMContentLoaded', async () => {
      window.app = new ChessApp();
      window.app.settings = {
        theme: 'emerald',
        sound: true
      };
      await window.app.init();
    });

  </script>
