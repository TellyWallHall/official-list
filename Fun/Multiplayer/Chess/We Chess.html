          this.createLiveChallenge({
            timeControl: '5+0',
            colorPref: 'random',
            rated: true,
            gameMode: 'standard',
            archetype: 'classic'
          });
        });
        container.querySelector('#btnGoPlayHub').addEventListener('click', () => this.navigateTo('play'));
        container.querySelector('#btnPlayBot').addEventListener('click', () => this.startBotGame(1200, '5+0'));
        container.querySelector('#btnPlayMasterBot').addEventListener('click', () => this.startBotGame(1600, '10+0'));

        container.querySelectorAll('.sub-tab-btn').forEach(btn => {
          btn.addEventListener('click', () => {
            this.lobbySubTab = btn.getAttribute('data-tab');
            container.querySelectorAll('.sub-tab-btn').forEach(b => b.classList.toggle('active', b === btn));
            this.renderLobbySubTab();
          });
        });

        this.renderLobbySubTab();
      }

      renderLobbySubTab() {
        const target = document.getElementById('lobbyTabContent');
        if (!target) return;

        if (this.lobbySubTab === 'challenges') {
          target.innerHTML = `<div id="challengeList" style="display:flex; flex-direction:column; gap:6px;"></div>`;
          net.listenChallenges((challenges) => {
            const listEl = document.getElementById('challengeList');
            if (!listEl) return;
            listEl.innerHTML = '';

            if (this.myCreatedChallengeId && challenges[this.myCreatedChallengeId]) {
              const myChal = challenges[this.myCreatedChallengeId];
              if (myChal.status === 'accepted' && myChal.gameId) {
                const gameId = myChal.gameId;
                this.myCreatedChallengeId = null;
                this.loadAndEnterGame(gameId);
                return;
              }
            }

            const openKeys = Object.keys(challenges).filter(k => challenges[k] && challenges[k].status === 'open');
            if (openKeys.length === 0) {
              listEl.innerHTML = `<div style="text-align: center; color: var(--text-dim); padding: 14px; font-size: 13px;">No open challenges. Tap "Quick Match" or create one in the Play tab!</div>`;
              return;
            }

            openKeys.forEach(k => {
              const c = challenges[k];
              const isMine = c.creatorId === this.user.id;
              const isFantasy = c.gameMode === 'fantasy';
              const item = document.createElement('div');
              item.className = 'card';
              item.style.padding = '8px 12px';
              item.style.display = 'flex';
              item.style.alignItems = 'center';
              item.style.justifyContent = 'space-between';
              item.style.marginBottom = '0';

              item.innerHTML = `
                <div style="display: flex; align-items: center; gap: 8px;">
                  <div class="avatar-badge user-click" data-uid="${c.creatorId}" data-name="${c.creatorName}" data-rating="${c.creatorRating}">
                    ${this.getAvatarHtml(c, 30)}
                  </div>
                  <div>
                    <div style="font-size: 13px; font-weight: 700; display:flex; align-items:center; gap:4px;">
                      <span class="user-click" style="cursor:pointer;" data-uid="${c.creatorId}" data-name="${c.creatorName}" data-rating="${c.creatorRating}">
                        ${this.escapeHtml(c.creatorName || 'Anonymous')} ${isMine ? '(You)' : ''}
                      </span>
                      <span class="mode-pill ${isFantasy ? 'fantasy' : 'standard'}">${isFantasy ? 'Fantasy' : 'Standard'}</span>
                    </div>
                    <div style="font-size: 11px; color: var(--accent-amber);">
                      ${c.creatorRating || 1200} Elo • ${c.timeControl} • ${c.rated ? 'Rated' : 'Casual'}
                    </div>
                  </div>
                </div>
                <div>
                  ${isMine ? `<button class="btn btn-sm btn-danger btn-cancel-chal">Cancel</button>` : `<button class="btn btn-sm btn-primary btn-accept-chal">Play</button>`}
                </div>
              `;

              item.querySelectorAll('.user-click').forEach(el => {
                el.addEventListener('click', () => {
                  this.showUserProfileModal({
                    id: el.dataset.uid,
                    name: el.dataset.name,
                    rating: el.dataset.rating
                  });
                });
              });

              if (isMine) {
                item.querySelector('.btn-cancel-chal').addEventListener('click', () => {
                  net.cancelChallenge(c.id);
                  this.myCreatedChallengeId = null;
                });
              } else {
                item.querySelector('.btn-accept-chal').addEventListener('click', () => {
                  this.acceptLiveChallenge(c);
                });
              }
              listEl.appendChild(item);
            });
          });
        } else if (this.lobbySubTab === 'chat') {
          target.innerHTML = `
            <div class="community-chat-wrap">
              <div class="chat-stream" id="commChatStream"></div>
              <div class="chat-bar">
                <input type="text" id="commChatInput" placeholder="Message lobby..." maxlength="140" />
                <button class="btn btn-sm btn-primary" id="btnSendCommChat" style="border-radius:0;"><i class="fa-solid fa-paper-plane"></i></button>
              </div>
            </div>
          `;
          const stream = target.querySelector('#commChatStream');
          const input = target.querySelector('#commChatInput');
          const btn = target.querySelector('#btnSendCommChat');

          const send = () => {
            const text = input.value.trim();
            if (!text) return;
            input.value = '';
            net.sendCommunityChat({
              userId: this.user.id,
              userName: this.user.name,
              rating: this.user.standardRating || 1200,
              title: this.user.title || 'Member',
              avatar: this.user.avatar || 'fa-solid fa-chess-knight',
              text: text,
              time: Date.now()
            });
          };

          btn.addEventListener('click', send);
          input.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') send();
          });

          net.listenCommunityChat((messages) => {
            if (!stream) return;
            stream.innerHTML = '';
            Object.values(messages).forEach(m => {
              const row = document.createElement('div');
              row.className = 'chat-entry';
              row.innerHTML = `
                <div class="chat-entry-header">
                  <span class="chat-user-link" data-uid="${m.userId}" data-name="${m.userName}" data-rating="${m.rating}" data-title="${m.title || ''}" data-avatar="${m.avatar || ''}">
                    <span style="display:inline-flex; align-items:center; gap:4px;">
                      ${this.escapeHtml(m.userName)} 
                      <span class="badge-flair">${this.escapeHtml(m.title || 'Member')}</span>
                    </span>
                    <span style="font-size:10px; color:var(--accent-amber);">(${m.rating})</span>
                  </span>
                  <span>${new Date(m.time).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })}</span>
                </div>
                <div class="chat-text">${this.escapeHtml(m.text)}</div>
              `;
              row.querySelector('.chat-user-link').addEventListener('click', (e) => {
                const ds = e.currentTarget.dataset;
                this.showUserProfileModal({
                  id: ds.uid,
                  name: ds.name,
                  rating: ds.rating,
                  title: ds.title,
                  avatar: ds.avatar
                });
              });
              stream.appendChild(row);
            });
            stream.scrollTop = stream.scrollHeight;
          });
        } else if (this.lobbySubTab === 'leaderboard') {
          target.innerHTML = `
            <div style="display:flex; justify-content:center; gap:6px; margin-bottom:8px;">
              <button class="btn btn-sm ${this.leaderboardMode === 'standard' ? 'btn-primary' : ''}" id="btnLboardStd"><i class="fa-solid fa-chess"></i> Standard</button>
              <button class="btn btn-sm ${this.leaderboardMode === 'fantasy' ? 'btn-purple' : ''}" id="btnLboardFan"><i class="fa-solid fa-wand-magic-sparkles"></i> Fantasy</button>
            </div>
            <div id="leaderboardList" style="display:flex; flex-direction:column; gap:6px;">Loading leaderboard...</div>
          `;

          target.querySelector('#btnLboardStd').addEventListener('click', () => {
            this.leaderboardMode = 'standard';
            this.renderLobbySubTab();
          });
          target.querySelector('#btnLboardFan').addEventListener('click', () => {
            this.leaderboardMode = 'fantasy';
            this.renderLobbySubTab();
          });

          net.fetchLeaderboard((players) => {
            const list = target.querySelector('#leaderboardList');
            if (!list) return;
            list.innerHTML = '';
            if (players.length === 0) {
              list.innerHTML = `<div style="text-align:center; color:var(--text-muted); padding:16px;">No players on this leaderboard yet.</div>`;
              return;
            }
            players.forEach((p, idx) => {
              const row = document.createElement('div');
              row.className = 'card';
              row.style.padding = '8px 12px';
              row.style.display = 'flex';
              row.style.alignItems = 'center';
              row.style.justifyContent = 'space-between';
              row.style.marginBottom = '0';
              row.style.cursor = 'pointer';

              const medal = idx === 0 ? '🥇' : (idx === 1 ? '🥈' : (idx === 2 ? '🥉' : `#${idx + 1}`));
              const displayRating = this.leaderboardMode === 'fantasy' ? (p.fantasyRating || 1200) : (p.standardRating || p.rating || 1200);
              const wCount = this.leaderboardMode === 'fantasy' ? (p.fantasyWins || 0) : (p.standardWins || p.wins || 0);
              const lCount = this.leaderboardMode === 'fantasy' ? (p.fantasyLosses || 0) : (p.standardLosses || p.losses || 0);
              const dCount = this.leaderboardMode === 'fantasy' ? (p.fantasyDraws || 0) : (p.standardDraws || p.draws || 0);

              row.innerHTML = `
                <div style="display:flex; align-items:center; gap:8px;">
                  <span style="font-weight:800; font-size:12px; width:20px;">${medal}</span>
                  <div class="avatar-badge" style="width:28px; height:28px; font-size:11px;">
                    ${this.getAvatarHtml(p, 28)}
                  </div>
                  <div>
                    <div style="font-size:13px; font-weight:700; display:flex; align-items:center; gap:5px;">
                      ${this.escapeHtml(p.name)} 
                      <span class="badge-flair">${this.escapeHtml(p.title || 'Member')}</span>
                    </div>
                    <div style="font-size:10px; color:var(--text-muted);">${wCount}W • ${lCount}L • ${dCount}D</div>
                  </div>
                </div>
                <div style="font-size:13px; font-weight:800; font-family:var(--font-mono); color:${this.leaderboardMode === 'fantasy' ? 'var(--accent-purple)' : 'var(--accent-amber)'};">
                  ${displayRating}
                </div>
              `;
              row.addEventListener('click', () => this.showUserProfileModal(p));
              list.appendChild(row);
            });
          }, this.leaderboardMode, this.user.id, this.user.name);
        }
      }

      escapeHtml(str) {
        if (str === null || str === undefined) return '';
        return String(str).replace(/[&<>'"]/g, tag => ({
          '&': '&amp;',
          '<': '&lt;',
          '>': '&gt;',
          "'": '&#39;',
          '"': '&quot;'
        } [tag] || tag));
      }

      showUserProfileModal(userObj) {
        const stdTotal = (userObj.standardWins || userObj.wins || 0) + (userObj.standardLosses || userObj.losses || 0) + (userObj.standardDraws || userObj.draws || 0);
        const stdWinrate = stdTotal ? Math.round(((userObj.standardWins || userObj.wins || 0) / stdTotal) * 100) : 50;
        const fanTotal = (userObj.fantasyWins || 0) + (userObj.fantasyLosses || 0) + (userObj.fantasyDraws || 0);
        const fanWinrate = fanTotal ? Math.round(((userObj.fantasyWins || 0) / fanTotal) * 100) : 50;

        this.showModal(`
          <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:12px;">
            <h3 style="font-size:14px; font-weight:700; display:flex; align-items:center; gap:6px;">
              <i class="fa-solid fa-id-card"></i> Player Profile
            </h3>
            <button class="btn-icon" id="btnCloseProfileModal" title="Close"><i class="fa-solid fa-xmark"></i></button>
          </div>
          <div style="text-align:center;">
            <div style="background: ${userObj.cardBg || 'linear-gradient(135deg, #1e293b, #0f172a)'}; border-radius: var(--radius-md); padding: 14px; margin-bottom: 12px; border: 1px solid var(--border-color);">
              <div class="avatar-badge" style="width:54px; height:54px; font-size:24px; margin:0 auto 6px;">
                ${this.getAvatarHtml(userObj, 54)}
              </div>
              <h2 style="font-size:16px; font-weight:800;">${this.escapeHtml(userObj.name)}</h2>
              <div style="margin-top:4px;"><span class="badge-flair">${this.escapeHtml(userObj.title || 'Tactician')}</span></div>
              <p style="font-size:11px; color:var(--text-muted); margin-top:6px; font-style:italic;">"${this.escapeHtml(userObj.bio || 'Ready for chess.')}"</p>
            </div>
            <div style="text-align:left; font-size:11px; font-weight:700; color:var(--accent-cyan); margin-bottom:4px;">Standard Chess</div>
            <div style="display:grid; grid-template-columns:repeat(3, 1fr); gap:6px; margin-bottom:10px;">
              <div style="background:var(--bg-surface); padding:6px; border-radius:var(--radius-sm); text-align:center;">
                <div style="font-size:10px; color:var(--text-muted);">Elo</div>
                <div style="font-size:13px; font-weight:800; color:var(--accent-amber); font-family:var(--font-mono);">${userObj.standardRating || userObj.rating || 1200}</div>
              </div>
              <div style="background:var(--bg-surface); padding:6px; border-radius:var(--radius-sm); text-align:center;">
                <div style="font-size:10px; color:var(--text-muted);">Games</div>
                <div style="font-size:13px; font-weight:800; color:var(--text-main); font-family:var(--font-mono);">${stdTotal}</div>
              </div>
              <div style="background:var(--bg-surface); padding:6px; border-radius:var(--radius-sm); text-align:center;">
                <div style="font-size:10px; color:var(--text-muted);">Winrate</div>
                <div style="font-size:13px; font-weight:800; color:var(--accent-emerald); font-family:var(--font-mono);">${stdWinrate}%</div>
              </div>
            </div>
            <div style="text-align:left; font-size:11px; font-weight:700; color:var(--accent-purple); margin-bottom:4px;">Fantasy Chess</div>
            <div style="display:grid; grid-template-columns:repeat(3, 1fr); gap:6px; margin-bottom:14px;">
              <div style="background:var(--bg-surface); padding:6px; border-radius:var(--radius-sm); text-align:center;">
                <div style="font-size:10px; color:var(--text-muted);">Elo</div>
                <div style="font-size:13px; font-weight:800; color:var(--accent-purple); font-family:var(--font-mono);">${userObj.fantasyRating || 1200}</div>
              </div>
              <div style="background:var(--bg-surface); padding:6px; border-radius:var(--radius-sm); text-align:center;">
                <div style="font-size:10px; color:var(--text-muted);">Games</div>
                <div style="font-size:13px; font-weight:800; color:var(--text-main); font-family:var(--font-mono);">${fanTotal}</div>
              </div>
              <div style="background:var(--bg-surface); padding:6px; border-radius:var(--radius-sm); text-align:center;">
                <div style="font-size:10px; color:var(--text-muted);">Winrate</div>
                <div style="font-size:13px; font-weight:800; color:var(--accent-emerald); font-family:var(--font-mono);">${fanWinrate}%</div>
              </div>
            </div>
            <div style="display:flex; gap:8px;">
              ${userObj.id !== this.user.id ? `<button class="btn btn-primary btn-full" id="btnChallengeDirect" style="flex:1;"><i class="fa-solid fa-chess"></i> Challenge 5+0</button>` : ''}
              <button class="btn btn-full" id="btnDismissProfileModal" style="flex:1;">Close</button>
            </div>
          </div>
        `, (modal) => {
          modal.querySelector('#btnCloseProfileModal').addEventListener('click', () => this.closeModal());
          modal.querySelector('#btnDismissProfileModal').addEventListener('click', () => this.closeModal());
          const directBtn = modal.querySelector('#btnChallengeDirect');
          if (directBtn) {
            directBtn.addEventListener('click', () => {
              this.closeModal();
              this.createLiveChallenge({
                timeControl: '5+0',
                colorPref: 'random',
                rated: true,
                gameMode: 'standard',
                archetype: 'classic'
              });
              this.navigateTo('play');
            });
          }
        });
      }

      /* ========================================================================
         UNIFIED PLAY SCREEN: ACTIVE GAMES + CREATOR (WITH PASS & PLAY TOGGLE)
         ======================================================================== */
      renderPlayScreen(container) {
        let activeGamesHtml = '';
        if (this.activeGamesList && this.activeGamesList.length > 0) {
          activeGamesHtml = `
            <div style="margin-bottom: 14px;">
              <h3 style="font-size: 14px; font-weight: 800; color: var(--text-main); margin-bottom: 8px; display:flex; align-items:center; gap:6px;">
                <i class="fa-solid fa-clock-rotate-left"></i> Running Games (${this.activeGamesList.length})
              </h3>
              <div style="display: flex; flex-direction: column; gap: 8px;">
          `;
          this.activeGamesList.forEach(g => {
            const isWhite = g.white === this.user.id;
            const oppName = isWhite ? (g.blackName || 'Opponent') : (g.whiteName || 'Opponent');
            const oppRating = isWhite ? (g.blackRating || 1200) : (g.whiteRating || 1200);
            const isMyTurn = (g.turn === 'w' && isWhite) || (g.turn === 'b' && !isWhite);
            const colorIcon = isWhite ? '⚪ White' : '⚫ Black';
            const isFantasy = g.gameMode === 'fantasy';

            activeGamesHtml += `
              <div class="card" style="margin-bottom: 0; padding: 12px; display: flex; flex-direction: column; gap: 8px;">
                <div style="display: flex; justify-content: space-between; align-items: center;">
                  <div style="display: flex; align-items: center; gap: 8px;">
                    <div class="avatar-badge" style="width: 32px; height: 32px; font-size: 13px;">${this.escapeHtml(oppName).charAt(0).toUpperCase()}</div>
                    <div>
                      <div style="font-size: 13px; font-weight: 700; display:flex; align-items:center; gap:5px;">
                        vs ${this.escapeHtml(oppName)} <span style="font-size:11px; color:var(--accent-amber);">(${oppRating})</span>
                        <span class="mode-pill ${isFantasy ? 'fantasy' : 'standard'}">${isFantasy ? 'Fantasy' : 'Standard'}</span>
                      </div>
                      <div style="font-size: 11px; color: var(--text-muted);">${colorIcon} • ${g.timeControl || 'Casual'} • ${g.rated ? 'Rated' : 'Casual'}</div>
                    </div>
                  </div>
                  <span class="turn-tag ${isMyTurn ? 'your-turn' : 'their-turn'}">${isMyTurn ? 'Your Turn' : 'Waiting...'}</span>
                </div>
                <div style="display: flex; gap: 6px;">
                  <button class="btn btn-sm btn-primary btn-resume-match" data-gid="${g.id}" style="flex: 1;"><i class="fa-solid fa-play"></i> Resume Game</button>
                  <button class="btn btn-sm btn-danger btn-forfeit-match" data-gid="${g.id}" data-white="${g.white}" data-black="${g.black}" data-color="${isWhite ? 'w' : 'b'}" data-mode="${g.gameMode || 'standard'}" data-rated="${g.rated !== false}">Forfeit</button>
                </div>
              </div>
            `;
          });
          activeGamesHtml += `</div></div>`;
        }

        container.innerHTML = `
          ${activeGamesHtml}

          <!-- GAME CREATOR CARD -->
          <div class="card">
            <h3 style="font-size: 15px; font-weight: 700; margin-bottom: 12px; display:flex; align-items:center; gap:6px;">
              <i class="fa-solid fa-sliders"></i> Create Match
            </h3>
            <div style="display: flex; flex-direction: column; gap: 12px;">
              
              <!-- MATCH TYPE (Online Challenge vs Local Pass & Play) -->
              <div>
                <label style="font-size: 11px; color: var(--text-muted); font-weight: 600;">Match Type</label>
                <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 4px;">
                  <button class="btn btn-sm opt-match-type active" data-type="online"><i class="fa-solid fa-globe"></i> Online Challenge</button>
                  <button class="btn btn-sm opt-match-type" data-type="pass_and_play"><i class="fa-solid fa-users"></i> Pass & Play</button>
                </div>
              </div>

              <!-- GAME MODE SELECTOR -->
              <div>
                <label style="font-size: 11px; color: var(--text-muted); font-weight: 600;">Game Mode</label>
                <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 4px;">
                  <button class="btn btn-sm opt-mode active" data-mode="standard"><i class="fa-solid fa-chess"></i> Standard Chess</button>
                  <button class="btn btn-sm opt-mode" data-mode="fantasy"><i class="fa-solid fa-wand-magic-sparkles"></i> Fantasy Games</button>
                </div>
              </div>

              <!-- FANTASY ARCHETYPE SELECTION -->
              <div id="fantasyArchetypeBox" style="display:none; background:var(--bg-surface); padding:8px; border-radius:var(--radius-sm); border:1px solid var(--border-color);">
                <label style="font-size: 11px; color: var(--accent-purple); font-weight: 700;">Fantasy Archetype</label>
                <select class="input-field" id="selectArchetype" style="margin-top: 4px; font-size:12px;">
                  <option value="king_of_the_hill" selected>👑 King of the Hill (Control the center)</option>
                  <option value="three_check">⚔️ Three-Check (Check opponent 3 times)</option>
                  <option value="atomic">💥 Atomic Chess (Captures cause explosions)</option>
                  <option value="fog_of_war">🌫️ Fog of War (Limited visibility)</option>
                  <option value="antichess">🔄 Antichess (Must capture / Lose all pieces)</option>
                  <option value="horde">🛡️ Horde Chess (36 Pawns vs Standard Army)</option>
                  <option value="racing_kings">🏁 Racing Kings (Race king to rank 8)</option>
                  <option value="portal">🌀 Portal Chess (Teleportation tiles)</option>
                  <option value="benedict">🔮 Benedict Chess (Convert adjacent pieces)</option>
                </select>
              </div>

              <!-- TIME CONTROL -->
              <div>
                <label style="font-size: 11px; color: var(--text-muted); font-weight: 600;">Time Control</label>
                <select class="input-field" id="selectTime" style="margin-top: 4px;">
                  <optgroup label="Bullet">
                    <option value="1+0">1 min (Bullet)</option>
                    <option value="1+1">1+1 sec (Bullet)</option>
                    <option value="2+1">2+1 sec (Bullet)</option>
                  </optgroup>
                  <optgroup label="Blitz">
                    <option value="3+0">3 min (Blitz)</option>
                    <option value="3+2">3+2 sec (Blitz)</option>
                    <option value="5+0" selected>5 min (Blitz)</option>
                    <option value="5+3">5+3 sec (Blitz)</option>
                  </optgroup>
                  <optgroup label="Rapid">
                    <option value="10+0">10 min (Rapid)</option>
                    <option value="15+10">15+10 sec (Rapid)</option>
                  </optgroup>
                  <optgroup label="Classical / Unlimited">
                    <option value="30+0">30 min (Classical)</option>
                    <option value="none">Unlimited (No Clock)</option>
                  </optgroup>
                  <optgroup label="Custom Configuration">
                    <option value="custom">Custom Time Control ⚙️</option>
                  </optgroup>
                </select>
              </div>

              <!-- CUSTOM TIME INPUT -->
              <div id="customTimeBox" style="display:none; background:var(--bg-surface); padding:8px; border-radius:var(--radius-sm); border:1px solid var(--border-color);">
                <div style="display:grid; grid-template-columns:1fr 1fr; gap:8px;">
                  <div>
                    <label style="font-size: 10px; color: var(--text-muted); font-weight: 600;">Base Minutes (1-180)</label>
                    <input type="number" class="input-field" id="custBaseMin" min="1" max="180" value="7" style="margin-top:3px; padding:6px 8px; font-size:12px;" />
                  </div>
                  <div>
                    <label style="font-size: 10px; color: var(--text-muted); font-weight: 600;">Increment (0-60 sec)</label>
                    <input type="number" class="input-field" id="custIncSec" min="0" max="60" value="5" style="margin-top:3px; padding:6px 8px; font-size:12px;" />
                  </div>
                </div>
              </div>

              <!-- ONLINE ONLY OPTIONS -->
              <div id="onlineMatchOpts">
                <div style="margin-bottom:10px;">
                  <label style="font-size: 11px; color: var(--text-muted); font-weight: 600;">Match Rating Mode</label>
                  <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 4px;">
                    <button class="btn btn-sm opt-rated active" data-rated="true"><i class="fa-solid fa-trophy"></i> Rated (Elo)</button>
                    <button class="btn btn-sm opt-rated" data-rated="false"><i class="fa-solid fa-mug-hot"></i> Casual</button>
                  </div>
                </div>
                <div>
                  <label style="font-size: 11px; color: var(--text-muted); font-weight: 600;">Preferred Color</label>
                  <div style="display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; margin-top: 4px;">
                    <button class="btn btn-sm opt-side active" data-side="random"><i class="fa-solid fa-shuffle"></i> Random</button>
                    <button class="btn btn-sm opt-side" data-side="white">⚪ White</button>
                    <button class="btn btn-sm opt-side" data-side="black">⚫ Black</button>
                  </div>
                </div>
              </div>

              <!-- PASS AND PLAY TOGGLE OPTIONS -->
              <div id="passAndPlayOpts" style="display:none; background:var(--bg-surface); padding:8px; border-radius:var(--radius-sm); border:1px solid var(--border-color);">
                <label style="display:flex; align-items:center; gap:6px; font-size:11px; cursor:pointer;">
                  <input type="checkbox" id="chkAutoFlipPassPlay" checked />
                  <span>Auto-flip board each turn for the active player</span>
                </label>
              </div>

              <button class="btn btn-primary btn-full" id="btnLaunchMatch" style="margin-top: 6px;">
                <i class="fa-solid fa-bullhorn"></i> <span id="launchBtnText">Post Challenge</span>
              </button>
            </div>
          </div>
        `;

        let selectedType = 'online';
        let selectedMode = 'standard';
        let selectedSide = 'random';
        let isRated = true;

        const timeSelect = container.querySelector('#selectTime');
        const customTimeBox = container.querySelector('#customTimeBox');
        const fantasyBox = container.querySelector('#fantasyArchetypeBox');
        const onlineOpts = container.querySelector('#onlineMatchOpts');
        const passPlayOpts = container.querySelector('#passAndPlayOpts');
        const launchBtnText = container.querySelector('#launchBtnText');

        timeSelect.addEventListener('change', () => {
          customTimeBox.style.display = timeSelect.value === 'custom' ? 'block' : 'none';
        });

        container.querySelectorAll('.opt-match-type').forEach(b => {
          b.addEventListener('click', () => {
            container.querySelectorAll('.opt-match-type').forEach(x => x.classList.remove('active'));
            b.classList.add('active');
            selectedType = b.getAttribute('data-type');
            if (selectedType === 'pass_and_play') {
              onlineOpts.style.display = 'none';
              passPlayOpts.style.display = 'block';
              launchBtnText.textContent = 'Start Pass & Play Match';
            } else {
              onlineOpts.style.display = 'block';
              passPlayOpts.style.display = 'none';
              launchBtnText.textContent = 'Post Challenge';
            }
          });
        });

        container.querySelectorAll('.opt-mode').forEach(b => {
          b.addEventListener('click', () => {
            container.querySelectorAll('.opt-mode').forEach(x => x.classList.remove('active'));
            b.classList.add('active');
            selectedMode = b.getAttribute('data-mode');
            fantasyBox.style.display = selectedMode === 'fantasy' ? 'block' : 'none';
          });
        });

        container.querySelectorAll('.opt-side').forEach(b => {
          b.addEventListener('click', () => {
            container.querySelectorAll('.opt-side').forEach(x => x.classList.remove('active'));
            b.classList.add('active');
            selectedSide = b.getAttribute('data-side');
          });
        });

        container.querySelectorAll('.opt-rated').forEach(b => {
          b.addEventListener('click', () => {
            container.querySelectorAll('.opt-rated').forEach(x => x.classList.remove('active'));
            b.classList.add('active');
            isRated = b.getAttribute('data-rated') === 'true';
          });
        });

        container.querySelector('#btnLaunchMatch').addEventListener('click', () => {
          let tc = timeSelect.value;
          if (tc === 'custom') {
            const mins = Math.max(1, Math.min(180, parseInt(container.querySelector('#custBaseMin').value, 10) || 5));
            const inc = Math.max(0, Math.min(60, parseInt(container.querySelector('#custIncSec').value, 10) || 0));
            tc = `${mins}+${inc}`;
          }

          const archetype = selectedMode === 'fantasy' ? container.querySelector('#selectArchetype').value : 'classic';

          if (selectedType === 'pass_and_play') {
            const autoFlip = container.querySelector('#chkAutoFlipPassPlay').checked;
            this.startPassAndPlayGame(tc, selectedMode, archetype, autoFlip);
          } else {
            this.createLiveChallenge({
              timeControl: tc,
              colorPref: selectedSide,
              rated: isRated,
              gameMode: selectedMode,
              archetype: archetype
            });
            this.navigateTo('home');
          }
        });

        container.querySelectorAll('.btn-resume-match').forEach(b => {
          b.addEventListener('click', () => this.loadAndEnterGame(b.getAttribute('data-gid')));
        });

        container.querySelectorAll('.btn-forfeit-match').forEach(b => {
          b.addEventListener('click', async () => {
            if (confirm('Forfeit and abandon this match?')) {
              const gid = b.getAttribute('data-gid');
              const w = b.getAttribute('data-white');
              const bl = b.getAttribute('data-black');
              const myCol = b.getAttribute('data-color');
              const isRatedMatch = b.getAttribute('data-rated') === 'true';
              const mode = b.getAttribute('data-mode') || 'standard';

              net.finalizeGame(gid, w, bl, myCol === 'w' ? '0-1' : '1-0', 'forfeit');

              if (isRatedMatch) {
                if (mode === 'fantasy') {
                  this.user.fantasyLosses++;
                  const elo = calculateEloChange(this.user.fantasyRating, 1200, 0);
                  this.user.fantasyRating = elo.newRating;
                } else {
                  this.user.standardLosses++;
                  const elo = calculateEloChange(this.user.standardRating, 1200, 0);
                  this.user.standardRating = elo.newRating;
                  this.user.rating = elo.newRating;
                }
                const canonical = `${this.user.id}|${this.user.standardRating}|${this.user.standardWins}|${this.user.standardLosses}|${this.user.standardDraws}|${this.user.fantasyRating}|${this.user.fantasyWins}|${this.user.fantasyLosses}|${this.user.fantasyDraws}`;
                this.user.sig = await security.sign(canonical);
                await dbManager.put('settings', this.user, 'userProfile');
                net.syncLeaderboard(this.user);
                this.updateTopBar();
              }
              this.showToast('Match forfeited.');
            }
          });
        });
      }

      createLiveChallenge(opts) {
        const id = 'chal_' + Date.now().toString(36);
        let assignedColor = opts.colorPref;
        if (assignedColor === 'random') assignedColor = Math.random() < 0.5 ? 'white' : 'black';
        const isFantasy = opts.gameMode === 'fantasy';
        const myRating = isFantasy ? (this.user.fantasyRating || 1200) : (this.user.standardRating || 1200);

        const challenge = {
          id: id,
          creatorId: this.user.id,
          creatorName: this.user.name,
          creatorRating: myRating,
          creatorAvatar: this.user.avatar || 'fa-solid fa-chess-knight',
          timeControl: opts.timeControl,
          color: opts.colorPref,
          creatorColor: assignedColor,
          gameMode: opts.gameMode || 'standard',
          archetype: opts.archetype || 'classic',
          rated: opts.rated !== false,
          status: 'open',
          createdAt: Date.now()
        };
        this.myCreatedChallengeId = id;
        net.createChallenge(challenge);
      }

      acceptLiveChallenge(challenge) {
        const gameId = 'game_' + Date.now().toString(36);
        const creatorIsWhite = challenge.creatorColor === 'white';
        const initialSecs = this.parseTimeControl(challenge.timeControl);
        const isFantasy = challenge.gameMode === 'fantasy';
        const myRating = isFantasy ? (this.user.fantasyRating || 1200) : (this.user.standardRating || 1200);

        const gameInitData = {
          id: gameId,
          white: creatorIsWhite ? challenge.creatorId : this.user.id,
          black: creatorIsWhite ? this.user.id : challenge.creatorId,
          whiteName: creatorIsWhite ? challenge.creatorName : this.user.name,
          blackName: creatorIsWhite ? this.user.name : challenge.creatorName,
          whiteRating: creatorIsWhite ? challenge.creatorRating : myRating,
          blackRating: creatorIsWhite ? myRating : challenge.creatorRating,
          timeControl: challenge.timeControl,
          whiteTime: initialSecs,
          blackTime: initialSecs,
          gameMode: challenge.gameMode || 'standard',
          archetype: challenge.archetype || 'classic',
          rated: challenge.rated !== false,
          status: 'active',
          turn: 'w',
          startedAt: Date.now(),
          lastMoveAt: Date.now()
        };

        net.acceptChallenge(challenge.id, gameInitData, this.user).then(() => {
          this.loadAndEnterGame(gameId);
        });
      }

      /* ========================================================================
         PASS & PLAY MODE INITIALIZATION
         ======================================================================== */
      startPassAndPlayGame(timeControl, gameMode, archetype, autoFlip = true) {
        if (this.activeGameDetach) {
          this.activeGameDetach();
          this.activeGameDetach = null;
        }
        if (this.gameClock) clearInterval(this.gameClock);

        const gameId = 'local_' + Date.now().toString(36);
        const initialSecs = this.parseTimeControl(timeControl);
        const engine = new ChessGame(archetype || 'standard');

        this.activeGame = {
          id: gameId,
          engine: engine,
          myColor: 'both',
          opponentName: 'Player 2 (Black)',
          opponentRating: 1200,
          whiteName: 'Player 1 (White)',
          blackName: 'Player 2 (Black)',
          timeControl: timeControl || 'none',
          gameMode: gameMode || 'standard',
          archetype: archetype || 'classic',
          rated: false,
          whiteTime: initialSecs,
          blackTime: initialSecs,
          increment: (timeControl && timeControl.includes('+')) ? parseInt(timeControl.split('+')[1], 10) : 0,
          isOver: false,
          isBot: false,
          isPassAndPlay: true,
          autoFlipPassAndPlay: autoFlip
        };

        this.boardFlipped = false;
        this.premove = null;
        this.navigateTo('game');
        this.startClocks();
      }

      /* ========================================================================
         GAME INITIALIZATION & SYNCHRONIZATION
         ======================================================================== */
      async loadAndEnterGame(gameId) {
        if (this.activeGameDetach) {
          this.activeGameDetach();
          this.activeGameDetach = null;
        }
        if (this.gameClock) clearInterval(this.gameClock);

        const snap = await net.rtdb.ref(`games/${gameId}`).once('value');
        const gameData = snap.val();
        if (!gameData || gameData.status !== 'active') {
          alert('Game is no longer active.');
          this.navigateTo('home');
          return;
        }

        const isWhite = gameData.white === this.user.id;
        const initialSecs = this.parseTimeControl(gameData.timeControl);
        const engine = new ChessGame(gameData.archetype || 'standard');

        if (gameData.moves) {
          const moveList = Object.values(gameData.moves).sort((a, b) => (a.idx || 0) - (b.idx || 0));
          moveList.forEach(m => engine.execute(m.from, m.to, m.promotion));
        }

        let wTime = (gameData.whiteTime !== undefined) ? gameData.whiteTime : initialSecs;
        let bTime = (gameData.blackTime !== undefined) ? gameData.blackTime : initialSecs;

        if (gameData.lastMoveAt && gameData.timeControl !== 'none') {
          const elapsedSecs = Math.floor((Date.now() - gameData.lastMoveAt) / 1000);
          if (gameData.turn === 'w') wTime = Math.max(0, wTime - elapsedSecs);
          else bTime = Math.max(0, bTime - elapsedSecs);
        }

        this.activeGame = {
          id: gameId,
          engine: engine,
          myColor: isWhite ? 'w' : 'b',
          opponentId: isWhite ? gameData.black : gameData.white,
          opponentName: (isWhite ? gameData.blackName : gameData.whiteName) || 'Opponent',
          opponentRating: (isWhite ? gameData.blackRating : gameData.whiteRating) || 1200,
          timeControl: gameData.timeControl || 'none',
          gameMode: gameData.gameMode || 'standard',
          archetype: gameData.archetype || 'classic',
          rated: gameData.rated !== false,
          whiteTime: wTime,
          blackTime: bTime,
          increment: (gameData.timeControl && gameData.timeControl.includes('+')) ? parseInt(gameData.timeControl.split('+')[1], 10) : 0,
          isOver: false,
          isBot: false,
          isPassAndPlay: false
        };

        this.boardFlipped = !isWhite;
        this.premove = null;
        this.navigateTo('game');
        this.startClocks();

        this.activeGameDetach = net.listenGame(
          gameId,
          (move) => {
            if (!this.activeGame || !move) return;
            if (move.idx !== undefined && move.idx < this.activeGame.engine.moveHistory.length) return;
            if (move.sender === this.user.id) return;
            if (move.whiteTime !== undefined) this.activeGame.whiteTime = move.whiteTime;
            if (move.blackTime !== undefined) this.activeGame.blackTime = move.blackTime;
            const res = this.activeGame.engine.execute(move.from, move.to, move.promotion);
            if (res) {
              sound.playMove();
              if (res.captured) sound.playCapture();
              if (this.activeGame.engine.inCheck()) sound.playCheck();
              this.handleMoveExecuted(res, false);
            }
          },
          (state) => {
            if (!this.activeGame || !state || state.sender === this.user.id) return;
            if (state.action === 'resign') {
              this.endGame(this.activeGame.myColor === 'w' ? '1-0' : '0-1', 'Resignation');
            } else if (state.action === 'draw-offer') {
              this.showDrawOfferDialog();
            } else if (state.action === 'draw-accept') {
              this.endGame('1/2-1/2', 'Mutual Agreement');
            } else if (state.action === 'draw-decline') {
              this.showToast('Draw offer declined.');
            }
          },
          (chat) => {
            if (!this.activeGame || !chat) return;
            this.appendInGameChat(chat.sender === this.user.id, chat.senderName, chat.text);
          }
        );
      }

      /* ========================================================================
         STOCKFISH BOT INTEGRATION
         ======================================================================== */
      startBotGame(botRating, timeControl = '5+0') {
        if (this.activeGameDetach) {
          this.activeGameDetach();
          this.activeGameDetach = null;
        }
        if (this.gameClock) clearInterval(this.gameClock);

        const gameId = 'bot_' + Date.now().toString(36);
        const initialSecs = this.parseTimeControl(timeControl);

        this.activeGame = {
          id: gameId,
          engine: new ChessGame('standard'),
          myColor: 'w',
          opponentName: `Stockfish Bot (${botRating})`,
          opponentRating: botRating,
          timeControl: timeControl,
          gameMode: 'standard',
          archetype: 'classic',
          rated: false,
          whiteTime: initialSecs,
          blackTime: initialSecs,
          increment: 0,
          isOver: false,
          isBot: true,
          isPassAndPlay: false
        };

        this.boardFlipped = false;
        this.premove = null;
        this.navigateTo('game');
        this.startClocks();
      }

      triggerBotMove() {
        if (!this.activeGame || this.activeGame.isOver) return;

        // In standard chess with Stockfish loaded, use Stockfish
        if (this.activeGame.archetype === 'classic' || this.activeGame.archetype === 'standard') {
          if (sfService.isLoaded) {
            const fen = this.activeGame.engine.generateFen();
            const rating = this.activeGame.opponentRating || 1200;
            let depth = 3,
              movetime = 400,
              skill = 3;
            if (rating >= 1600) {
              depth = 10;
              movetime = 1000;
              skill = 12;
            }
            if (rating >= 2000) {
              depth = 16;
              movetime = 1500;
              skill = 20;
            }

            sfService.send(`setoption name Skill Level value ${skill}`);
            sfService.send(`position fen ${fen}`);
            sfService.send(`go movetime ${movetime} depth ${depth}`);

            const detach = sfService.addListener((line) => {
              if (line.includes('bestmove')) {
                detach();
                const m = line.match(/bestmove (\S+)/);
                if (m && m[1] && m[1] !== '(none)') {
                  const uci = m[1];
                  const from = ChessGame.coordToSq(uci.substring(0, 2));
                  const to = ChessGame.coordToSq(uci.substring(2, 4));
                  const promoChar = uci[4] ? uci[4].toUpperCase() : null;
                  let promo = null;
                  if (promoChar) {
                    promo = {
                      Q: 5,
                      R: 4,
                      B: 3,
                      N: 2
                    } [promoChar];
                    if (this.activeGame.engine.turn === 'b') promo |= 8;
                  }
                  const moveRecord = this.activeGame.engine.execute(from, to, promo);
                  if (moveRecord) {
                    sound.playMove();
                    if (moveRecord.captured) sound.playCapture();
                    if (this.activeGame.engine.inCheck()) sound.playCheck();
                    this.handleMoveExecuted(moveRecord, false);
                  }
                }
              }
            });
            return;
          }
        }

        // Heuristic fallback for fantasy modes or if Stockfish is unavailable
        const legals = this.activeGame.engine.getLegalMoves();
        if (legals.length === 0) return;
        let picked = legals[Math.floor(Math.random() * legals.length)];
        const caps = legals.filter(m => m.captured);
        if (caps.length && Math.random() < 0.7) picked = caps[Math.floor(Math.random() * caps.length)];

        const moveRecord = this.activeGame.engine.execute(picked.from, picked.to, picked.promotion);
        if (moveRecord) {
          sound.playMove();
          if (moveRecord.captured) sound.playCapture();
          if (this.activeGame.engine.inCheck()) sound.playCheck();
          this.handleMoveExecuted(moveRecord, false);
        }
      }

      /* ========================================================================
         GAME BOARD VIEW
         ======================================================================== */
      renderGameScreen(container) {
        if (!this.activeGame) {
          container.innerHTML = `<div class="card"><p>No active game.</p><button class="btn btn-primary" id="btnGoHome" style="margin-top:10px;">Lobby</button></div>`;
          container.querySelector('#btnGoHome').addEventListener('click', () => this.navigateTo('home'));
          return;
        }

        const isFantasy = this.activeGame.gameMode === 'fantasy';
        const isPassPlay = this.activeGame.isPassAndPlay;

        container.innerHTML = `
          <!-- OPPONENT / BLACK HUD -->
          <div class="player-hud" id="oppHud">
            <div class="player-meta">
              <div class="avatar-badge" style="background:#475569;">
                ${this.activeGame.isBot ? '<i class="fa-solid fa-robot"></i>' : (isPassPlay ? '⚫' : this.escapeHtml(this.activeGame.opponentName || 'O').charAt(0).toUpperCase())}
              </div>

                <span class="player-name" style="display:flex; align-items:center; gap:5px;">
                  ${this.escapeHtml(this.activeGame.opponentName)}

                </span>
                <div class="captured-tray" id="oppTray"></div>
              </div>
            </div>
            <div class="clock-display" id="oppClock">--:--</div>
          </div>

          <!-- BOARD -->
          <div class="board-wrapper">
            <div class="board-grid" id="chessBoard"></div>
          </div>

          <!-- USER / WHITE HUD -->
          <div class="player-hud" id="myHud" style="margin-top: 6px;">
            <div class="player-meta">
              <div class="avatar-badge">${isPassPlay ? '⚪' : this.getAvatarHtml(this.user, 32)}</div>
              <div class="player-name-wrap">
                <span class="player-name">${isPassPlay ? 'Player 1 (White)' : this.escapeHtml(this.user.name) + ' (You)'}</span>
                <div class="captured-tray" id="myTray"></div>
              </div>
            </div>
            <div class="clock-display" id="myClock">--:--</div>
          </div>

          <!-- ACTION BUTTONS -->

            <button class="btn btn-sm" id="btnFlipBoard" title="Flip Board"><i class="fa-solid fa-repeat"></i></button>
            <button class="btn btn-sm" id="btnCopyFen" title="Copy FEN"><i class="fa-solid fa-copy"></i></button>
            <button class="btn btn-sm" id="btnDraw" style="flex:1;">🤝 Draw</button>
            <button class="btn btn-sm btn-danger" id="btnResign" style="flex:1;">🏳️ Resign</button>
            ${!isPassPlay && !this.activeGame.isBot ? `<button class="btn btn-sm btn-cyan" id="btnToggleGameChat"><i class="fa-solid fa-message"></i></button>` : ''}
          </div>

          <div class="moves-scroll-box" id="movesContainer"></div>

          <!-- CHAT DRAWER (FOR ONLINE PLAY) -->
          <div id="gameChatArea" style="display:none; flex-direction:column; gap:6px; margin-top:6px; background:var(--bg-surface); padding:8px; border-radius:var(--radius-md); border:1px solid var(--border-color);">
            <div style="display:flex; gap:6px; flex-wrap:wrap;">
              <button class="btn btn-sm q-msg">Good luck!</button>
              <button class="btn btn-sm q-msg">Nice move!</button>
              <button class="btn btn-sm q-msg">Thanks!</button>
              <button class="btn btn-sm q-msg">Well played</button>
            </div>
            <div style="max-height:70px; overflow-y:auto; font-size:12px; display:flex; flex-direction:column; gap:4px;" id="gameChatLog"></div>
            <div style="display:flex; gap:6px;">
              <input type="text" id="gameChatInput" class="input-field" style="padding:6px 10px; font-size:12px;" placeholder="Message..." />
              <button class="btn btn-sm btn-primary" id="btnSendGameChat">Send</button>
            </div>
          </div>
        `;

        this.renderBoard();
        this.updateClockDisplays();
        this.renderMoveList();
        this.updateMaterialTrays();

        container.querySelector('#btnFlipBoard').addEventListener('click', () => {
          this.boardFlipped = !this.boardFlipped;
          this.renderBoard();
        });

        container.querySelector('#btnCopyFen').addEventListener('click', () => {
          const fen = this.activeGame.engine.generateFen();
          navigator.clipboard.writeText(fen);
          this.showToast('FEN copied to clipboard!');
        });

        container.querySelector('#btnResign').addEventListener('click', () => {
          if (confirm('Resign this game?')) {
            if (!this.activeGame.isBot && !this.activeGame.isPassAndPlay) {
              net.sendStateEvent(this.activeGame.id, {
                action: 'resign',
                sender: this.user.id
              });
            }
            const winner = this.activeGame.isPassAndPlay ? (this.activeGame.engine.turn === 'w' ? '0-1' : '1-0') : (this.activeGame.myColor === 'w' ? '0-1' : '1-0');
            this.endGame(winner, 'Resignation');
          }
        });

        container.querySelector('#btnDraw').addEventListener('click', () => {
          if (this.activeGame.isPassAndPlay) {
            this.endGame('1/2-1/2', 'Mutual Agreement');
          } else if (!this.activeGame.isBot) {
            net.sendStateEvent(this.activeGame.id, {
              action: 'draw-offer',
              sender: this.user.id
            });
            this.showToast('Draw offer sent.');
          } else {
            alert('Bot declines draw.');
          }
        });

        const chatDrawer = container.querySelector('#gameChatArea');
        const chatToggleBtn = container.querySelector('#btnToggleGameChat');
        if (chatToggleBtn && chatDrawer) {
          chatToggleBtn.addEventListener('click', () => {
            chatDrawer.style.display = chatDrawer.style.display === 'none' ? 'flex' : 'none';
          });
          const sendChat = (text) => {
            if (!text || this.activeGame.isBot || this.activeGame.isPassAndPlay) return;
            net.sendGameChat(this.activeGame.id, {
              sender: this.user.id,
              senderName: this.user.name,
              text
            });
          };
          container.querySelector('#btnSendGameChat').addEventListener('click', () => {
            const inp = container.querySelector('#gameChatInput');
            sendChat(inp.value.trim());
            inp.value = '';
