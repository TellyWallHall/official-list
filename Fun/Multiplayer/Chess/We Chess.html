<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Chess Community</title>

  <!-- Font Awesome 6 Free CDN -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

  <!-- Firebase Compat CDN -->
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-database-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>

  <style>
    /* ==========================================================================
       CSS STYLES & DYNAMIC THEME SYSTEM
       ========================================================================== */
    :root {
      --bg-base: #0b0f17;
      --bg-surface: #131b26;
      --bg-card: #1a2434;
      --bg-card-hover: #223045;
      --border-color: #26354a;

      --text-main: #f1f5f9;
      --text-muted: #8e9db2;
      --text-dim: #5c6b80;

      --accent-emerald: #10b981;
      --accent-emerald-glow: rgba(16, 185, 129, 0.25);
      --accent-cyan: #06b6d4;
      --accent-amber: #f59e0b;
      --accent-rose: #f43f5e;
      --accent-purple: #8b5cf6;

      --board-light: #f0d9b5;
      --board-dark: #b58863;
      --board-highlight: rgba(245, 158, 11, 0.45);
      --board-check: rgba(244, 63, 94, 0.65);
      --board-dest-dot: rgba(16, 185, 129, 0.75);
      --board-premove: rgba(139, 92, 246, 0.55);

      /* Review Quality Colors */
      --rev-book: #d5a021;
      --rev-bril: #1bacb6;
      --rev-great: #5c8bb0;
      --rev-best: #95bb4a;
      --rev-exc: #7fa644;
      --rev-good: #699839;
      --rev-inacc: #f0c15c;
      --rev-mis: #e58f2a;
      --rev-miss: #ff7777;
      --rev-blu: #ca3431;

      --radius-sm: 8px;
      --radius-md: 12px;
      --radius-lg: 18px;

      --font-sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      --font-mono: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;

      --safe-top: env(safe-area-inset-top, 0px);
      --safe-bottom: env(safe-area-inset-bottom, 0px);
      --custom-app-bg: none;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: var(--bg-base);
      background-image: var(--custom-app-bg);
      background-size: cover;
      background-attachment: fixed;
      background-position: center;
      color: var(--text-main);
      font-family: var(--font-sans);
      min-height: 100vh;
      min-height: 100dvh;
      overflow-x: hidden;
      display: flex;
      flex-direction: column;
    }

    #app {
      display: flex;
      flex-direction: column;
      flex: 1;
      position: relative;
      max-width: 600px;
      margin: 0 auto;
      width: 100%;
      height: 100vh;
      height: 100dvh;
      overflow: hidden;
      background: rgba(11, 15, 23, 0.85);
      backdrop-filter: blur(8px);
      border-left: 1px solid var(--border-color);
      border-right: 1px solid var(--border-color);
    }

    /* TOP BAR */
    .top-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: calc(var(--safe-top) + 8px) 14px 8px;
      background: var(--bg-surface);
      border-bottom: 1px solid var(--border-color);
      z-index: 20;
      gap: 10px;
    }

    .top-user {
      display: flex;
      align-items: center;
      gap: 8px;
      cursor: pointer;
      min-width: 0;
      flex: 1;
    }

    .avatar-badge {
      width: 34px;
      height: 34px;
      border-radius: 50%;
      background: linear-gradient(135deg, var(--accent-emerald), var(--accent-cyan));
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      font-size: 14px;
      box-shadow: 0 0 8px var(--accent-emerald-glow);
      flex-shrink: 0;
      overflow: hidden;
    }

    .avatar-badge img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .top-user-info {
      display: flex;
      flex-direction: column;
      min-width: 0;
      gap: 1px;
    }

    .top-name-row {
      display: flex;
      align-items: center;
      gap: 5px;
      min-width: 0;
    }

    .top-user-name {
      font-size: 13px;
      font-weight: 700;
      color: var(--text-main);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 140px;
    }

    .top-user-rating {
      font-size: 11px;
      font-family: var(--font-mono);
      color: var(--accent-amber);
      font-weight: 600;
      line-height: 1;
    }

    .top-actions {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-shrink: 0;
    }

    .net-indicator {
      display: flex;
      align-items: center;
      gap: 5px;
      font-size: 11px;
      font-weight: 700;
      padding: 3px 8px;
      border-radius: 12px;
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      color: var(--text-muted);
    }

    .net-indicator.connected {
      color: var(--accent-emerald);
      border-color: rgba(16, 185, 129, 0.4);
    }

    .net-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--text-muted);
    }

    .net-indicator.connected .net-dot {
      background: var(--accent-emerald);
      box-shadow: 0 0 6px var(--accent-emerald);
    }

    .btn-icon {
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      color: var(--text-main);
      width: 32px;
      height: 32px;
      border-radius: var(--radius-sm);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      font-size: 14px;
      transition: background 0.15s;
    }

    .btn-icon:hover {
      background: var(--bg-card-hover);
    }

    /* SCREEN CONTAINER */
    .screen-container {
      flex: 1;
      overflow-y: auto;
      overflow-x: hidden;
      padding: 12px 14px;
      display: flex;
      flex-direction: column;
      position: relative;
    }

    /* BOTTOM NAV */
    .bottom-nav {
      background: var(--bg-surface);
      border-top: 1px solid var(--border-color);
      display: flex;
      justify-content: space-around;
      padding: 6px 6px calc(var(--safe-bottom) + 6px);
      z-index: 20;
    }

    .nav-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 3px;
      background: none;
      border: none;
      color: var(--text-muted);
      font-size: 10px;
      font-weight: 500;
      cursor: pointer;
      padding: 4px 8px;
      border-radius: var(--radius-sm);
      position: relative;
    }

    .nav-item.active {
      color: var(--accent-emerald);
    }

    .nav-badge {
      position: absolute;
      top: 0px;
      right: 4px;
      background: var(--accent-rose);
      color: #fff;
      font-size: 9px;
      font-weight: 800;
      padding: 1px 5px;
      border-radius: 10px;
      border: 2px solid var(--bg-surface);
    }

    /* BUTTONS & CARDS */
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      background: var(--bg-card);
      color: var(--text-main);
      border: 1px solid var(--border-color);
      padding: 8px 14px;
      font-size: 13px;
      font-weight: 600;
      border-radius: var(--radius-md);
      cursor: pointer;
      transition: all 0.15s ease;
      text-decoration: none;
    }

    .btn:active {
      transform: scale(0.97);
    }

    .btn-primary {
      background: var(--accent-emerald);
      color: #042416;
      border: none;
      box-shadow: 0 4px 12px var(--accent-emerald-glow);
    }

    .btn-cyan {
      background: var(--accent-cyan);
      color: #04262c;
      border: none;
    }

    .btn-purple {
      background: var(--accent-purple);
      color: #fff;
      border: none;
    }

    .btn-danger {
      background: var(--accent-rose);
      color: #fff;
      border: none;
    }

    .btn-sm {
      padding: 5px 9px;
      font-size: 11px;
      border-radius: var(--radius-sm);
    }

    .btn-full {
      width: 100%;
    }

    .input-field {
      width: 100%;
      background: var(--bg-surface);
      border: 1px solid var(--border-color);
      color: var(--text-main);
      padding: 9px 12px;
      font-size: 13px;
      border-radius: var(--radius-md);
      outline: none;
    }

    .card {
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-lg);
      padding: 14px;
      margin-bottom: 12px;
      position: relative;
    }

    /* BOARD & PIECE STYLING */
    .board-wrapper {
      position: relative;
      width: 100%;
      max-width: 420px;
      margin: 0 auto;
      aspect-ratio: 1 / 1;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.6);
      border-radius: var(--radius-md);
      overflow: hidden;
      border: 2px solid var(--border-color);
    }

    .board-grid {
      display: grid;
      grid-template-columns: repeat(8, 1fr);
      grid-template-rows: repeat(8, 1fr);
      width: 100%;
      height: 100%;
    }

    .square {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
    }

    .square.light {
      background-color: var(--board-light);
    }

    .square.dark {
      background-color: var(--board-dark);
    }

    .square.selected {
      background-color: var(--board-highlight) !important;
    }

    .square.last-move {
      background-color: rgba(245, 158, 11, 0.35) !important;
    }

    .square.in-check {
      background-color: var(--board-check) !important;
    }

    .square.premove {
      background-color: var(--board-premove) !important;
    }

    .sq-coord {
      position: absolute;
      font-size: 9px;
      font-weight: 700;
      opacity: 0.6;
      pointer-events: none;
      font-family: var(--font-mono);
    }

    .sq-coord.rank {
      top: 2px;
      left: 3px;
    }

    .sq-coord.file {
      bottom: 2px;
      right: 3px;
    }

    .square.light .sq-coord {
      color: var(--board-dark);
    }

    .square.dark .sq-coord {
      color: var(--board-light);
    }

    .dest-dot {
      width: 30%;
      height: 30%;
      border-radius: 50%;
      background-color: var(--board-dest-dot);
      pointer-events: none;
    }

    .dest-capture-ring {
      position: absolute;
      inset: 4px;
      border: 4px solid var(--board-dest-dot);
      border-radius: 50%;
      pointer-events: none;
    }

    .piece-fa {
      font-size: clamp(24px, 7.5vw, 38px);
      line-height: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      pointer-events: none;
      transition: transform 0.08s ease;
    }

    .piece-fa.white-piece {
      color: #ffffff;
      filter: drop-shadow(0 3px 3px rgba(0, 0, 0, 0.65)) drop-shadow(0 0 1px #000);
    }

    .piece-fa.black-piece {
      color: #1a202c;
      filter: drop-shadow(0 2px 2px rgba(255, 255, 255, 0.4)) drop-shadow(0 0 1px rgba(0, 0, 0, 0.9));
    }

    /* Move Quality Badges */
    .quality-badge {
      position: absolute;
      top: 2px;
      right: 2px;
      width: 18px;
      height: 18px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 10px;
      font-weight: 800;
      color: #fff;
      pointer-events: none;
      box-shadow: 0 2px 5px rgba(0, 0, 0, 0.5);
      z-index: 5;
    }

    .badge-book {
      background: var(--rev-book);
      color: #111;
    }

    .badge-brilliant {
      background: var(--rev-bril);
    }

    .badge-great {
      background: var(--rev-great);
    }

    .badge-best {
      background: var(--rev-best);
    }

    .badge-excellent {
      background: var(--rev-exc);
    }

    .badge-good {
      background: var(--rev-good);
    }

    .badge-inaccuracy {
      background: var(--rev-inacc);
      color: #111;
    }

    .badge-mistake {
      background: var(--rev-mis);
    }

    .badge-miss {
      background: var(--rev-miss);
    }

    .badge-blunder {
      background: var(--rev-blu);
    }

    /* HUD */
    .player-hud {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 6px 10px;
      background: var(--bg-card);
      border-radius: var(--radius-md);
      margin-bottom: 6px;
      border: 1px solid var(--border-color);
    }

    .player-hud.active-turn {
      border-color: var(--accent-emerald);
      box-shadow: 0 0 8px var(--accent-emerald-glow);
    }

    .player-meta {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .player-name-wrap {
      display: flex;
      flex-direction: column;
    }

    .player-name {
      font-size: 13px;
      font-weight: 700;
    }

    .captured-tray {
      display: flex;
      align-items: center;
      gap: 3px;
      font-size: 10px;
      color: var(--text-muted);
      height: 14px;
      margin-top: 1px;
    }

    .mat-lead-badge {
      font-family: var(--font-mono);
      font-size: 10px;
      font-weight: 800;
      background: rgba(16, 185, 129, 0.2);
      color: var(--accent-emerald);
      padding: 0 3px;
      border-radius: 3px;
      margin-left: 3px;
    }

    .clock-display {
      font-family: var(--font-mono);
      font-size: 16px;
      font-weight: 700;
      background: var(--bg-surface);
      padding: 4px 8px;
      border-radius: var(--radius-sm);
      border: 1px solid var(--border-color);
      color: var(--text-main);
      min-width: 60px;
      text-align: center;
    }

    .clock-display.low-time {
      color: var(--accent-rose);
      border-color: var(--accent-rose);
      animation: pulse 1s infinite;
    }

    @keyframes pulse {

      0%,
      100% {
        opacity: 1;
      }

      50% {
        opacity: 0.6;
      }
    }

    .moves-scroll-box {
      background: var(--bg-surface);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-md);
      height: 52px;
      overflow-y: auto;
      padding: 5px 8px;
      font-family: var(--font-mono);
      font-size: 12px;
      display: flex;
      flex-wrap: wrap;
      align-content: flex-start;
      gap: 5px;
      margin-top: 6px;
    }

    .move-token {
      padding: 1px 4px;
      border-radius: 4px;
      cursor: pointer;
      color: var(--text-muted);
    }

    .move-token.active {
      background: var(--accent-cyan);
      color: #04262c;
      font-weight: 700;
    }

    /* EVAL BAR */
    .eval-gauge {
      width: 100%;
      height: 8px;
      background: #334155;
      border-radius: 4px;
      overflow: hidden;
      margin-bottom: 6px;
      border: 1px solid var(--border-color);
      position: relative;
    }

    .eval-gauge-fill {
      height: 100%;
      width: 50%;
      background: #f8fafc;
      transition: width 0.3s ease;
    }

    /* COACH & ANALYSIS BOXES */
    .coach-box {
      background: var(--bg-surface);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-md);
      padding: 8px 10px;
      margin-top: 6px;
      font-size: 12px;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .palette-row {
      display: flex;
      gap: 6px;
      justify-content: center;
      margin: 8px 0;
      flex-wrap: wrap;
    }

    .palette-btn {
      width: 36px;
      height: 36px;
      border-radius: var(--radius-sm);
      background: var(--bg-surface);
      border: 2px solid var(--border-color);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      font-size: 18px;
    }

    .palette-btn.active {
      border-color: var(--accent-cyan);
      background: var(--bg-card-hover);
    }

    /* MODALS & TOAST */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.82);
      backdrop-filter: blur(4px);
      z-index: 100;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 14px;
    }

    .modal-sheet {
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-lg);
      width: 100%;
      max-width: 450px;
      max-height: 85vh;
      overflow-y: auto;
      padding: 16px;
      box-shadow: 0 16px 40px rgba(0, 0, 0, 0.85);
    }

    .toast-msg {
      position: fixed;
      bottom: 74px;
      left: 50%;
      transform: translateX(-50%);
      background: #1e293b;
      color: #fff;
      border: 1px solid var(--accent-cyan);
      padding: 6px 14px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: 600;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.6);
      z-index: 110;
      animation: fadeInOut 2.4s forwards;
    }

    @keyframes fadeInOut {
      0% {
        opacity: 0;
        transform: translate(-50%, 8px);
      }

      15% {
        opacity: 1;
        transform: translate(-50%, 0);
      }

      85% {
        opacity: 1;
        transform: translate(-50%, 0);
      }

      100% {
        opacity: 0;
        transform: translate(-50%, -8px);
      }
    }

    .promo-dialog {
      display: flex;
      gap: 10px;
      justify-content: center;
      padding: 14px 0;
    }

    .promo-opt {
      width: 58px;
      height: 58px;
      background: var(--bg-surface);
      border: 2px solid var(--border-color);
      border-radius: var(--radius-md);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
    }

    .badge-sig {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      font-size: 10px;
      padding: 2px 6px;
      border-radius: 4px;
      background: rgba(16, 185, 129, 0.15);
      color: var(--accent-emerald);
      border: 1px solid rgba(16, 185, 129, 0.3);
      font-family: var(--font-mono);
    }

    .badge-flair {
      font-size: 9px;
      font-weight: 700;
      padding: 1px 5px;
      border-radius: 4px;
      background: rgba(139, 92, 246, 0.2);
      color: var(--accent-purple);
      border: 1px solid var(--accent-purple);
      display: inline-flex;
      align-items: center;
      line-height: 1.2;
      vertical-align: middle;
      white-space: nowrap;
      flex-shrink: 0;
    }

    .turn-tag {
      font-size: 10px;
      font-weight: 800;
      padding: 2px 6px;
      border-radius: 12px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .turn-tag.your-turn {
      background: rgba(16, 185, 129, 0.2);
      color: var(--accent-emerald);
      border: 1px solid var(--accent-emerald);
      animation: pulse 1.5s infinite;
    }

    .turn-tag.their-turn {
      background: rgba(142, 157, 178, 0.15);
      color: var(--text-muted);
      border: 1px solid var(--border-color);
    }

    .mode-pill {
      font-size: 9px;
      font-weight: 800;
      padding: 1px 5px;
      border-radius: 4px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      display: inline-flex;
      align-items: center;
      gap: 3px;
    }

    .mode-pill.standard {
      background: rgba(6, 182, 212, 0.15);
      color: var(--accent-cyan);
      border: 1px solid rgba(6, 182, 212, 0.3);
    }

    .mode-pill.fantasy {
      background: rgba(139, 92, 246, 0.2);
      color: var(--accent-purple);
      border: 1px solid var(--accent-purple);
    }

    .sub-tabs {
      display: flex;
      background: var(--bg-surface);
      border-radius: var(--radius-md);
      padding: 3px;
      gap: 4px;
      margin-bottom: 10px;
      border: 1px solid var(--border-color);
    }

    .sub-tab-btn {
      flex: 1;
      padding: 7px;
      background: none;
      border: none;
      color: var(--text-muted);
      font-weight: 600;
      font-size: 11px;
      border-radius: var(--radius-sm);
      cursor: pointer;
      text-align: center;
    }

    .sub-tab-btn.active {
      background: var(--bg-card);
      color: var(--text-main);
      border: 1px solid var(--border-color);
    }

    .community-chat-wrap {
      display: flex;
      flex-direction: column;
      height: 360px;
      background: var(--bg-surface);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-md);
      overflow: hidden;
    }

    .chat-stream {
      flex: 1;
      overflow-y: auto;
      padding: 8px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .chat-entry {
      display: flex;
      flex-direction: column;
      background: var(--bg-card);
      padding: 6px 8px;
      border-radius: var(--radius-sm);
      border: 1px solid var(--border-color);

    class IDBStorage {
      constructor() {
        this.dbName = 'chess-community-archive';
        this.dbVersion = 1;
        this.db = null;
      }
      async init() {
        return new Promise((resolve, reject) => {
          const req = indexedDB.open(this.dbName, this.dbVersion);
          req.onupgradeneeded = (e) => {
            const db = e.target.result;
            if (!db.objectStoreNames.contains('games')) {
              const gameStore = db.createObjectStore('games', {
                keyPath: 'gameId'
              });
              gameStore.createIndex('date', 'date', {
                unique: false
              });
            }
            if (!db.objectStoreNames.contains('settings')) {
              db.createObjectStore('settings');
            }
          };
          req.onsuccess = (e) => {
            this.db = e.target.result;
            resolve(this.db);
          };
          req.onerror = () => reject(req.error);
        });
      }
      async get(storeName, key) {
        return new Promise((resolve, reject) => {
          const tx = this.db.transaction(storeName, 'readonly');
          const store = tx.objectStore(storeName);
          const req = store.get(key);
          req.onsuccess = () => resolve(req.result);
          req.onerror = () => reject(req.error);
        });
      }
      async put(storeName, value, key) {
        return new Promise((resolve, reject) => {
          const tx = this.db.transaction(storeName, 'readwrite');
          const store = tx.objectStore(storeName);
          const req = key !== undefined ? store.put(value, key) : store.put(value);
          req.onsuccess = () => resolve(req.result);
          req.onerror = () => reject(req.error);
        });
      }
      async getAll(storeName) {
        return new Promise((resolve, reject) => {
          const tx = this.db.transaction(storeName, 'readonly');
          const store = tx.objectStore(storeName);
          const req = store.getAll();
          req.onsuccess = () => resolve(req.result || []);
          req.onerror = () => reject(req.error);
        });
      }
      async clearAll() {
        const tx = this.db.transaction(['games', 'settings'], 'readwrite');
        tx.objectStore('games').clear();
        tx.objectStore('settings').clear();
      }
    }

    /* ==========================================================================
       ANTI-TAMPER SECURITY LAYER
       ========================================================================== */
    class AntiTamper {
      constructor() {
        this.deviceSecret = null;
        this.hmacKey = null;
      }
      async init(userId) {
        let secret = await dbManager.get('settings', 'deviceSecret');
        if (!secret) {
          secret = crypto.getRandomValues(new Uint8Array(32));
          await dbManager.put('settings', secret, 'deviceSecret');
        }
        this.deviceSecret = secret;
        const enc = new TextEncoder();
        const salt = enc.encode(`chess-community-${userId}`);
        const baseKey = await crypto.subtle.importKey('raw', this.deviceSecret, {
          name: 'PBKDF2'
        }, false, ['deriveKey']);
        this.hmacKey = await crypto.subtle.deriveKey({
            name: 'PBKDF2',
            salt,
            iterations: 10000,
            hash: 'SHA-256'
          },
          baseKey, {
            name: 'HMAC',
            hash: 'SHA-256'
          },
          true,
          ['sign', 'verify']
        );
      }
      async sign(canonicalString) {
        if (!this.hmacKey) throw new Error('Key not ready');
        const enc = new TextEncoder();
        const sigBuf = await crypto.subtle.sign('HMAC', this.hmacKey, enc.encode(canonicalString));
        return Array.from(new Uint8Array(sigBuf)).map(b => b.toString(16).padStart(2, '0')).join('');
      }
      async verify(canonicalString, hexSignature) {
        if (!this.hmacKey || !hexSignature) return false;
        const match = hexSignature.match(/.{1,2}/g);
        if (!match) return false;
        const sigBytes = new Uint8Array(match.map(byte => parseInt(byte, 16)));
        const enc = new TextEncoder();
        return await crypto.subtle.verify('HMAC', this.hmacKey, sigBytes, enc.encode(canonicalString));
      }
    }

                readyDetach();
                this.isReady = true;
                resolve(true);
              }
            });

            this.send('uci');

            // Fallback timeout in case the CDN is blocked or slow

            console.warn('Stockfish Worker failed to initialize:', err);

          }
        }

        this.listeners.add(cb);
        return () => this.listeners.delete(cb);

        if (line === 'readyok') {

              this.openingCache.set(fen, name);
              return name;
            }
          }
        } catch (e) {}
        return null;
      }

          let f = 0;
          for (let char of rows[r]) {
            if (char >= '1' && char <= '8') f += parseInt(char, 10);
            else {
              const sq = (r << 4) | f;
              const isLower = char === char.toLowerCase();
              const type = {
                p: 1,
                n: 2,
                b: 3,
                r: 4,
                q: 5,
                k: 6
              } [char.toLowerCase()];
              this.board[sq] = isLower ? (type | 8) : type;
              f++;
            }
          }
        }
        this.turn = parts[1] === 'b' ? 'b' : 'w';
        this.castling = {
          K: parts[2] ? parts[2].includes('K') : false,
          Q: parts[2] ? parts[2].includes('Q') : false,
          k: parts[2] ? parts[2].includes('k') : false,
          q: parts[2] ? parts[2].includes('q') : false
        };
        this.enPassant = (parts[3] && parts[3] !== '-') ? ChessGame.coordToSq(parts[3]) : null;
        this.halfmoveClock = parseInt(parts[4], 10) || 0;
        this.fullmoveNumber = parseInt(parts[5], 10) || 1;
        this.history = [this.getHash()];
      }

      generateFen() {
        let fen = '';
        for (let r = 0; r < 8; r++) {
          let empty = 0;
          for (let f = 0; f < 8; f++) {
            const sq = (r << 4) | f;
            const piece = this.board[sq];
            if (piece === 0) empty++;
            else {
              if (empty > 0) {
                fen += empty;
                empty = 0;
              }
              fen += PIECE_SYMBOLS[piece];
            }
          }
          if (empty > 0) fen += empty;
          if (r < 7) fen += '/';
        }
        fen += ` ${this.turn} `;
        let castStr = '';
        if (this.castling.K) castStr += 'K';
        if (this.castling.Q) castStr += 'Q';
        if (this.castling.k) castStr += 'k';
        if (this.castling.q) castStr += 'q';
        fen += (castStr || '-') + ` ${this.enPassant !== null ? ChessGame.sqToCoord(this.enPassant) : '-'} ${this.halfmoveClock} ${this.fullmoveNumber}`;
        return fen;
      }

      isAttacked(targetSq, byColor) {
        if (this.archetype === 'antichess') return false;
        for (let offset of KNIGHT_OFFSETS) {
          const sq = targetSq + offset;
          if (!ChessGame.isOffBoard(sq)) {
            const p = this.board[sq];
            if (p && this.getColor(p) === byColor && this.getType(p) === 2) return true;
          }
        }
        for (let offset of BISHOP_OFFSETS) {
          let sq = targetSq + offset;
          while (!ChessGame.isOffBoard(sq)) {
            const p = this.board[sq];
            if (p) {
              if (this.getColor(p) === byColor && (this.getType(p) === 3 || this.getType(p) === 5)) return true;
              break;
            }
            sq += offset;
          }
        }
        for (let offset of ROOK_OFFSETS) {
          let sq = targetSq + offset;
          while (!ChessGame.isOffBoard(sq)) {
            const p = this.board[sq];
            if (p) {
              if (this.getColor(p) === byColor && (this.getType(p) === 4 || this.getType(p) === 5)) return true;
              break;
            }
            sq += offset;
          }
        }
        const pawnDir = byColor === 'w' ? 16 : -16;
        for (let pawnOffset of [-1, 1]) {
          const sq = targetSq + pawnDir + pawnOffset;
          if (!ChessGame.isOffBoard(sq)) {
            const p = this.board[sq];
            if (p && this.getColor(p) === byColor && this.getType(p) === 1) return true;
          }
        }
        for (let offset of QUEEN_KING_OFFSETS) {
          const sq = targetSq + offset;
          if (!ChessGame.isOffBoard(sq)) {
            const p = this.board[sq];
            if (p && this.getColor(p) === byColor && this.getType(p) === 6) return true;
          }
        }
        return false;
      }

      findKing(color) {
        const kingPiece = color === 'w' ? W_KING : B_KING;
        for (let r = 0; r < 8; r++) {
          for (let f = 0; f < 8; f++) {
            const sq = (r << 4) | f;
            if (this.board[sq] === kingPiece) return sq;
          }
        }
        return -1;
      }

      inCheck(color = this.turn) {
        if (this.archetype === 'antichess') return false;
        if (this.archetype === 'horde' && color === 'w') return false;
        const kingSq = this.findKing(color);
        if (kingSq === -1) return false;
        return this.isAttacked(kingSq, color === 'w' ? 'b' : 'w');
      }

      generatePseudoMoves() {
        const moves = [];
        const isWhite = this.turn === 'w';
        const forward = isWhite ? -16 : 16;
        const startRank = isWhite ? 6 : 1;
        const promoRank = isWhite ? 0 : 7;

        for (let r = 0; r < 8; r++) {
          for (let f = 0; f < 8; f++) {
            const sq = (r << 4) | f;
            const piece = this.board[sq];
            if (!piece || this.getColor(piece) !== this.turn) continue;
            const type = this.getType(piece);

            if (type === 1) {
              const oneStep = sq + forward;
              if (!ChessGame.isOffBoard(oneStep) && this.board[oneStep] === EMPTY) {
                if ((oneStep >> 4) === promoRank) {
                  const promoPieces = (this.archetype === 'antichess') ? [6, 5, 4, 3, 2] : [5, 4, 3, 2];
                  for (let p of promoPieces) moves.push({
                    from: sq,
                    to: oneStep,
                    piece,
                    captured: 0,
                    promotion: isWhite ? p : (p | 8)
                  });
                } else {
                  moves.push({
                    from: sq,
                    to: oneStep,
                    piece,
                    captured: 0
                  });
                  const canDouble = (this.archetype === 'horde' && isWhite) ? ((sq >> 4) >= 4) : ((sq >> 4) === startRank);
                  if (canDouble && this.board[sq + forward * 2] === EMPTY) {
                    moves.push({
                      from: sq,
                      to: sq + forward * 2,
                      piece,
                      captured: 0,
                      isDoublePawn: true
                    });
                  }
                }
              }
              for (let capOffset of [-1, 1]) {
                const capSq = sq + forward + capOffset;
                if (!ChessGame.isOffBoard(capSq)) {
                  const targetPiece = this.board[capSq];
                  if (targetPiece && this.getColor(targetPiece) !== this.turn) {
                    if ((capSq >> 4) === promoRank) {
                      const promoPieces = (this.archetype === 'antichess') ? [6, 5, 4, 3, 2] : [5, 4, 3, 2];
                      for (let p of promoPieces) moves.push({
                        from: sq,
                        to: capSq,
                        piece,
                        captured: targetPiece,
                        promotion: isWhite ? p : (p | 8)
                      });
                    } else {
                      moves.push({
                        from: sq,
                        to: capSq,
                        piece,
                        captured: targetPiece
                      });
                    }
                  } else if (capSq === this.enPassant) {
                    moves.push({
                      from: sq,
                      to: capSq,
                      piece,
                      captured: this.board[sq + capOffset],
                      isEnPassant: true
                    });
                  }
                }
              }
            } else if (type === 2) {
              for (let offset of KNIGHT_OFFSETS) {
                const to = sq + offset;
                if (!ChessGame.isOffBoard(to) && (!this.board[to] || this.getColor(this.board[to]) !== this.turn)) {
                  moves.push({
                    from: sq,
                    to,
                    piece,
                    captured: this.board[to]
                  });
                }
              }
            } else if (type === 3 || type === 5) {
              for (let offset of BISHOP_OFFSETS) {
                let to = sq + offset;
                while (!ChessGame.isOffBoard(to)) {
                  const target = this.board[to];
                  if (!target) moves.push({
                    from: sq,
                    to,
                    piece,
                    captured: 0
                  });
                  else {
                    if (this.getColor(target) !== this.turn) moves.push({
                      from: sq,
                      to,
                      piece,
                      captured: target
                    });
                    break;
                  }
                  to += offset;
                }
              }
            }
            if (type === 4 || type === 5) {
              for (let offset of ROOK_OFFSETS) {
                let to = sq + offset;
                while (!ChessGame.isOffBoard(to)) {
                  const target = this.board[to];
                  if (!target) moves.push({
                    from: sq,
                    to,
                    piece,
                    captured: 0
                  });
                  else {
                    if (this.getColor(target) !== this.turn) moves.push({
                      from: sq,
                      to,
                      piece,
                      captured: target
                    });
                    break;
                  }
                  to += offset;
                }
              }
            } else if (type === 6) {
              for (let offset of QUEEN_KING_OFFSETS) {
                const to = sq + offset;
                if (!ChessGame.isOffBoard(to) && (!this.board[to] || this.getColor(this.board[to]) !== this.turn)) {
                  moves.push({
                    from: sq,
                    to,
                    piece,
                    captured: this.board[to]
                  });
                }
              }
              if (this.archetype !== 'racing_kings' && this.archetype !== 'antichess') {
                const enemy = isWhite ? 'b' : 'w';
                if (isWhite && sq === 0x74 && !this.inCheck('w')) {
                  if (this.castling.K && !this.board[0x75] && !this.board[0x76] && !this.isAttacked(0x75, enemy) && !this.isAttacked(0x76, enemy)) {
                    moves.push({
                      from: sq,
                      to: 0x76,
                      piece,
                      captured: 0,
                      isCastle: 'K'
                    });
                  }
                  if (this.castling.Q && !this.board[0x73] && !this.board[0x72] && !this.board[0x71] && !this.isAttacked(0x73, enemy) && !this.isAttacked(0x72, enemy)) {
                    moves.push({
                      from: sq,
                      to: 0x72,
                      piece,
                      captured: 0,
                      isCastle: 'Q'
                    });
                  }
                } else if (!isWhite && sq === 0x04 && !this.inCheck('b')) {
                  if (this.castling.k && !this.board[0x05] && !this.board[0x06] && !this.isAttacked(0x05, enemy) && !this.isAttacked(0x06, enemy)) {
                    moves.push({
                      from: sq,
                      to: 0x06,
                      piece,
                      captured: 0,
                      isCastle: 'k'
                    });
                  }
                  if (this.castling.q && !this.board[0x03] && !this.board[0x02] && !this.board[0x01] && !this.isAttacked(0x03, enemy) && !this.isAttacked(0x02, enemy)) {
                    moves.push({
                      from: sq,
                      to: 0x02,
                      piece,
                      captured: 0,
                      isCastle: 'q'
                    });
                  }
                }
              }
            }
          }
        }
        return moves;
      }

      makeMove(move) {
        const prevTurn = this.turn;
        this.board[move.to] = move.promotion ? move.promotion : move.piece;
        this.board[move.from] = EMPTY;

        if (move.isEnPassant) this.board[move.to + (prevTurn === 'w' ? 16 : -16)] = EMPTY;

        if (move.isCastle) {
          if (move.isCastle === 'K') {
            this.board[0x75] = W_ROOK;
            this.board[0x77] = EMPTY;
          } else if (move.isCastle === 'Q') {
            this.board[0x73] = W_ROOK;
            this.board[0x70] = EMPTY;
          } else if (move.isCastle === 'k') {
            this.board[0x05] = B_ROOK;
            this.board[0x07] = EMPTY;
          } else if (move.isCastle === 'q') {
            this.board[0x03] = B_ROOK;
            this.board[0x00] = EMPTY;
          }
        }

        if (this.archetype === 'portal' && PORTAL_SQUARES[move.to] !== undefined) {
          const exitSq = PORTAL_SQUARES[move.to];
          if (this.board[exitSq] === EMPTY) {
            this.board[exitSq] = this.board[move.to];
            this.board[move.to] = EMPTY;
          }
        }

        if (this.archetype === 'atomic' && move.captured) {
          this.board[move.to] = EMPTY;
          for (let offset of QUEEN_KING_OFFSETS) {
            const adj = move.to + offset;
            if (!ChessGame.isOffBoard(adj)) {
              const adjPiece = this.board[adj];
              if (adjPiece && this.getType(adjPiece) !== 1) this.board[adj] = EMPTY;
            }
          }
        }

        if (this.archetype === 'benedict') {
          for (let offset of QUEEN_KING_OFFSETS) {
            const adj = move.to + offset;
            if (!ChessGame.isOffBoard(adj)) {
              const adjPiece = this.board[adj];
              if (adjPiece && this.getColor(adjPiece) !== prevTurn) {
                const adjType = this.getType(adjPiece);
                this.board[adj] = prevTurn === 'w' ? adjType : (adjType | 8);
              }
            }
          }
        }

        if (move.piece === W_KING) {
          this.castling.K = false;
          this.castling.Q = false;
        }
        if (move.piece === B_KING) {
          this.castling.k = false;
          this.castling.q = false;
        }
        if (move.from === 0x77 || move.to === 0x77) this.castling.K = false;
        if (move.from === 0x70 || move.to === 0x70) this.castling.Q = false;
        if (move.from === 0x07 || move.to === 0x07) this.castling.k = false;
        if (move.from === 0x00 || move.to === 0x00) this.castling.q = false;

        this.enPassant = move.isDoublePawn ? (move.from + (prevTurn === 'w' ? -16 : 16)) : null;
        this.halfmoveClock = (this.getType(move.piece) === 1 || move.captured) ? 0 : this.halfmoveClock + 1;
        if (prevTurn === 'b') this.fullmoveNumber++;
        this.turn = prevTurn === 'w' ? 'b' : 'w';

        if (this.archetype !== 'antichess') {
          if (this.archetype === 'racing_kings' && this.inCheck(this.turn)) return false;
          if (this.inCheck(prevTurn)) return false;
        }

        if (this.archetype === 'three_check' && this.inCheck(this.turn)) {
          this.checksGiven[prevTurn]++;
        }

        this.history.push(this.getHash());
        return true;
      }

      getLegalMoves() {
        let legals = this.generatePseudoMoves().filter(m => this.clone().makeMove(m));
        if (this.archetype === 'antichess') {
          const captures = legals.filter(m => m.captured !== 0 || m.isEnPassant);
          if (captures.length > 0) return captures;
        }
        return legals;
      }

      isLegalMove(from, to, promo = null) {
        return this.getLegalMoves().find(m => m.from === from && m.to === to && (!promo || m.promotion === promo));
      }

      moveToSAN(move) {
        if (move.isCastle === 'K' || move.isCastle === 'k') return 'O-O';
        if (move.isCastle === 'Q' || move.isCastle === 'q') return 'O-O-O';
        const type = this.getType(move.piece);
        let san = '';
        if (type === 1) {
          if (move.captured) san += ChessGame.sqToCoord(move.from)[0] + 'x';
          san += ChessGame.sqToCoord(move.to);
          if (move.promotion) san += '=' + PIECE_SYMBOLS[move.promotion].toUpperCase();
        } else {
          san += PIECE_SYMBOLS[type].toUpperCase();
          if (move.captured) san += 'x';
          san += ChessGame.sqToCoord(move.to);
        }
        const sim = this.clone();
        sim.makeMove(move);
        if (sim.inCheck()) san += sim.getLegalMoves().length === 0 ? '#' : '+';
        return san;
      }

      execute(from, to, promo = null) {
        const legal = this.isLegalMove(from, to, promo);
        if (!legal) return null;
        const san = this.moveToSAN(legal);
        this.makeMove(legal);
        const fen = this.generateFen();
        const record = {
          from,
          to,
          piece: legal.piece,
          captured: legal.captured,
          promotion: legal.promotion || null,
          san,
          fen
        };
        this.moveHistory.push(record);
        return record;
      }

      isInsufficientMaterial() {
        if (this.archetype !== 'standard') return false;
        const pieces = [];
        for (let i = 0; i < 128; i++) {
          if ((i & 0x88) === 0 && this.board[i]) {
            pieces.push({
              type: this.getType(this.board[i]),
              sq: i,
              color: this.getColor(this.board[i])
            });
          }
        }
        if (pieces.length === 2) return true;
        if (pieces.length === 3) {
          const minor = pieces.find(p => p.type === 2 || p.type === 3);
          if (minor) return true;
        }
        return false;
      }

      isGameOver() {
        if (this.archetype === 'king_of_the_hill') {
          const centerSqs = [0x33, 0x34, 0x43, 0x44];
          const wKing = this.findKing('w');
          const bKing = this.findKing('b');
          if (centerSqs.includes(wKing)) return {
            over: true,
            result: '1-0',
            reason: 'King of the Hill (White reached center)'
          };
          if (centerSqs.includes(bKing)) return {
            over: true,
            result: '0-1',
            reason: 'King of the Hill (Black reached center)'
          };
        }
        if (this.archetype === 'three_check') {
          if (this.checksGiven.w >= 3) return {
            over: true,
            result: '1-0',
            reason: 'Three checks delivered'
          };
          if (this.checksGiven.b >= 3) return {
            over: true,
            result: '0-1',
            reason: 'Three checks delivered'
          };
        }
        if (this.archetype === 'atomic') {
          const wKing = this.findKing('w');
          const bKing = this.findKing('b');
          if (wKing === -1 && bKing === -1) return {
            over: true,
            result: '1/2-1/2',
            reason: 'Both Kings exploded'
          };
          if (wKing === -1) return {
            over: true,
            result: '0-1',
            reason: 'White King exploded'
          };
          if (bKing === -1) return {
            over: true,
            result: '1-0',
            reason: 'Black King exploded'
          };
        }
        if (this.archetype === 'antichess') {
          let wCount = 0,
            bCount = 0;
          for (let i = 0; i < 128; i++) {
            if ((i & 0x88) === 0 && this.board[i]) {
              if (this.getColor(this.board[i]) === 'w') wCount++;
              else bCount++;
            }
          }
          if (wCount === 0) return {
            over: true,
            result: '1-0',
            reason: 'Antichess: White cleared all pieces'
          };
          if (bCount === 0) return {
            over: true,
            result: '0-1',
            reason: 'Antichess: Black cleared all pieces'
          };
          if (this.getLegalMoves().length === 0) {
            if (wCount < bCount) return {
              over: true,
              result: '1-0',
              reason: 'Antichess: White has fewer pieces'
            };
            if (bCount < wCount) return {
              over: true,
              result: '0-1',
              reason: 'Antichess: Black has fewer pieces'
            };
            return {
              over: true,
              result: '1/2-1/2',
              reason: 'Antichess: Draw on stalemate'
            };
          }
        }
        if (this.archetype === 'horde') {
          let whitePawns = 0;
          for (let i = 0; i < 128; i++) {
            if ((i & 0x88) === 0 && this.board[i] && this.getColor(this.board[i]) === 'w') whitePawns++;
          }
          if (whitePawns === 0) return {
            over: true,
            result: '0-1',
            reason: 'Horde: All White pawns eliminated'
          };
        }
        if (this.archetype === 'racing_kings') {
          const wKing = this.findKing('w');
          const bKing = this.findKing('b');
          const wAtGoal = (wKing !== -1 && (wKing >> 4) === 0);
          const bAtGoal = (bKing !== -1 && (bKing >> 4) === 0);
          if (wAtGoal && bAtGoal) return {
            over: true,
            result: '1/2-1/2',
            reason: 'Racing Kings: Tie'
          };
          if (bAtGoal) return {
            over: true,
            result: '0-1',
            reason: 'Racing Kings: Black reached 8th rank'
          };
          if (wAtGoal && this.turn === 'w') return {
            over: true,
            result: '1-0',
            reason: 'Racing Kings: White reached 8th rank'
          };
        }

        const legals = this.getLegalMoves();
        const inChk = this.inCheck();
        if (legals.length === 0) {
          if (inChk) return {
            over: true,
            result: this.turn === 'w' ? '0-1' : '1-0',
            reason: 'Checkmate'
          };
          return {
            over: true,
            result: '1/2-1/2',
            reason: 'Stalemate'
          };
        }
        if (this.halfmoveClock >= 100) return {
          over: true,
          result: '1/2-1/2',
          reason: '50-move rule'
        };
        const h = this.getHash();
        if (this.history.filter(x => x === h).length >= 3) return {
          over: true,
          result: '1/2-1/2',
          reason: 'Threefold repetition'
        };
        if (this.isInsufficientMaterial()) return {
          over: true,
          result: '1/2-1/2',
          reason: 'Insufficient material'
        };
        return {
          over: false
        };
      }

      getMaterialDiff() {
        let whiteScore = 0;
        let blackScore = 0;
        const whiteCaptured = [];
        const blackCaptured = [];
        for (let i = 0; i < 128; i++) {
          if ((i & 0x88) === 0 && this.board[i]) {
            const p = this.board[i];
            const color = this.getColor(p);
            const type = this.getType(p);
            if (color === 'w') whiteScore += PIECE_VALUES[type] || 0;
            else blackScore += PIECE_VALUES[type] || 0;
          }
        }
        return {
          diff: whiteScore - blackScore,
          whiteCaptured,
          blackCaptured
        };
      }

      getHash() {
        let h = `${this.turn}|${this.archetype}|${this.checksGiven.w},${this.checksGiven.b}|`;
        for (let i = 0; i < 128; i++) {
          if ((i & 0x88) === 0 && this.board[i]) h += `${i}:${this.board[i]},`;
        }
        return h;
      }
    }

    /* ==========================================================================
       STANDARD ELO FORMULA & ARROWS
       ========================================================================== */
    function calculateEloChange(myRating, oppRating, myScore) {
      const K = 32;
      const expected = 1 / (1 + Math.pow(10, (oppRating - myRating) / 400));
      const delta = Math.round(K * (myScore - expected));
      return {
        delta,
        newRating: Math.max(100, myRating + delta)
      };
    }

    function renderBoardArrow(fromSq, toSq, color = 'rgba(245, 158, 11, 0.75)', isFlipped = false) {
      const fromRow = fromSq >> 4;
      const fromCol = fromSq & 7;
      const toRow = toSq >> 4;
      const toCol = toSq & 7;
      const fc = isFlipped ? 7 - fromCol : fromCol;
      const fr = isFlipped ? 7 - fromRow : fromRow;
      const tc = isFlipped ? 7 - toCol : toCol;
      const tr = isFlipped ? 7 - toRow : toRow;
      const x1 = (fc + 0.5) * 12.5;
      const y1 = (fr + 0.5) * 12.5;
      const x2 = (tc + 0.5) * 12.5;
      const y2 = (tr + 0.5) * 12.5;
      const id = 'arr_' + Math.floor(Math.random() * 100000);
      return `
        <defs>
          <marker id="${id}" markerWidth="4" markerHeight="4" refX="2.5" refY="2" orient="auto">
            <polygon points="0 0, 4 2, 0 4" fill="${color}" />
          </marker>
        </defs>
        <line x1="${x1}%" y1="${y1}%" x2="${x2}%" y2="${y2}%" stroke="${color}" stroke-width="2.2%" marker-end="url(#${id})" opacity="0.85" stroke-linecap="round" />
      `;
    }

    /* ==========================================================================
       FIREBASE NETWORK BUS
       ========================================================================== */
    class NetworkBus {
      constructor() {
        this.rtdb = null;
        this.auth = null;
        this.listeners = new Map();
        this.isConnected = false;
        this.activeChallengeRef = null;
      }
      async init(config, userId) {
        try {
          if (!window.firebase.apps.length) window.firebase.initializeApp(config);
          this.rtdb = window.firebase.database();
          this.auth = window.firebase.auth();
          try {
            await this.auth.signInAnonymously();
          } catch (e) {}

          const connectedRef = this.rtdb.ref('.info/connected');
          const myPresenceRef = this.rtdb.ref(`presence/${userId}`);

          connectedRef.on('value', (snap) => {
            if (snap.val() === true) {
              this.isConnected = true;
              myPresenceRef.onDisconnect().set({
                online: false,
                lastSeen: window.firebase.database.ServerValue.TIMESTAMP
              });
              myPresenceRef.set({
                online: true,
                lastSeen: window.firebase.database.ServerValue.TIMESTAMP
              });
              this.emit('network:status', 'connected');
            } else {
              this.isConnected = false;
              this.emit('network:status', 'simulated');
            }
          });
          this.sweepStaleData();
          return true;
        } catch (err) {
          this.isConnected = false;
          return false;
        }
      }
      on(topic, handler) {
        if (!this.listeners.has(topic)) this.listeners.set(topic, []);
        this.listeners.get(topic).push(handler);
      }
      emit(topic, payload) {
        if (this.listeners.has(topic)) this.listeners.get(topic).forEach(h => h(payload));
      }
      sweepStaleData() {
        if (!this.rtdb) return;
        const now = Date.now();
        const tenMinsAgo = now - 10 * 60 * 1000;
        const oneDayAgo = now - 24 * 60 * 60 * 1000;
        this.rtdb.ref('challenges').once('value', (snap) => {
          const list = snap.val() || {};
          const updates = {};
          Object.keys(list).forEach(key => {
            const c = list[key];
            if (c.createdAt && c.createdAt < tenMinsAgo) updates[`challenges/${key}`] = null;
          });
          if (Object.keys(updates).length > 0) this.rtdb.ref().update(updates);
        });
        this.rtdb.ref('games').orderByChild('status').equalTo('active').once('value', (snap) => {
          const games = snap.val() || {};
          const updates = {};
          Object.keys(games).forEach(gId => {
            const g = games[gId];
            if (g.startedAt && g.startedAt < oneDayAgo) {
              updates[`games/${gId}/status`] = 'abandoned';
              if (g.white) updates[`user_games/${g.white}/${gId}`] = null;
              if (g.black) updates[`user_games/${g.black}/${gId}`] = null;
            }
          });
          if (Object.keys(updates).length > 0) this.rtdb.ref().update(updates);
        });
      }
      createChallenge(challengeData) {
        if (!this.rtdb) return;
        const ref = this.rtdb.ref(`challenges/${challengeData.id}`);
        this.activeChallengeRef = ref;
        ref.onDisconnect().remove();
        return ref.set(challengeData);
      }
      cancelChallenge(challengeId) {
        if (!this.rtdb) return;
        if (this.activeChallengeRef) {
          this.activeChallengeRef.onDisconnect().cancel();
          this.activeChallengeRef = null;
        }
        return this.rtdb.ref(`challenges/${challengeId}`).remove();
      }
      acceptChallenge(challengeId, gameData, acceptorProfile) {
        if (!this.rtdb) return;
        const updates = {};
        updates[`challenges/${challengeId}/status`] = 'accepted';
        updates[`challenges/${challengeId}/gameId`] = gameData.id;
        updates[`challenges/${challengeId}/acceptedById`] = acceptorProfile.id;
        updates[`challenges/${challengeId}/acceptedByName`] = acceptorProfile.name;
        updates[`challenges/${challengeId}/acceptedByRating`] = (gameData.gameMode === 'fantasy' ? (acceptorProfile.fantasyRating || 1200) : (acceptorProfile.standardRating || acceptorProfile.rating || 1200));
        updates[`challenges/${challengeId}/acceptedByAvatar`] = acceptorProfile.avatar || 'fa-solid fa-chess-knight';
        updates[`games/${gameData.id}`] = gameData;
        updates[`user_games/${gameData.white}/${gameData.id}`] = true;
        updates[`user_games/${gameData.black}/${gameData.id}`] = true;
        return this.rtdb.ref().update(updates);
      }
      listenChallenges(callback) {
        if (!this.rtdb) return;
        const ref = this.rtdb.ref('challenges');
        ref.off();
        ref.on('value', (snap) => callback(snap.val() || {}));
      }
      listenUserGames(userId, callback) {
        if (!this.rtdb) return;
        this.rtdb.ref(`user_games/${userId}`).on('value', async (snap) => {
          const gameIdsMap = snap.val() || {};

          const ids = Object.keys(gameIdsMap);
          if (ids.length === 0) {
            callback([]);
            return;
          }
          const games = [];
          for (const id of ids) {
            const gSnap = await this.rtdb.ref(`games/${id}`).once('value');
            const gVal = gSnap.val();
            if (gVal && gVal.status === 'active') games.push(gVal);
            else this.rtdb.ref(`user_games/${userId}/${id}`).remove();
          }
          callback(games);
        });
      }
      listenGame(gameId, onMove, onState, onChat) {
        if (!this.rtdb) return () => {};
        const movesRef = this.rtdb.ref(`games/${gameId}/moves`);
        const stateRef = this.rtdb.ref(`games/${gameId}/stateEvent`);
        const chatRef = this.rtdb.ref(`chat/${gameId}`);
        movesRef.on('child_added', (snap) => onMove(snap.val()));
        stateRef.on('value', (snap) => {
          if (snap.val()) onState(snap.val());
        });
        chatRef.on('child_added', (snap) => onChat(snap.val()));
        return () => {
          movesRef.off();
          stateRef.off();
          chatRef.off();
        };
      }
      sendMove(gameId, moveData, nextTurn, whiteTime, blackTime) {
        if (!this.rtdb) return;
        const updates = {};
        const moveKey = this.rtdb.ref(`games/${gameId}/moves`).push().key;
        updates[`games/${gameId}/moves/${moveKey}`] = moveData;
        updates[`games/${gameId}/turn`] = nextTurn;
        updates[`games/${gameId}/whiteTime`] = whiteTime;
        updates[`games/${gameId}/blackTime`] = blackTime;
        updates[`games/${gameId}/lastMoveAt`] = window.firebase.database.ServerValue.TIMESTAMP;
        this.rtdb.ref().update(updates);
      }
      sendStateEvent(gameId, stateData) {
        if (!this.rtdb) return;
        this.rtdb.ref(`games/${gameId}/stateEvent`).set(stateData);
      }
      sendGameChat(gameId, chatData) {
        if (!this.rtdb) return;
        this.rtdb.ref(`chat/${gameId}`).push(chatData);
      }
      finalizeGame(gameId, whiteId, blackId, result, reason) {
        if (!this.rtdb) return;
        const updates = {};
        updates[`games/${gameId}/status`] = 'completed';
        updates[`games/${gameId}/result`] = result;
        updates[`games/${gameId}/resultReason`] = reason;
        updates[`user_games/${whiteId}/${gameId}`] = null;
        updates[`user_games/${blackId}/${gameId}`] = null;
        this.rtdb.ref().update(updates);
      }
      sendCommunityChat(msgObj) {
        if (!this.rtdb) return;
        return this.rtdb.ref('community_chat').push(msgObj);
      }
      listenCommunityChat(callback) {
        if (!this.rtdb) return;
        const ref = this.rtdb.ref('community_chat').limitToLast(50);
        ref.off();
        ref.on('value', (snap) => callback(snap.val() || {}));
      }
      syncLeaderboard(user) {
        if (!this.rtdb) return;
        this.rtdb.ref(`leaderboard/${user.id}`).set({
          id: user.id,
          name: user.name,
          rating: user.standardRating || user.rating || 1200,
          standardRating: user.standardRating || user.rating || 1200,
          standardWins: user.standardWins || user.wins || 0,
          standardLosses: user.standardLosses || user.losses || 0,
          standardDraws: user.standardDraws || user.draws || 0,
          fantasyRating: user.fantasyRating || 1200,
          fantasyWins: user.fantasyWins || 0,
          fantasyLosses: user.fantasyLosses || 0,
          fantasyDraws: user.fantasyDraws || 0,
          title: user.title || 'Member',
          avatar: user.avatar || 'fa-solid fa-chess-knight',
          cardBg: user.cardBg || '',
          bio: user.bio || '',
          updatedAt: window.firebase.database.ServerValue.TIMESTAMP
        });
      }
      fetchLeaderboard(callback, filterMode = 'standard', currentUserId = null, currentUserName = null) {
        if (!this.rtdb) return;
        this.rtdb.ref('leaderboard').once('value', (snap) => {
          const data = snap.val() || {};
          const byUser = new Map();
          Object.entries(data).forEach(([key, p]) => {
            if (!p || typeof p !== 'object') return;
            const uid = p.id || key;
            const cleanName = (p.name || '').trim().toLowerCase();
            if (!cleanName) return;
            if (currentUserId && currentUserName && cleanName === currentUserName.trim().toLowerCase() && uid !== currentUserId) {
              this.rtdb.ref(`leaderboard/${key}`).remove();
              return;
            }
            const pRating = filterMode === 'fantasy' ? (p.fantasyRating || 1200) : (p.standardRating || p.rating || 1200);
            const existing = byUser.get(cleanName);
            if (!existing) {
              byUser.set(cleanName, {
                ...p,
                id: uid,
                _key: key,
                _activeRating: pRating
              });
            } else {
              const existingTime = existing.updatedAt || 0;
              const newTime = p.updatedAt || 0;
              if (newTime > existingTime || (newTime === existingTime && pRating > existing._activeRating)) {
                if (existing._key && existing._key !== key) this.rtdb.ref(`leaderboard/${existing._key}`).remove();
                byUser.set(cleanName, {
                  ...p,
                  id: uid,
                  _key: key,
                  _activeRating: pRating
                });
              } else {
                this.rtdb.ref(`leaderboard/${key}`).remove();
              }
            }
          });
          const sorted = Array.from(byUser.values()).sort((a, b) => b._activeRating - a._activeRating).slice(0, 30);
          callback(sorted);
        });
      }
    }
    const net = new NetworkBus();

        try {
          const parts = tc.toString().split('+');
          const mins = parseFloat(parts[0]);
          return isNaN(mins) ? 0 : Math.round(mins * 60);
        } catch (e) {
          return 0;

        const av = (userObj && typeof userObj.avatar === 'string' && userObj.avatar.trim()) ? userObj.avatar.trim() : 'fa-solid fa-chess-knight';
        if (av.startsWith('http://') || av.startsWith('https://') || av.startsWith('data:image')) {
          return `<img src="${this.escapeHtml(av)}" alt="Avatar" style="width:100%; height:100%; border-radius:50%; object-fit:cover;">`;
        } else if (av.startsWith('fa-')) {
          return `<i class="${this.escapeHtml(av)}" style="font-size:${Math.round(size * 0.48)}px;"></i>`;
        }
        const nameChar = (userObj && userObj.name && typeof userObj.name === 'string') ? userObj.name.charAt(0) : '?';
        return this.escapeHtml(nameChar.toUpperCase());
      }

      async verifyAndRepairIntegrity() {
        const newCanonical = `${this.user.id}|${this.user.standardRating}|${this.user.standardWins}|${this.user.standardLosses}|${this.user.standardDraws}|${this.user.fantasyRating}|${this.user.fantasyWins}|${this.user.fantasyLosses}|${this.user.fantasyDraws}`;
        let isValid = await security.verify(newCanonical, this.user.sig);
        if (isValid) return {
          ok: true
        };

        const legacyCanonical = `${this.user.id}|${this.user.rating}|${this.user.wins}|${this.user.losses}|${this.user.draws}`;
        isValid = await security.verify(legacyCanonical, this.user.sig);
        if (isValid) {
          this.user.standardRating = this.user.rating || 1200;
          this.user.standardWins = this.user.wins || 0;
          this.user.standardLosses = this.user.losses || 0;
          this.user.standardDraws = this.user.draws || 0;
          this.user.fantasyRating = this.user.fantasyRating || 1200;
          this.user.fantasyWins = 0;
          this.user.fantasyLosses = 0;
          this.user.fantasyDraws = 0;
          this.user.sig = await security.sign(newCanonical);
          await dbManager.put('settings', this.user, 'userProfile');
          return {
            ok: true,
            migrated: true
          };
        }
        return {
          ok: false
        };
      }
