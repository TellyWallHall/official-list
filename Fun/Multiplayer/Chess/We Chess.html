      }

      appendInGameChat(isMe, name, text) {
        const log = document.getElementById('gameChatLog');
        if (!log) return;
        const msg = document.createElement('div');
        msg.style.padding = '2px 6px';
        msg.style.borderRadius = '4px';
        msg.style.background = isMe ? 'rgba(6, 182, 212, 0.15)' : 'var(--bg-card)';
        msg.innerHTML = `<b>${this.escapeHtml(name)}:</b> ${this.escapeHtml(text)}`;
        log.appendChild(msg);
        log.scrollTop = log.scrollHeight;
      }

      updateMaterialTrays() {
        const myTray = document.getElementById('myTray');
        const oppTray = document.getElementById('oppTray');
        if (!myTray || !oppTray || !this.activeGame) return;

        const info = this.activeGame.engine.getMaterialDiff();
        const isWhite = this.activeGame.myColor === 'w';

        const myCaptures = isWhite ? info.blackCaptured : info.whiteCaptured;
        const oppCaptures = isWhite ? info.whiteCaptured : info.blackCaptured;

        const renderPieces = (tray, pieces, lead) => {
          let html = '';
          pieces.forEach(p => {
            const sym = p[1].toUpperCase();
            const faCls = { P: 'fa-chess-pawn', N: 'fa-chess-knight', B: 'fa-chess-bishop', R: 'fa-chess-rook', Q: 'fa-chess-queen' }[sym] || '';
            html += `<i class="fa-solid ${faCls}" style="font-size:10px;"></i>`;
          });
          if (lead > 0) {
            html += `<span class="mat-lead-badge">+${lead}</span>`;
          }
          tray.innerHTML = html;
        };

        const myLead = isWhite ? info.diff : -info.diff;
        const oppLead = isWhite ? -info.diff : info.diff;

        renderPieces(myTray, myCaptures, myLead > 0 ? myLead : 0);
        renderPieces(oppTray, oppCaptures, oppLead > 0 ? oppLead : 0);
      }

      renderBoard() {
        const boardEl = document.getElementById('chessBoard');
        if (!boardEl || !this.activeGame) return;
        boardEl.innerHTML = '';

        const isFlipped = this.boardFlipped;
        const engine = this.activeGame.engine;
        const lastMove = engine.moveHistory[engine.moveHistory.length - 1];
        const kingInCheckSq = engine.inCheck() ? engine.findKing(engine.turn) : -1;

        let legalDests = [];
        if (this.selectedSquare !== null) {
          legalDests = engine.getLegalMoves().filter(m => m.from === this.selectedSquare).map(m => m.to);
        }

        for (let row = 0; row < 8; row++) {
          for (let col = 0; col < 8; col++) {
            const actualRow = isFlipped ? 7 - row : row;
            const actualCol = isFlipped ? 7 - col : col;
            const sq = (actualRow << 4) | actualCol;
            const piece = engine.board[sq];
            const isLight = (actualRow + actualCol) % 2 === 0;

            const sqEl = document.createElement('div');
            sqEl.className = `square ${isLight ? 'light' : 'dark'}`;
            if (this.selectedSquare === sq) sqEl.classList.add('selected');
            if (this.premove && (this.premove.from === sq || this.premove.to === sq)) sqEl.classList.add('premove');
            if (lastMove && (lastMove.from === sq || lastMove.to === sq)) sqEl.classList.add('last-move');
            if (kingInCheckSq === sq) sqEl.classList.add('in-check');

            if ((!isFlipped && col === 0) || (isFlipped && col === 7)) {
              const rLabel = document.createElement('span');
              rLabel.className = 'sq-coord rank';
              rLabel.textContent = 8 - actualRow;
              sqEl.appendChild(rLabel);
            }
            if ((!isFlipped && row === 7) || (isFlipped && row === 0)) {
              const fLabel = document.createElement('span');
              fLabel.className = 'sq-coord file';
              fLabel.textContent = String.fromCharCode(97 + actualCol);
              sqEl.appendChild(fLabel);
            }

            if (legalDests.includes(sq)) {
              if (piece) {
                const ring = document.createElement('div');
                ring.className = 'dest-capture-ring';
                sqEl.appendChild(ring);
              } else {
                const dot = document.createElement('div');
                dot.className = 'dest-dot';
                sqEl.appendChild(dot);
              }
            }

            if (piece) {
              const pKey = (engine.getColor(piece) === 'w' ? 'w' : 'b') + PIECE_SYMBOLS[piece].toUpperCase();
              sqEl.innerHTML += PIECE_FA_MAP[pKey] || '';
            }

            sqEl.addEventListener('click', () => this.handleSquareClick(sq));
            boardEl.appendChild(sqEl);
          }
        }

        const myHud = document.getElementById('myHud');
        const oppHud = document.getElementById('oppHud');
        if (myHud && oppHud) {
          const isMyTurn = engine.turn === this.activeGame.myColor;
          myHud.classList.toggle('active-turn', isMyTurn);
          oppHud.classList.toggle('active-turn', !isMyTurn);
        }
      }

      handleSquareClick(sq) {
        if (!this.activeGame || this.activeGame.isOver) return;
        const engine = this.activeGame.engine;
        const isMyTurn = engine.turn === this.activeGame.myColor;

        const piece = engine.board[sq];
        const pieceColor = engine.getColor(piece);

        if (!isMyTurn) {
          if (this.selectedSquare === null) {
            if (piece && pieceColor === this.activeGame.myColor) {
              this.selectedSquare = sq;
              this.renderBoard();
            }
          } else {
            if (sq === this.selectedSquare) {
              this.selectedSquare = null;
              this.premove = null;
            } else {
              this.premove = { from: this.selectedSquare, to: sq };
              this.selectedSquare = null;
            }
            this.renderBoard();
          }
          return;
        }

        if (this.selectedSquare === null) {
          if (piece && pieceColor === this.activeGame.myColor) {
            this.selectedSquare = sq;
            this.renderBoard();
          }
          return;
        }

        if (this.selectedSquare === sq) {
          this.selectedSquare = null;
          this.renderBoard();
          return;
        }

        if (piece && pieceColor === this.activeGame.myColor) {
          this.selectedSquare = sq;
          this.renderBoard();
          return;
        }

        const from = this.selectedSquare;
        const fromPiece = engine.board[from];
        const isPromo = engine.getType(fromPiece) === 1 && ((sq >> 4) === 0 || (sq >> 4) === 7);

        if (isPromo && engine.isLegalMove(from, sq, this.activeGame.myColor === 'w' ? W_QUEEN : B_QUEEN)) {
          this.showPromotionDialog((chosenPromo) => {
            this.executeLocalMove(from, sq, chosenPromo);
          });
        } else {
          this.executeLocalMove(from, sq, null);
        }
      }

      async executeLocalMove(from, to, promo) {
        const engine = this.activeGame.engine;
        const moveRecord = engine.execute(from, to, promo);

        if (moveRecord) {
          this.selectedSquare = null;
          this.premove = null;
          sound.playMove();
          if (moveRecord.captured) sound.playCapture();
          if (engine.inCheck()) sound.playCheck();

          if (this.activeGame.myColor === 'w') this.activeGame.whiteTime += this.activeGame.increment;
          else this.activeGame.blackTime += this.activeGame.increment;

          if (!this.activeGame.isBot) {
            const sig = await security.sign(`${this.activeGame.id}|${engine.moveHistory.length}|${from}|${to}`);
            net.sendMove(
              this.activeGame.id, 
              { from, to, promotion: promo, sender: this.user.id, _sig: sig },
              engine.turn
            );
          }

          this.handleMoveExecuted(moveRecord, true);

          if (this.activeGame.isBot && !this.activeGame.isOver) {
            setTimeout(() => this.triggerBotMove(), 400);
          }
        } else {
          this.selectedSquare = null;
          this.renderBoard();
        }
      }

      handleMoveExecuted(moveRecord, isLocal) {
        this.renderBoard();
        this.renderMoveList();
        this.updateMaterialTrays();

        const endState = this.activeGame.engine.isGameOver();
        if (endState.over) {
          this.endGame(endState.result, endState.reason);
          return;
        }

        if (!isLocal && this.premove && this.activeGame.engine.turn === this.activeGame.myColor) {
          const pm = this.premove;
          this.premove = null;
          if (this.activeGame.engine.isLegalMove(pm.from, pm.to)) {
            setTimeout(() => this.executeLocalMove(pm.from, pm.to, null), 40);
          }
        }
      }

      triggerBotMove() {
        if (!this.activeGame || this.activeGame.isOver) return;
        const legals = this.activeGame.engine.getLegalMoves();
        if (legals.length === 0) return;

        let picked = legals[Math.floor(Math.random() * legals.length)];
        const caps = legals.filter(m => m.captured);
        if (caps.length && Math.random() < 0.7) picked = caps[Math.floor(Math.random() * caps.length)];

        const moveRecord = this.activeGame.engine.execute(picked.from, picked.to, picked.promotion);
        if (moveRecord) {
          sound.playMove();
          if (moveRecord.captured) sound.playCapture();
          if (this.activeGame.engine.inCheck()) sound.playCheck();
          this.handleMoveExecuted(moveRecord, false);
        }
      }

      startClocks() {
        if (this.gameClock) clearInterval(this.gameClock);
        if (this.activeGame.timeControl === 'none') return;

        this.gameClock = setInterval(() => {
          if (!this.activeGame || this.activeGame.isOver) {
            clearInterval(this.gameClock);
            return;
          }
          if (this.activeGame.engine.turn === 'w') {
            this.activeGame.whiteTime = Math.max(0, this.activeGame.whiteTime - 1);
            if (this.activeGame.whiteTime === 0) this.endGame('0-1', 'timeout');
          } else {
            this.activeGame.blackTime = Math.max(0, this.activeGame.blackTime - 1);
            if (this.activeGame.blackTime === 0) this.endGame('1-0', 'timeout');
          }
          this.updateClockDisplays();
        }, 1000);
      }

      formatTime(seconds) {
        if (seconds <= 0) return '00:00';
        const m = Math.floor(seconds / 60);
        const s = seconds % 60;
        return `${m.toString().padStart(2, '0')}:${s.toString().padStart(2, '0')}`;
      }

      updateClockDisplays() {
        const myClockEl = document.getElementById('myClock');
        const oppClockEl = document.getElementById('oppClock');
        if (!myClockEl || !oppClockEl || !this.activeGame) return;

        if (this.activeGame.timeControl === 'none') {
          myClockEl.textContent = '∞';
          oppClockEl.textContent = '∞';
          return;
        }

        const myTime = this.activeGame.myColor === 'w' ? this.activeGame.whiteTime : this.activeGame.blackTime;
        const oppTime = this.activeGame.myColor === 'w' ? this.activeGame.blackTime : this.activeGame.whiteTime;

        myClockEl.textContent = this.formatTime(myTime);
        oppClockEl.textContent = this.formatTime(oppTime);
        myClockEl.classList.toggle('low-time', myTime < 30);
        oppClockEl.classList.toggle('low-time', oppTime < 30);
      }

      renderMoveList() {
        const container = document.getElementById('movesContainer');
        if (!container || !this.activeGame) return;
        const moves = this.activeGame.engine.moveHistory;
        let html = '';
        for (let i = 0; i < moves.length; i += 2) {
          html += `<span style="color:var(--text-dim);">${Math.floor(i / 2) + 1}.</span>`;
          html += `<span class="move-token">${moves[i].san}</span>`;
          if (moves[i + 1]) html += `<span class="move-token">${moves[i + 1].san}</span>`;
          html += ' ';
        }
        container.innerHTML = html;
        container.scrollTop = container.scrollHeight;
      }

      async endGame(result, reason) {
        if (!this.activeGame || this.activeGame.isOver) return;
        this.activeGame.isOver = true;
        if (this.gameClock) clearInterval(this.gameClock);
        if (this.activeGameDetach) {
          this.activeGameDetach();
          this.activeGameDetach = null;
        }
        sound.playGameOver();

        const myColor = this.activeGame.myColor;
        const won = (result === '1-0' && myColor === 'w') || (result === '0-1' && myColor === 'b');
        const draw = result === '1/2-1/2';
        const isRated = this.activeGame.rated && !this.activeGame.isBot;

        let ratingDiff = 0;
        let newRating = this.user.rating;

        if (isRated) {
          const elo = calculateElo(this.user.rating, this.activeGame.opponentRating, draw);
          const oldRating = this.user.rating;
          newRating = won ? elo.winner : (draw ? elo.winner : elo.loser);
          ratingDiff = newRating - oldRating;

          this.user.rating = newRating;
          if (won) this.user.wins++;
          else if (draw) this.user.draws++;
          else this.user.losses++;

          this.user.sig = await security.sign(`${this.user.id}|${this.user.rating}|${this.user.wins}|${this.user.losses}|${this.user.draws}`);
          await dbManager.put('settings', this.user, 'userProfile');
          net.syncLeaderboard(this.user);
          this.updateTopBar();
        }

        if (!this.activeGame.isBot) {
          net.finalizeGame(
            this.activeGame.id, 
            myColor === 'w' ? this.user.id : this.activeGame.opponentId,
            myColor === 'b' ? this.user.id : this.activeGame.opponentId,
            result, 
            reason
          );
        }

        const archivedGame = {
          gameId: this.activeGame.id,
          white: { name: myColor === 'w' ? this.user.name : this.activeGame.opponentName, rating: this.activeGame.opponentRating },
          black: { name: myColor === 'b' ? this.user.name : this.activeGame.opponentName, rating: this.activeGame.opponentRating },
          myColor: myColor,
          moves: this.activeGame.engine.moveHistory,
          result: result,
          resultReason: reason,
          timeControl: this.activeGame.timeControl,
          rated: isRated,
          isBot: this.activeGame.isBot,
          opponentRating: this.activeGame.opponentRating,
          date: new Date().toISOString()
        };
        await dbManager.put('games', archivedGame);

        this.showModal(`
          <div style="text-align:center;">
            <div style="font-size: 36px; margin-bottom: 6px;">${won ? '🏆' : (draw ? '🤝' : '⚔️')}</div>
            <h2 style="font-size: 18px; font-weight: 800;">${won ? 'Victory!' : (draw ? 'Drawn Game' : 'Defeat')}</h2>
            <p style="font-size: 12px; color: var(--text-muted); margin-top: 3px;">${reason} (${result})</p>

            <div style="background:var(--bg-surface); padding:10px; border-radius:var(--radius-md); margin:14px 0;">
              ${isRated ? `
                <div style="font-size:11px; color:var(--text-muted);">New Elo Rating</div>
                <div style="font-size:22px; font-weight:800; color:var(--accent-amber); font-family:var(--font-mono);">
                  ${newRating} <span style="font-size:13px; color:${ratingDiff >= 0 ? 'var(--accent-emerald)' : 'var(--accent-rose)'};">${ratingDiff >= 0 ? '+' : ''}${ratingDiff}</span>
                </div>
              ` : `
                <div style="font-size:12px; color:var(--text-muted); font-weight:600;">
                  <i class="fa-solid fa-mug-hot"></i> Unrated / Casual (Elo unchanged)
                </div>
              `}
            </div>
            <button class="btn btn-primary btn-full" id="btnModalClose">Return to Lobby</button>
          </div>
        `, (modal) => {
          modal.querySelector('#btnModalClose').addEventListener('click', () => {
            this.closeModal();
            this.navigateTo('home');
          });
        });
      }

      showPromotionDialog(callback) {
        const isWhite = this.activeGame.myColor === 'w';
        const opts = [
          { type: isWhite ? W_QUEEN : B_QUEEN, key: isWhite ? 'wQ' : 'bQ' },
          { type: isWhite ? W_ROOK : B_ROOK, key: isWhite ? 'wR' : 'bR' },
          { type: isWhite ? W_BISHOP : B_BISHOP, key: isWhite ? 'wB' : 'bB' },
          { type: isWhite ? W_KNIGHT : B_KNIGHT, key: isWhite ? 'wN' : 'bN' }
        ];

        let promoHtml = '<div class="promo-dialog">';
        for (let opt of opts) promoHtml += `<div class="promo-opt" data-piece="${opt.type}">${PIECE_FA_MAP[opt.key]}</div>`;
        promoHtml += '</div>';

        this.showModal(`
          <div style="text-align:center;">
            <h3 style="font-size:15px; font-weight:700;">Promote Pawn</h3>
            ${promoHtml}
          </div>
        `, (modal) => {
          modal.querySelectorAll('.promo-opt').forEach(optEl => {
            optEl.addEventListener('click', () => {
              const pieceType = parseInt(optEl.getAttribute('data-piece'), 10);
              this.closeModal();
              callback(pieceType);
            });
          });
        });
      }

      showDrawOfferDialog() {
        this.showModal(`
          <div style="text-align:center;">
            <div style="font-size:30px; margin-bottom:6px;">🤝</div>
            <h3 style="font-size:15px; font-weight:700;">Draw Offered</h3>
            <p style="font-size:12px; color:var(--text-muted); margin:6px 0 14px;">Opponent has offered a draw.</p>
            <div style="display:flex; gap:8px;">
              <button class="btn btn-primary" id="btnAcceptDraw" style="flex:1;">Accept</button>
              <button class="btn" id="btnDeclineDraw" style="flex:1;">Decline</button>
            </div>
          </div>
        `, (modal) => {
          modal.querySelector('#btnAcceptDraw').addEventListener('click', () => {
            this.closeModal();
            net.sendStateEvent(this.activeGame.id, { action: 'draw-accept', sender: this.user.id });
            this.endGame('1/2-1/2', 'agreement');
          });
          modal.querySelector('#btnDeclineDraw').addEventListener('click', () => this.closeModal());
        });
      }

      /* ========================================================================
         ARCHIVE & REPLAY VIEWER
         ======================================================================== */
      async renderArchiveScreen(container) {
        const games = await dbManager.getAll('games');
        games.sort((a, b) => new Date(b.date) - new Date(a.date));

        container.innerHTML = `
          <h3 style="font-size:17px; font-weight:800; margin-bottom:10px;">Archived Games</h3>
          <div id="archiveList" style="display:flex; flex-direction:column; gap:6px;"></div>
        `;

        const listEl = container.querySelector('#archiveList');
        if (games.length === 0) {
          listEl.innerHTML = `<div class="card" style="text-align:center; color:var(--text-muted);"><p>No games saved yet.</p></div>`;
        } else {
          games.forEach(g => {
            const isWhite = g.myColor === 'w';
            const opponent = isWhite ? g.black : g.white;
            const won = (g.result === '1-0' && isWhite) || (g.result === '0-1' && !isWhite);
            const draw = g.result === '1/2-1/2';
            const badgeColor = won ? 'var(--accent-emerald)' : (draw ? 'var(--accent-amber)' : 'var(--accent-rose)');

            const item = document.createElement('div');
            item.className = 'card';
            item.style.padding = '8px 12px';
            item.style.cursor = 'pointer';
            item.style.display = 'flex';
            item.style.alignItems = 'center';
            item.style.justifyContent = 'space-between';
            item.innerHTML = `
              <div>
                <div style="font-size:13px; font-weight:700;">vs ${opponent.name} (${opponent.rating || 1200})</div>
                <div style="font-size:11px; color:var(--text-muted); margin-top:2px;">
                  ${new Date(g.date).toLocaleDateString()} • ${g.moves.length} moves • ${g.rated ? 'Rated' : 'Casual'}
                </div>
              </div>
              <span style="font-size:13px; font-weight:800; font-family:var(--font-mono); color:${badgeColor};">${g.result}</span>
            `;
            item.addEventListener('click', () => this.openGameInViewer(g));
            listEl.appendChild(item);
          });
        }
      }

      openGameInViewer(gameData) {
        this.viewerGame = gameData;
        this.viewerMoveIdx = -1;
        this.navigateTo('viewer');
      }

      renderViewerScreen(container) {
        if (!this.viewerGame) {
          container.innerHTML = `<div class="card"><p>No game selected.</p></div>`;
          return;
        }

        const g = this.viewerGame;
        container.innerHTML = `
          <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:8px;">
            <div>
              <div style="font-size:13px; font-weight:700;">${g.white.name} vs ${g.black.name}</div>
              <div style="font-size:11px; color:var(--text-muted);">${g.result} (${g.resultReason})</div>
            </div>
            <button class="btn btn-sm" id="btnExitViewer">Close</button>
          </div>

          <div class="board-wrapper">
            <div class="board-grid" id="viewerBoard"></div>
          </div>

          <div style="display:flex; justify-content:space-between; gap:6px; margin:8px 0;">
            <button class="btn btn-sm" id="btnStepStart">|◀</button>
            <button class="btn btn-sm" id="btnStepPrev">◀ Back</button>
            <button class="btn btn-sm" id="btnStepNext">Next ▶</button>
            <button class="btn btn-sm" id="btnStepEnd">▶|</button>
          </div>

          <div class="moves-scroll-box" id="viewerMoves"></div>
        `;

        this.renderViewerBoard();
        this.renderViewerMoves();

        container.querySelector('#btnExitViewer').addEventListener('click', () => this.navigateTo('archive'));
        container.querySelector('#btnStepStart').addEventListener('click', () => { this.viewerMoveIdx = -1; this.renderViewerBoard(); this.renderViewerMoves(); });
        container.querySelector('#btnStepPrev').addEventListener('click', () => { if (this.viewerMoveIdx >= 0) { this.viewerMoveIdx--; this.renderViewerBoard(); this.renderViewerMoves(); } });
        container.querySelector('#btnStepNext').addEventListener('click', () => { if (this.viewerMoveIdx < this.viewerGame.moves.length - 1) { this.viewerMoveIdx++; this.renderViewerBoard(); this.renderViewerMoves(); } });
        container.querySelector('#btnStepEnd').addEventListener('click', () => { this.viewerMoveIdx = this.viewerGame.moves.length - 1; this.renderViewerBoard(); this.renderViewerMoves(); });
      }

      renderViewerBoard() {
        const boardEl = document.getElementById('viewerBoard');
        if (!boardEl || !this.viewerGame) return;
        boardEl.innerHTML = '';

        const engine = new ChessGame();
        for (let i = 0; i <= this.viewerMoveIdx; i++) {
          const m = this.viewerGame.moves[i];
          engine.execute(m.from, m.to, m.promotion);
        }

        const lastMove = engine.moveHistory[engine.moveHistory.length - 1];

        for (let row = 0; row < 8; row++) {
          for (let col = 0; col < 8; col++) {
            const sq = (row << 4) | col;
            const piece = engine.board[sq];
            const isLight = (row + col) % 2 === 0;

            const sqEl = document.createElement('div');
            sqEl.className = `square ${isLight ? 'light' : 'dark'}`;
            if (lastMove && (lastMove.from === sq || lastMove.to === sq)) sqEl.classList.add('last-move');

            if (piece) {
              const pKey = (engine.getColor(piece) === 'w' ? 'w' : 'b') + PIECE_SYMBOLS[piece].toUpperCase();
              sqEl.innerHTML += PIECE_FA_MAP[pKey] || '';
            }
            boardEl.appendChild(sqEl);
          }
        }
      }

      renderViewerMoves() {
        const container = document.getElementById('viewerMoves');
        if (!container || !this.viewerGame) return;
        const moves = this.viewerGame.moves;
        let html = '';
        for (let i = 0; i < moves.length; i += 2) {
          const wActive = this.viewerMoveIdx === i ? 'active' : '';
          const bActive = this.viewerMoveIdx === i + 1 ? 'active' : '';
          html += `<span style="color:var(--text-dim);">${Math.floor(i / 2) + 1}.</span>`;
          html += `<span class="move-token ${wActive}">${moves[i].san}</span>`;
          if (moves[i + 1]) html += `<span class="move-token ${bActive}">${moves[i + 1].san}</span>`;
          html += ' ';
        }
        container.innerHTML = html;
      }

      /* ========================================================================
         PROFILE SCREEN
         ======================================================================== */
      async renderProfileScreen(container) {
        const isVerified = await security.verify(
          `${this.user.id}|${this.user.rating}|${this.user.wins}|${this.user.losses}|${this.user.draws}`,
          this.user.sig
        );

        container.innerHTML = `
          <div class="card" style="background: ${this.user.cardBg || 'linear-gradient(135deg, #1e293b, #0f172a)'}; text-align:center;">
            <div class="avatar-badge" style="width:54px; height:54px; font-size:24px; margin:0 auto 8px;">
              ${this.getAvatarHtml(this.user, 54)}
            </div>
            <h2 style="font-size:17px; font-weight:800;">${this.user.name}</h2>
            <div style="margin-top:3px; display:flex; justify-content:center;">
              <span class="badge-flair">${this.user.title || 'Tactician'}</span>
            </div>
            <p style="font-size:11px; color:var(--text-muted); margin-top:6px; font-style:italic;">
              "${this.user.bio || 'Ready for chess.'}"
            </p>
            <div style="margin-top:8px;">
              <span class="badge-sig">${isVerified ? '✓ Device Key Verified' : '⚠ Tamper Check Mismatch'}</span>
            </div>
          </div>

          <div style="display:grid; grid-template-columns:repeat(3, 1fr); gap:6px; margin-bottom:12px;">
            <div class="card" style="text-align:center; padding:10px 4px;">
              <div style="font-size:10px; color:var(--text-muted);">Elo Rating</div>
              <div style="font-size:16px; font-weight:800; color:var(--accent-amber); font-family:var(--font-mono);">${this.user.rating}</div>
            </div>
            <div class="card" style="text-align:center; padding:10px 4px;">
              <div style="font-size:10px; color:var(--text-muted);">Rated Wins</div>
              <div style="font-size:16px; font-weight:800; color:var(--accent-emerald); font-family:var(--font-mono);">${this.user.wins}</div>
            </div>
            <div class="card" style="text-align:center; padding:10px 4px;">
              <div style="font-size:10px; color:var(--text-muted);">Rated Losses</div>
              <div style="font-size:16px; font-weight:800; color:var(--accent-rose); font-family:var(--font-mono);">${this.user.losses}</div>
            </div>
          </div>

          <button class="btn btn-full btn-cyan" id="btnOpenThemeSettings" style="margin-bottom:8px;">
            <i class="fa-solid fa-gear"></i> Settings & Customizer Studio
          </button>
        `;

        container.querySelector('#btnOpenThemeSettings').addEventListener('click', () => this.showSettingsModal());
      }

      /* ========================================================================
         UNIFIED SETTINGS, AVATAR PICKER & RESET MODAL
         ======================================================================== */
      showSettingsModal() {
        const presets = [
          { name: 'Cyberpunk', val: 'linear-gradient(135deg, #f72585, #7209b7, #3a0ca3)' },
          { name: 'Sunset Neon', val: 'linear-gradient(135deg, #ff7b00, #ff007f, #7928ca)' },
          { name: 'Emerald Forest', val: 'linear-gradient(135deg, #0f5132, #198754, #20c997)' },
          { name: 'Oceanic Wave', val: 'linear-gradient(135deg, #03045e, #0077b6, #00b4d8)' },
          { name: 'Midnight Amethyst', val: 'linear-gradient(135deg, #240046, #3c096c, #5a189a)' },
          { name: 'Blood Moon', val: 'linear-gradient(135deg, #370617, #6a040f, #9d0208)' },
          { name: 'Clean Dark', val: 'linear-gradient(135deg, #1e293b, #0f172a)' }
        ];

        const avatarIcons = [
          'fa-solid fa-chess-knight',
          'fa-solid fa-chess-king',
          'fa-solid fa-crown',
          'fa-solid fa-dragon',
          'fa-solid fa-skull',
          'fa-solid fa-fire',
          'fa-solid fa-ghost',
          'fa-solid fa-robot',
          'fa-solid fa-user-ninja',
          'fa-solid fa-shield-halved',
          'fa-solid fa-cat',
          'fa-solid fa-bolt'
        ];

        let presetHtml = '<div class="color-swatch-row">';
        presets.forEach(p => {
          presetHtml += `<div class="color-swatch-btn" style="background:${p.val};" data-val="${p.val}" title="${p.name}"></div>`;
        });
        presetHtml += '</div>';

        const currentAvatar = (this.user && typeof this.user.avatar === 'string') 
          ? this.user.avatar 
          : 'fa-solid fa-chess-knight';
          
        const isHttpAvatar = currentAvatar.startsWith('http://') || currentAvatar.startsWith('https://') || currentAvatar.startsWith('data:image');

        let avatarGridHtml = '<div class="avatar-grid">';
        avatarIcons.forEach(ico => {
          const isActive = currentAvatar === ico;
          avatarGridHtml += `<button type="button" class="avatar-opt-btn ${isActive ? 'active' : ''}" data-icon="${ico}"><i class="${ico}"></i></button>`;
        });
        avatarGridHtml += '</div>';

        this.showModal(`
          <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:12px;">
            <h3 style="font-size:15px; font-weight:700;"><i class="fa-solid fa-gear"></i> Settings & Customizer</h3>
            <button class="btn-icon" id="btnCloseModal" title="Close"><i class="fa-solid fa-xmark"></i></button>
          </div>

          <div style="display:flex; flex-direction:column; gap:12px;">
            <!-- SECTION 1: IDENTITY & AVATAR -->
            <div class="settings-section-title"><i class="fa-solid fa-user"></i> Player Identity & Avatar</div>
            
            <div>
              <label style="font-size:11px; color:var(--text-muted); font-weight:600;">Choose Avatar Icon</label>
              ${avatarGridHtml}
            </div>

            <div>
              <label style="font-size:11px; color:var(--text-muted); font-weight:600;">Or Custom Image URL</label>
              <input type="text" class="input-field" id="custAvatarUrl" value="${isHttpAvatar ? this.escapeHtml(currentAvatar) : ''}" placeholder="https://example.com/avatar.png" style="margin-top:3px; font-size:11px;" />
            </div>

            <div>
              <label style="font-size:11px; color:var(--text-muted); font-weight:600;">Nickname</label>
              <input type="text" class="input-field" id="cfgUsername" value="${this.escapeHtml(this.user.name)}" style="margin-top:3px;" maxlength="20" />
            </div>

            <div style="display:grid; grid-template-columns:1fr 1fr; gap:8px;">
              <div>
                <label style="font-size:11px; color:var(--text-muted); font-weight:600;">Title Flair</label>
                <select class="input-field" id="custTitle" style="margin-top:3px;">
                  <option value="Grandmaster" ${this.user.title === 'Grandmaster' ? 'selected' : ''}>👑 Grandmaster</option>
                  <option value="Blitz Demon" ${this.user.title === 'Blitz Demon' ? 'selected' : ''}>⚡ Blitz Demon</option>
                  <option value="Tactician" ${this.user.title === 'Tactician' ? 'selected' : ''}>🎯 Tactician</option>
                  <option value="Pawn Stormer" ${this.user.title === 'Pawn Stormer' ? 'selected' : ''}>🛡️ Pawn Stormer</option>
                  <option value="Coffeehouse Hustler" ${this.user.title === 'Coffeehouse Hustler' ? 'selected' : ''}>☕ Hustler</option>
                  <option value="Member" ${this.user.title === 'Member' ? 'selected' : ''}>♟️ Member</option>
                </select>
              </div>
              <div>
                <label style="font-size:11px; color:var(--text-muted); font-weight:600;">Sound Pack</label>
                <select class="input-field" id="custSoundPack" style="margin-top:3px;">
                  <option value="classic" ${sound.soundPack === 'classic' ? 'selected' : ''}>Classic Wood</option>
                  <option value="arcade" ${sound.soundPack === 'arcade' ? 'selected' : ''}>8-Bit Arcade</option>
                  <option value="scifi" ${sound.soundPack === 'scifi' ? 'selected' : ''}>Sci-Fi Holo</option>
                  <option value="silent" ${sound.soundPack === 'silent' ? 'selected' : ''}>Silent</option>
                </select>
              </div>
            </div>

            <div>
              <label style="font-size:11px; color:var(--text-muted); font-weight:600;">Personal Bio / Motto</label>
              <input type="text" class="input-field" id="custBio" value="${this.escapeHtml(this.user.bio || '')}" placeholder="Quote..." maxlength="60" style="margin-top:3px;" />
            </div>

            <!-- SECTION 2: THEME & BOARD -->
            <div class="settings-section-title"><i class="fa-solid fa-palette"></i> Board & Gradients</div>
            <div>
              <label style="font-size:11px; color:var(--text-muted); font-weight:600;">Preset Gradients</label>
              ${presetHtml}
            </div>

            <div>
              <label style="font-size:11px; color:var(--text-muted); font-weight:600;">Custom Background (Gradient / Hex)</label>
              <input type="text" class="input-field" id="custCardBg" value="${this.escapeHtml(this.user.cardBg || '')}" placeholder="linear-gradient(...)" style="margin-top:3px; font-family:var(--font-mono); font-size:11px;" />
            </div>

            <div style="display:grid; grid-template-columns:1fr 1fr; gap:8px;">
              <div>
                <label style="font-size:11px; color:var(--text-muted); font-weight:600;">Light Square</label>
                <input type="color" id="custLightSq" value="${this.customBoardTheme.light}" style="width:100%; height:34px; border:none; background:none; cursor:pointer;" />
              </div>
              <div>
                <label style="font-size:11px; color:var(--text-muted); font-weight:600;">Dark Square</label>
                <input type="color" id="custDarkSq" value="${this.customBoardTheme.dark}" style="width:100%; height:34px; border:none; background:none; cursor:pointer;" />
              </div>
            </div>

            <!-- SECTION 3: CLOUD & ACCOUNT RESET -->
            <div class="settings-section-title" style="color:var(--accent-rose);"><i class="fa-solid fa-triangle-exclamation"></i> Danger Zone</div>
            <div style="display:flex; gap:6px;">
              <button class="btn btn-sm" id="btnPruneFromSettings" style="flex:1;"><i class="fa-solid fa-broom"></i> Prune Ghost Matches</button>
              <button class="btn btn-sm btn-danger" id="btnResetAccountSettings" style="flex:1;"><i class="fa-solid fa-rotate-left"></i> Reset Account</button>
            </div>

            <button class="btn btn-primary btn-full" id="btnSaveAllSettings" style="margin-top:8px;">
              <i class="fa-solid fa-check"></i> Save & Apply
            </button>
          </div>
        `, (modal) => {
          modal.querySelector('#btnCloseModal').addEventListener('click', () => this.closeModal());

          let selectedAvatar = currentAvatar;

          modal.querySelectorAll('.avatar-opt-btn').forEach(btn => {
            btn.addEventListener('click', () => {
              modal.querySelectorAll('.avatar-opt-btn').forEach(b => b.classList.remove('active'));
              btn.classList.add('active');
              selectedAvatar = btn.getAttribute('data-icon');
              modal.querySelector('#custAvatarUrl').value = '';
            });
          });

          modal.querySelectorAll('.color-swatch-btn').forEach(btn => {
            btn.addEventListener('click', () => {
              modal.querySelector('#custCardBg').value = btn.getAttribute('data-val');
            });
          });

          modal.querySelector('#btnPruneFromSettings').addEventListener('click', () => {
            net.sweepStaleData();
            this.showToast('Cloud ghost matches pruned!');
          });

          modal.querySelector('#btnResetAccountSettings').addEventListener('click', async () => {
            if (confirm('Are you sure you want to completely reset your account? Your local match history and settings will be erased.')) {
              await dbManager.clearAll();
              window.location.reload();
            }
          });

          modal.querySelector('#btnSaveAllSettings').addEventListener('click', async () => {
            const newName = modal.querySelector('#cfgUsername').value.trim();
            const title = modal.querySelector('#custTitle').value;
            const bio = modal.querySelector('#custBio').value.trim();
            const cardBg = modal.querySelector('#custCardBg').value.trim() || 'linear-gradient(135deg, #1e293b, #0f172a)';
            const customUrl = modal.querySelector('#custAvatarUrl').value.trim();
            const light = modal.querySelector('#custLightSq').value;
            const dark = modal.querySelector('#custDarkSq').value;
            const sp = modal.querySelector('#custSoundPack').value;

            if (newName) this.user.name = newName;
            this.user.title = title;
            this.user.bio = bio;
            this.user.cardBg = cardBg;
            this.user.avatar = customUrl || selectedAvatar || 'fa-solid fa-chess-knight';

            this.customBoardTheme.light = light;
            this.customBoardTheme.dark = dark;
            sound.soundPack = sp;

            this.user.sig = await security.sign(`${this.user.id}|${this.user.rating}|${this.user.wins}|${this.user.losses}|${this.user.draws}`);
            const themeObj = { boardLight: light, boardDark: dark, appBg: cardBg };

            await dbManager.put('settings', this.user, 'userProfile');
            await dbManager.put('settings', themeObj, 'customTheme');
            await dbManager.put('settings', sp, 'soundPack');

            this.applyThemeStyles(themeObj);
            net.syncLeaderboard(this.user);
            this.updateTopBar();
            this.closeModal();
            this.showToast('Settings saved!');
            this.renderScreen();
          });
        });
      }

      showModal(innerHtml, onMount) {
        const host = document.getElementById('modalHost');
        host.innerHTML = `<div class="modal-overlay" id="genericModalOverlay"><div class="modal-sheet">${innerHtml}</div></div>`;
        
        host.querySelector('#genericModalOverlay').addEventListener('click', (e) => {
          if (e.target.id === 'genericModalOverlay') {
            this.closeModal();
          }
        });

        if (onMount) onMount(host);
      }

      closeModal() {
        document.getElementById('modalHost').innerHTML = '';
      }
    }

    window.addEventListener('DOMContentLoaded', () => {
      const app = new ChessApp();
      app.init();
    });
  </script>
</body>
</html>
