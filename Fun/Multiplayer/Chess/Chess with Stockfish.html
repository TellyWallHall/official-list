<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Mobile Stockfish Chess</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg-color: #161512;
            --surface-color: #262421;
            --text-color: #bababa;
            --text-light: #ffffff;
            --primary-color: #81b64c;
            --primary-hover: #98d15d;
            --board-light: #ebecd0;
            --board-dark: #739552;
            --highlight-move: rgba(255, 255, 51, 0.5);
            --highlight-select: rgba(20, 85, 30, 0.5);
            --danger: #cc3333;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            touch-action: manipulation;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            height: 100vh;
            overflow: hidden;
        }

        header {
            width: 100%;
            padding: 10px;
            background-color: var(--surface-color);
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-weight: bold;
            color: var(--text-light);
            box-shadow: 0 2px 5px rgba(0,0,0,0.5);
        }

        .main-container {
            flex: 1;
            width: 100%;
            max-width: 500px;
            display: flex;
            flex-direction: column;
            padding: 10px;
            gap: 10px;
            overflow-y: auto;
        }

        /* Evaluation Bar */
        .eval-container {
            height: 20px;
            width: 100%;
            background-color: #333;
            border-radius: 4px;
            overflow: hidden;
            display: flex;
            position: relative;
        }

        .eval-bar {
            height: 100%;
            background-color: #fff;
            width: 50%;
            transition: width 0.3s ease-in-out;
        }

        .eval-text {
            position: absolute;
            width: 100%;
            text-align: center;
            font-size: 12px;
            line-height: 20px;
            font-weight: bold;
            color: #888;
            mix-blend-mode: difference;
        }

        /* Chess Board */
        .board-wrapper {
            width: 100%;
            aspect-ratio: 1 / 1;
            position: relative;
        }

        .board {
            width: 100%;
            height: 100%;
            display: grid;
            grid-template-columns: repeat(8, 1fr);
            grid-template-rows: repeat(8, 1fr);
            border: 2px solid var(--surface-color);
            border-radius: 4px;
            overflow: hidden;
        }

        .square {
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 8vw;
            cursor: pointer;
            position: relative;
            user-select: none;
        }

        @media (min-width: 500px) {
            .square { font-size: 40px; }
        }

        .square.light { background-color: var(--board-light); color: #000; }
        .square.dark { background-color: var(--board-dark); color: #000; }
        .square.selected::after {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background-color: var(--highlight-select);
        }
        .square.valid-move::after {
            content: '';
            position: absolute;
            width: 30%;
            height: 30%;
            border-radius: 50%;
            background-color: rgba(0, 0, 0, 0.2);
        }
        .square.valid-capture::after {
            content: '';
            position: absolute;
            width: 100%;
            height: 100%;
            border: 4px solid rgba(0, 0, 0, 0.2);
            border-radius: 50%;
            background-color: transparent;
        }
        .square.last-move::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background-color: var(--highlight-move);
        }
        
        .piece {
            z-index: 2;
            text-shadow: 0 1px 2px rgba(0,0,0,0.5);
        }

        /* Controls */
        .controls {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            justify-content: space-between;
        }

        button, select {
            background-color: var(--surface-color);
            color: var(--text-light);
            border: none;
            padding: 12px;
            border-radius: 6px;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            flex: 1;
            text-align: center;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
        }

        button:active { background-color: #333; }
        button.primary { background-color: var(--primary-color); }
        button.primary:active { background-color: var(--primary-hover); }

        select {
            appearance: none;
            flex: 1.5;
        }

        /* Engine Output */
        .engine-output {
            background-color: var(--surface-color);
            border-radius: 6px;
            padding: 10px;
            font-family: monospace;
            font-size: 12px;
            height: 120px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .engine-line {
            display: flex;
            gap: 8px;
            border-bottom: 1px solid #333;
            padding-bottom: 4px;
        }

        .engine-score {
            color: var(--text-light);
            font-weight: bold;
            min-width: 45px;
        }

        .engine-moves {
            color: var(--text-color);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        /* Status */
        .status-box {
            text-align: center;
            font-size: 16px;
            font-weight: bold;
            color: var(--primary-color);
            padding: 5px;
        }
    </style>
</head>
<body>

    <header>
        <div><i class="fa-solid fa-chess-knight"></i> Mobile Stockfish</div>
        <div id="game-status">White to move</div>
    </header>

    <div class="main-container">
        <div class="eval-container">
            <div class="eval-bar" id="eval-bar"></div>
            <div class="eval-text" id="eval-text">0.00</div>
        </div>

        <div class="board-wrapper">
            <div class="board" id="board"></div>
        </div>

        <div class="status-box" id="endgame-status"></div>

        <div class="controls">
            <select id="mode-select">
                <option value="analysis">Analysis Mode</option>
                <option value="play-white">Play as White</option>
                <option value="play-black">Play as Black</option>
            </select>
            <select id="level-select">
                <option value="1">Level 1</option>
                <option value="5">Level 5</option>
                <option value="10" selected>Level 10</option>
                <option value="20">Level 20 (Max)</option>
            </select>
        </div>
        <div class="controls">
            <button onclick="resetGame()"><i class="fa-solid fa-rotate-left"></i> Reset</button>
            <button onclick="undoMove()"><i class="fa-solid fa-arrow-rotate-left"></i> Undo</button>
            <button class="primary" onclick="forceEngineMove()"><i class="fa-solid fa-robot"></i> Force Move</button>
        </div>

        <div class="engine-output" id="engine-output">
            <!-- Lines will populate here -->
        </div>
    </div>

    <script>
        // --- CHESS LOGIC ENGINE ---
        
        // Unicode pieces
        const PIECE_SYMBOLS = {
            'P': '♙', 'N': '♘', 'B': '♗', 'R': '♖', 'Q': '♕', 'K': '♔',
            'p': '♟', 'n': '♞', 'b': '♝', 'r': '♜', 'q': '♛', 'k': '♚'
        };

        const INITIAL_FEN = "rnbqkbnr/pppppppp/8/8/8/8/PPPPPPPP/RNBQKBNR w KQkq - 0 1";

        let board = new Array(64).fill(null);
        let turn = 'w'; // 'w' or 'b'
        let castling = { K: true, Q: true, k: true, q: true };
        let enPassant = null; // index of target square
        let halfMoves = 0;
        let fullMoves = 1;

        let moveHistory = [];
        let fenHistory = {};

        // UI State
        let selectedSquare = null;
        let legalMovesForSelected = [];
        let isEngineThinking = false;
        let gameIsOver = false;
        
        // Settings
        let playMode = 'analysis'; // analysis, play-white, play-black
        let engineLevel = 10;
        
        // DOM Elements
        const boardEl = document.getElementById('board');
        const evalBarEl = document.getElementById('eval-bar');
        const evalTextEl = document.getElementById('eval-text');
        const engineOutputEl = document.getElementById('engine-output');
        const statusEl = document.getElementById('game-status');
        const endgameStatusEl = document.getElementById('endgame-status');

        function indexToAlgebraic(index) {
            const file = String.fromCharCode(97 + (index % 8));
            const rank = 8 - Math.floor(index / 8);
            return file + rank;
        }

        function algebraicToIndex(alg) {
            if (!alg || alg === '-') return null;
            const file = alg.charCodeAt(0) - 97;
            const rank = 8 - parseInt(alg[1]);
            return rank * 8 + file;
        }

        function loadFEN(fen) {
            const parts = fen.split(' ');
            const ranks = parts[0].split('/');
            
            board = new Array(64).fill(null);
            let idx = 0;
            
            for (let i = 0; i < ranks.length; i++) {
                for (let j = 0; j < ranks[i].length; j++) {
                    const char = ranks[i][j];
                    if (isNaN(char)) {
                        board[idx++] = char;
                    } else {
                        idx += parseInt(char);
                    }
                }
            }
            
            turn = parts[1];
            
            castling = {
                K: parts[2].includes('K'),
                Q: parts[2].includes('Q'),
                k: parts[2].includes('k'),
                q: parts[2].includes('q')
            };
            
            enPassant = parts[3] !== '-' ? algebraicToIndex(parts[3]) : null;
            halfMoves = parseInt(parts[4]) || 0;
            fullMoves = parseInt(parts[5]) || 1;

            fenHistory = {};
            recordHistoryPos();
            
            selectedSquare = null;
            legalMovesForSelected = [];
            gameIsOver = false;
            endgameStatusEl.innerText = '';
            
            renderBoard();
            updateStatus();
            analyzePosition();
        }

        function generateFEN() {
            let fen = "";
            for (let r = 0; r < 8; r++) {
                let empty = 0;
                for (let c = 0; c < 8; c++) {
                    const piece = board[r * 8 + c];
                    if (piece) {
                        if (empty > 0) { fen += empty; empty = 0; }
                        fen += piece;
                    } else {
                        empty++;
                    }
                }
                if (empty > 0) fen += empty;
                if (r < 7) fen += "/";
            }
            
            fen += ` ${turn} `;
            
            let castleStr = "";
            if (castling.K) castleStr += "K";
            if (castling.Q) castleStr += "Q";
            if (castling.k) castleStr += "k";
            if (castling.q) castleStr += "q";
            fen += castleStr === "" ? "-" : castleStr;
            
            fen += ` ${enPassant !== null ? indexToAlgebraic(enPassant) : "-"} `;
            fen += `${halfMoves} ${fullMoves}`;
            
            return fen;
        }

        function recordHistoryPos() {
            const baseFen = generateFEN().split(' ').slice(0, 4).join(' ');
            fenHistory[baseFen] = (fenHistory[baseFen] || 0) + 1;
        }

        function getPieceColor(piece) {
            if (!piece) return null;
            return piece === piece.toUpperCase() ? 'w' : 'b';
        }

        // --- MOVE GENERATION ---
        
        const DIRECTIONS = {
            'N': [-17, -15, -10, -6, 6, 10, 15, 17],
            'B': [-9, -7, 7, 9],
            'R': [-8, -1, 1, 8],
            'Q': [-9, -8, -7, -1, 1, 7, 8, 9],
            'K': [-9, -8, -7, -1, 1, 7, 8, 9]
        };

        function isOutOfBounds(index) {
            return index < 0 || index > 63;
        }

        function getDistance(sq1, sq2) {
            const r1 = Math.floor(sq1 / 8), c1 = sq1 % 8;
            const r2 = Math.floor(sq2 / 8), c2 = sq2 % 8;
            return Math.max(Math.abs(r1 - r2), Math.abs(c1 - c2));
        }

        function getPseudoLegalMoves(sq, color, b = board) {
            const moves = [];
            const piece = b[sq];
            if (!piece || getPieceColor(piece) !== color) return moves;
            
            const type = piece.toUpperCase();
            
            if (type === 'P') {
                const dir = color === 'w' ? -8 : 8;
                const startRank = color === 'w' ? 6 : 1;
                
                // Forward 1
                if (!b[sq + dir]) {
                    moves.push({ from: sq, to: sq + dir });
                    // Forward 2
                    if (Math.floor(sq / 8) === startRank && !b[sq + dir * 2]) {
                        moves.push({ from: sq, to: sq + dir * 2 });
                    }
                }
                
                // Captures
                const caps = [dir - 1, dir + 1];
                for (let c of caps) {
                    const target = sq + c;
                    // Ensure capture doesn't wrap around board edges
                    if (!isOutOfBounds(target) && Math.abs((sq % 8) - (target % 8)) === 1) {
                        if (b[target] && getPieceColor(b[target]) !== color) {
                            moves.push({ from: sq, to: target });
                        } else if (target === enPassant) {
                            moves.push({ from: sq, to: target, ep: true });
                        }
                    }
                }
            } else if (type === 'N' || type === 'K') {
                for (let d of DIRECTIONS[type]) {
                    const target = sq + d;
                    if (!isOutOfBounds(target) && getDistance(sq, target) <= 2) {
                        if (!b[target] || getPieceColor(b[target]) !== color) {
                            moves.push({ from: sq, to: target });
                        }
                    }
                }
                
                // Castling
                if (type === 'K') {
                    if (color === 'w' && sq === 60) {
                        if (castling.K && !b[61] && !b[62] && !isSquareAttacked(60, 'b', b) && !isSquareAttacked(61, 'b', b) && !isSquareAttacked(62, 'b', b)) {
                            moves.push({ from: 60, to: 62, castle: 'K' });
                        }
                        if (castling.Q && !b[59] && !b[58] && !b[57] && !isSquareAttacked(60, 'b', b) && !isSquareAttacked(59, 'b', b) && !isSquareAttacked(58, 'b', b)) {
                            moves.push({ from: 60, to: 58, castle: 'Q' });
                        }
                    } else if (color === 'b' && sq === 4) {
                        if (castling.k && !b[5] && !b[6] && !isSquareAttacked(4, 'w', b) && !isSquareAttacked(5, 'w', b) && !isSquareAttacked(6, 'w', b)) {
                            moves.push({ from: 4, to: 6, castle: 'k' });
                        }
                        if (castling.q && !b[3] && !b[2] && !b[1] && !isSquareAttacked(4, 'w', b) && !isSquareAttacked(3, 'w', b) && !isSquareAttacked(2, 'w', b)) {
                            moves.push({ from: 4, to: 2, castle: 'q' });
                        }
                    }
                }
            } else {
                // Sliding pieces (B, R, Q)
                for (let d of DIRECTIONS[type]) {
                    let target = sq;
                    while (true) {
                        const next = target + d;
                        if (isOutOfBounds(next) || getDistance(target, next) > 1) break;
                        target = next;
                        if (!b[target]) {
                            moves.push({ from: sq, to: target });
                        } else {
                            if (getPieceColor(b[target]) !== color) {
                                moves.push({ from: sq, to: target });
                            }
                            break;
                        }
                    }
                }
            }
            return moves;
        }

        function isSquareAttacked(sq, attackerColor, b = board) {
            for (let i = 0; i < 64; i++) {
                const piece = b[i];
                if (piece && getPieceColor(piece) === attackerColor) {
                    const type = piece.toUpperCase();
                    if (type === 'P') {
                        const dir = attackerColor === 'w' ? -8 : 8;
                        const caps = [dir - 1, dir + 1];
                        for (let c of caps) {
                            const target = i + c;
                            if (target === sq && !isOutOfBounds(target) && Math.abs((i % 8) - (target % 8)) === 1) return true;
                        }
                    } else if (type === 'N' || type === 'K') {
                        for (let d of DIRECTIONS[type]) {
                            const target = i + d;
                            if (target === sq && !isOutOfBounds(target) && getDistance(i, target) <= 2) return true;
                        }
                    } else {
                        for (let d of DIRECTIONS[type]) {
                            let target = i;
                            while (true) {
                                const next = target + d;
                                if (isOutOfBounds(next) || getDistance(target, next) > 1) break;
                                target = next;
                                if (target === sq) return true;
                                if (b[target]) break;
                            }
                        }
                    }
                }
            }
            return false;
        }

        function getKingPos(color, b = board) {
            const king = color === 'w' ? 'K' : 'k';
            return b.indexOf(king);
        }

        function isCheck(color, b = board) {
            const kingPos = getKingPos(color, b);
            if (kingPos === -1) return false;
            return isSquareAttacked(kingPos, color === 'w' ? 'b' : 'w', b);
        }

        function makeMoveVirtual(move) {
            const b = [...board];
            const piece = b[move.from];
            b[move.to] = piece;
            b[move.from] = null;
            
            if (move.ep) {
                const epCapSq = move.to + (getPieceColor(piece) === 'w' ? 8 : -8);
                b[epCapSq] = null;
            }
            return b;
        }

        function getLegalMoves(color) {
            let legal = [];
            for (let i = 0; i < 64; i++) {
                const pseudo = getPseudoLegalMoves(i, color);
                for (let move of pseudo) {
                    const b = makeMoveVirtual(move);
                    if (!isCheck(color, b)) {
                        legal.push(move);
                    }
                }
            }
            return legal;
        }

        function makeMove(move) {
            // Save state for undo
            moveHistory.push({
                board: [...board],
                turn, castling: {...castling}, enPassant, halfMoves, fullMoves, fenHistory: {...fenHistory}
            });

            const piece = board[move.from];
            const type = piece.toUpperCase();
            const color = getPieceColor(piece);
            let captured = board[move.to];

            // Execute move
            board[move.to] = piece;
            board[move.from] = null;

            // En Passant capture
            if (move.ep) {
                const epCapSq = move.to + (color === 'w' ? 8 : -8);
                captured = board[epCapSq];
                board[epCapSq] = null;
            }

            // Castling
            if (move.castle) {
                if (move.castle === 'K') { board[61] = board[63]; board[63] = null; }
                if (move.castle === 'Q') { board[59] = board[56]; board[56] = null; }
                if (move.castle === 'k') { board[5] = board[7]; board[7] = null; }
                if (move.castle === 'q') { board[3] = board[0]; board[0] = null; }
            }

            // Promotion (Auto Queen for UI simplicity, standard in mobile fast play)
            if (move.promotion || (type === 'P' && (Math.floor(move.to / 8) === 0 || Math.floor(move.to / 8) === 7))) {
                board[move.to] = move.promotion ? move.promotion : (color === 'w' ? 'Q' : 'q');
            }

            // Update state
            if (type === 'P' || captured) {
                halfMoves = 0;
            } else {
                halfMoves++;
            }

            // En Passant setup
            if (type === 'P' && Math.abs(move.from - move.to) === 16) {
                enPassant = move.from + (color === 'w' ? -8 : 8);
            } else {
                enPassant = null;
            }

            // Castling rights update
            if (type === 'K') {
                if (color === 'w') { castling.K = false; castling.Q = false; }
                else { castling.k = false; castling.q = false; }
            }
            if (type === 'R') {
                if (move.from === 63) castling.K = false;
                if (move.from === 56) castling.Q = false;
                if (move.from === 7) castling.k = false;
                if (move.from === 0) castling.q = false;
            }
            if (move.to === 63) castling.K = false;
            if (move.to === 56) castling.Q = false;
            if (move.to === 7) castling.k = false;
            if (move.to === 0) castling.q = false;

            if (color === 'b') fullMoves++;
            turn = color === 'w' ? 'b' : 'w';

            recordHistoryPos();
            checkEndGame();
            renderBoard();
            
            // Mark last move for UI highlight
            document.querySelectorAll('.square').forEach(s => s.classList.remove('last-move'));
            document.getElementById(`sq-${move.from}`).classList.add('last-move');
            document.getElementById(`sq-${move.to}`).classList.add('last-move');

            analyzePosition();
            
            if (!gameIsOver && ((playMode === 'play-white' && turn === 'b') || (playMode === 'play-black' && turn === 'w'))) {
                requestEngineMove();
            }
        }

        function checkEndGame() {
            const moves = getLegalMoves(turn);
            const inCheck = isCheck(turn);
            
            if (moves.length === 0) {
                gameIsOver = true;
                if (inCheck) {
                    endgameStatusEl.innerText = `Checkmate! ${turn === 'w' ? 'Black' : 'White'} wins.`;
                } else {
                    endgameStatusEl.innerText = "Draw by Stalemate.";
                }
                return;
            }

            if (halfMoves >= 100) { // 50-move rule
                gameIsOver = true;
                endgameStatusEl.innerText = "Draw by 50-move rule.";
                return;
            }

            const baseFen = generateFEN().split(' ').slice(0, 4).join(' ');
            if (fenHistory[baseFen] >= 3) {
                gameIsOver = true;
                endgameStatusEl.innerText = "Draw by 3-fold repetition.";
                return;
            }
            
            // Insufficient material check
            const pieces = board.filter(p => p !== null);
            if (pieces.length === 2) {
                gameIsOver = true; endgameStatusEl.innerText = "Draw (Insufficient material)."; return;
            }
            // More complex checks can be added, but K v K, K v KB, K v KN is standard.
        }


        // --- UI & INTERACTION ---

        function renderBoard() {
            boardEl.innerHTML = '';
            const isFlipped = playMode === 'play-black';
            
            for (let i = 0; i < 64; i++) {
                const idx = isFlipped ? 63 - i : i;
                const square = document.createElement('div');
                const row = Math.floor(idx / 8);
                const col = idx % 8;
                const isLight = (row + col) % 2 === 0;
                
                square.className = `square ${isLight ? 'light' : 'dark'}`;
                square.id = `sq-${idx}`;
                
                const piece = board[idx];
                if (piece) {
                    const span = document.createElement('span');
                    span.className = 'piece';
                    span.innerText = PIECE_SYMBOLS[piece];
                    // Add color explicitly based on standard representations
                    span.style.color = piece === piece.toUpperCase() ? '#ffffff' : '#000000';
                    span.style.textShadow = piece === piece.toUpperCase() 
                        ? "0px 1px 3px rgba(0,0,0,0.8)" 
                        : "0px 1px 1px rgba(255,255,255,0.8)";
                    square.appendChild(span);
                }

                square.addEventListener('mousedown', (e) => handleSquareClick(idx, e));
                square.addEventListener('touchstart', (e) => handleSquareClick(idx, e), {passive: true});
                
                boardEl.appendChild(square);
            }
            updateStatus();
        }

        function handleSquareClick(idx, e) {
            if (e.type === 'touchstart') e.preventDefault(); // Prevent double fire
            if (gameIsOver) return;

            // Check if player's turn in play modes
            if (playMode === 'play-white' && turn !== 'w') return;
            if (playMode === 'play-black' && turn !== 'b') return;

            const piece = board[idx];
            const isSelectable = piece && getPieceColor(piece) === turn;

            if (selectedSquare !== null) {
                const move = legalMovesForSelected.find(m => m.to === idx);
                if (move) {
                    // Check for manual promotion to specific piece (if it's pawn to last rank)
                    if (board[selectedSquare].toUpperCase() === 'P' && (Math.floor(idx / 8) === 0 || Math.floor(idx / 8) === 7)) {
                        const promo = prompt("Promote to (Q, R, B, N)?", "Q");
                        if (promo) {
                            const p = promo.toUpperCase();
                            if (['Q', 'R', 'B', 'N'].includes(p)) {
                                move.promotion = turn === 'w' ? p : p.toLowerCase();
                            }
                        }
                    }
                    makeMove(move);
                    selectedSquare = null;
                    legalMovesForSelected = [];
                    clearHighlights();
                    return;
                }
            }

            clearHighlights();
            if (isSelectable) {
                selectedSquare = idx;
                document.getElementById(`sq-${idx}`).classList.add('selected');
                
                const allLegal = getLegalMoves(turn);
                legalMovesForSelected = allLegal.filter(m => m.from === idx);
                
                legalMovesForSelected.forEach(m => {
                    const el = document.getElementById(`sq-${m.to}`);
                    if (board[m.to] || m.ep) el.classList.add('valid-capture');
                    else el.classList.add('valid-move');
                });
            } else {
                selectedSquare = null;
                legalMovesForSelected = [];
            }
        }

        function clearHighlights() {
            document.querySelectorAll('.square').forEach(s => {
                s.classList.remove('selected', 'valid-move', 'valid-capture');
            });
        }

        function updateStatus() {
            statusEl.innerText = gameIsOver ? "Game Over" : `${turn === 'w' ? 'White' : 'Black'} to move`;
        }

        function resetGame() {
            loadFEN(INITIAL_FEN);
        }

        function undoMove() {
            if (moveHistory.length === 0) return;
            if (isEngineThinking) engine.postMessage('stop');
            
            // If playing vs computer, undo two moves
            if (playMode !== 'analysis' && moveHistory.length >= 2) {
                moveHistory.pop(); // computer move
                const state = moveHistory.pop(); // user move
                restoreState(state);
            } else {
                const state = moveHistory.pop();
                restoreState(state);
            }
        }

        function restoreState(state) {
            board = [...state.board];
            turn = state.turn;
            castling = {...state.castling};
            enPassant = state.enPassant;
            halfMoves = state.halfMoves;
            fullMoves = state.fullMoves;
            fenHistory = {...state.fenHistory};
            
            selectedSquare = null;
            legalMovesForSelected = [];
            gameIsOver = false;
            endgameStatusEl.innerText = '';
            
            renderBoard();
            analyzePosition();
        }

        document.getElementById('mode-select').addEventListener('change', (e) => {
            playMode = e.target.value;
            if (playMode === 'play-black') {
                renderBoard(); // Flip board
                if (turn === 'w' && !gameIsOver) requestEngineMove();
            } else if (playMode === 'play-white') {
                renderBoard();
                if (turn === 'b' && !gameIsOver) requestEngineMove();
            } else {
                renderBoard();
                analyzePosition();
            }
        });

        document.getElementById('level-select').addEventListener('change', (e) => {
            engineLevel = parseInt(e.target.value);
            engine.postMessage(`setoption name Skill Level value ${engineLevel}`);
        });


        // --- STOCKFISH INTEGRATION ---
        
        let engine;
        let currentPV = {};

        async function initStockfish() {
            try {
                // Using Blob worker to load stockfish from CDN
                const response = await fetch('https://cdn.jsdelivr.net/npm/stockfish.js@10.0.2/stockfish.js');
                const script = await response.text();
                const blob = new Blob([script], { type: 'application/javascript' });
                engine = new Worker(URL.createObjectURL(blob));

                engine.onmessage = (e) => {
                    const line = e.data;
                    handleEngineOutput(line);
                };

                engine.postMessage('uci');
                engine.postMessage('setoption name MultiPV value 3');
                engine.postMessage(`setoption name Skill Level value ${engineLevel}`);
                
                resetGame();
            } catch (err) {
                console.error("Failed to load Stockfish:", err);
                endgameStatusEl.innerText = "Failed to load Stockfish engine. Check connection.";
            }
        }

        function handleEngineOutput(line) {
            // Update MultiPV lines and eval
            if (line.includes('info depth') && line.includes('multipv')) {
                const pvMatch = line.match(/multipv (\d+)/);
                const scoreMatch = line.match(/score (cp|mate) (-?\d+)/);
                const pvMovesMatch = line.match(/ pv (.*)/);
                
                if (pvMatch && scoreMatch && pvMovesMatch) {
                    const multipv = parseInt(pvMatch[1]);
                    const type = scoreMatch[1];
                    let val = parseInt(scoreMatch[2]);
                    
                    // Adjust eval for black's perspective if needed, but Stockfish eval is from engine's POV (player to move)
                    if (turn === 'b') val = -val;

                    let scoreStr = "";
                    if (type === 'mate') {
                        scoreStr = `M${Math.abs(val)}`;
                        // Eval bar max out for mate
                        updateEvalBar(val > 0 ? 10 : -10, `M${Math.abs(val)}`);
                    } else {
                        scoreStr = (val / 100).toFixed(2);
                        if (val > 0) scoreStr = "+" + scoreStr;
                        if (multipv === 1) updateEvalBar(val / 100, scoreStr);
                    }

                    currentPV[multipv] = {
                        score: scoreStr,
                        moves: pvMovesMatch[1]
                    };
                    renderEngineOutput();
                }
            }

            if (line.includes('bestmove')) {
                isEngineThinking = false;
                const match = line.match(/bestmove (\S+)/);
                if (match && match[1] !== '(none)') {
                    executeEngineMove(match[1]);
                }
            }
        }

        function updateEvalBar(eval, text) {
            // Sigmoid-like scale for eval bar UI
            // eval = 0 -> 50%
            // eval = +3 -> ~80%
            const percentage = 50 + (50 * (2 / (1 + Math.exp(-0.3 * eval)) - 1));
            const clamped = Math.max(5, Math.min(95, percentage));
            evalBarEl.style.width = `${clamped}%`;
            evalTextEl.innerText = text;
        }

        function renderEngineOutput() {
            if (playMode !== 'analysis') {
                engineOutputEl.innerHTML = '<div style="color:#aaa; text-align:center; margin-top:20px;">Engine analyzing...</div>';
                return;
            }
            let html = '';
            for (let i = 1; i <= 3; i++) {
                if (currentPV[i]) {
                    html += `
                        <div class="engine-line">
                            <div class="engine-score">${currentPV[i].score}</div>
                            <div class="engine-moves">${currentPV[i].moves}</div>
                        </div>
                    `;
                }
            }
            engineOutputEl.innerHTML = html;
        }

        function analyzePosition() {
            if (!engine || gameIsOver) return;
            const fen = generateFEN();
            engine.postMessage('stop');
            engine.postMessage(`position fen ${fen}`);
            
            if (playMode === 'analysis') {
                engine.postMessage('go depth 18');
            }
        }

        function requestEngineMove() {
            if (!engine || gameIsOver) return;
            isEngineThinking = true;
            const fen = generateFEN();
            engine.postMessage('stop');
            engine.postMessage(`position fen ${fen}`);
            
            // Skill levels: Level 1 (depth 1, short time), Level 20 (depth 15, normal time)
            const depth = Math.max(1, Math.floor(engineLevel / 1.5));
            engine.postMessage(`go movetime 1000 depth ${depth}`);
        }

        function forceEngineMove() {
            if (!engine || gameIsOver) return;
            if (isEngineThinking) {
                engine.postMessage('stop'); // Triggers bestmove immediately
            } else {
                requestEngineMove();
            }
        }

        function executeEngineMove(uciMove) {
            const fromAlg = uciMove.substring(0, 2);
            const toAlg = uciMove.substring(2, 4);
            const promotion = uciMove.length === 5 ? uciMove[4] : null;

            const from = algebraicToIndex(fromAlg);
            const to = algebraicToIndex(toAlg);
            
            const legalMoves = getLegalMoves(turn);
            const move = legalMoves.find(m => m.from === from && m.to === to);
            
            if (move) {
                if (promotion) {
                    move.promotion = turn === 'w' ? promotion.toUpperCase() : promotion.toLowerCase();
                }
                makeMove(move);
            } else {
                console.error("Engine generated illegal move:", uciMove);
            }
        }

        // Boot
        initStockfish();

    </script>
</body>
</html>
