<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Emulator Save Patcher</title>
    <style>
        body { font-family: sans-serif; background: #1a1a1a; color: #eee; padding: 20px; text-align: center; }
        button { padding: 15px 30px; font-size: 18px; background: #4CAF50; color: white; border: none; border-radius: 8px; cursor: pointer; margin-top: 20px; }
    </style>
</head>
<body>
    <h1>EmulatorJS Save Patcher</h1>
    <p>Select your offline Emulator HTML file. This will inject the Save Manager into it.</p>
    <button onclick="patchFile()">Select & Patch Emulator File</button>

    <script>
        const PAYLOAD = `
<!-- Injected Save Manager -->
<script>
(function() {
    let currentSaveData = null;
    let currentSaveName = null;

    // Helper: Convert EmulatorJS's data into a real binary Blob for downloading
    function dataToBlob(data) {
        if (data instanceof Blob) return data;
        if (data instanceof ArrayBuffer) return new Blob([data]);
        if (ArrayBuffer.isView(data)) return new Blob([data.buffer]);

        // It's likely {"0": 82, "1": 65...} or a standard array
        if (typeof data === 'object' && data !== null) {
            let length = data.length || Object.keys(data).length;
            let arr = new Uint8Array(length);
            for (let i = 0; i < length; i++) {
                arr[i] = data[i];
            }
            return new Blob([arr], {type: 'application/octet-stream'});
        }
        return new Blob([data]);
    }

    // Helper: Convert an uploaded File into a Uint8Array that Emscripten's writeFile requires
    async function fileToData(file) {
        const buffer = await file.arrayBuffer();
        return new Uint8Array(buffer);
    }

    window.showDownloadPrompt = function(key, data) {
        currentSaveData = data;
        currentSaveName = key;
        document.getElementById('save-ui-text').innerText = 'Save detected: ' + key;
        document.getElementById('custom-save-ui').style.display = 'block';
    };

    const ui = document.createElement('div');
    ui.id = 'custom-save-ui';
    ui.style.cssText = 'position:fixed;bottom:20px;right:20px;z-index:99999;display:none;background:#222;color:#fff;padding:15px;border-radius:10px;border:2px solid #555;font-family:sans-serif;max-width:300px;';
    ui.innerHTML = '<div style="margin-bottom:10px;font-weight:bold;" id="save-ui-text">Save Found!</div><button id="btn-grab-save" style="background:#4CAF50;color:white;border:none;padding:8px 12px;border-radius:4px;margin-right:5px;cursor:pointer;">Download</button><button id="btn-load-save" style="background:#2196F3;color:white;border:none;padding:8px 12px;border-radius:4px;margin-right:5px;cursor:pointer;">Upload Save</button><button id="btn-close-ui" style="background:#f44336;color:white;border:none;padding:8px 12px;border-radius:4px;cursor:pointer;">Close</button>';
    document.body.appendChild(ui);

    document.getElementById('btn-grab-save').onclick = async () => {
        if (!currentSaveData) return;
        const blob = dataToBlob(currentSaveData);
        const fn = currentSaveName.endsWith('.state') ? currentSaveName : currentSaveName + '.state';
        
        if (window.showSaveFilePicker) {
            try {
                const h = await window.showSaveFilePicker({ suggestedName: fn });
                const w = await h.createWritable();
                await w.write(blob);
                await w.close();
                alert('Saved to device!');
            } catch (e) { if (e.name !== 'AbortError') console.error(e); }
        } else {
            const a = document.createElement('a');
            a.href = URL.createObjectURL(blob);
            a.download = fn;
            a.click();
        }
    };

    document.getElementById('btn-load-save').onclick = async () => {
        if (window.showOpenFilePicker) {
            try {
                const [h] = await window.showOpenFilePicker({ types: [{ description: 'Saves', accept: { 'application/octet-stream': ['.state', '.srm'] } }] });
                const file = await h.getFile();
                
                // Convert to Uint8Array
                const uint8Data = await fileToData(file);
                
                const req = indexedDB.open('EmulatorJS-states');
                req.onsuccess = (e) => {
                    const db = e.target.result;
                    const tx = db.transaction('states', 'readwrite');
                    tx.objectStore('states').put(uint8Data, file.name);
                    alert('Uploaded ' + file.name + '! Restart game to load.');
                };
            } catch (e) { if (e.name !== 'AbortError') console.error(e); }
        }
    };

    document.getElementById('btn-close-ui').onclick = () => { ui.style.display = 'none'; };

    const originalPut = IDBObjectStore.prototype.put;
    IDBObjectStore.prototype.put = function(value, key) {
        if (this.transaction && this.transaction.db && this.transaction.db.name === 'EmulatorJS-states' && this.name === 'states') {
            if (typeof key === 'string' && key.endsWith('.state')) {
                console.log("EmulatorJS save intercepted!", key);
                window.showDownloadPrompt(key, value);
            }
        }
        return originalPut.call(this, value, key);
    };
})();
<\/script>
<!-- End Injected Save Manager -->`;

        async function patchFile() {
            try {
                const [handle] = await window.showOpenFilePicker({
                    types: [{ description: 'HTML Files', accept: { 'text/html': ['.html', '.htm'] } }]
                });

                const file = await handle.getFile();
                let htmlContent = await file.text();

                if (htmlContent.includes('</body>')) {
                    htmlContent = htmlContent.replace('</body>', PAYLOAD + '\n</body>');
                } else {
                    htmlContent += PAYLOAD;
                }

                const writable = await handle.createWritable();
                await writable.write(htmlContent);
                await writable.close();

                alert('Success! The save manager has been injected. Open your emulator file to play!');
            } catch (e) {
                if (e.name !== 'AbortError') {
                    alert('Error patching file: ' + e.message);
                }
            }
        }
    </script>
</body>
</html>
