      function cn(...classes) {
        return classes.filter(Boolean).join(" ");

      function useLocalStorage(key, initialValue) {
        const [storedValue, setStoredValue] = useState(() => {
          try {
            const item = window.localStorage.getItem(key);
            return item ? JSON.parse(item) : initialValue;
          } catch {
            return initialValue;
          }
        });

        const setValue = (value) => {
          try {
            const valueToStore =
              value instanceof Function ? value(storedValue) : value;
            setStoredValue(valueToStore);
            window.localStorage.setItem(key, JSON.stringify(valueToStore));
          } catch {}
        };

        return [storedValue, setValue];
      }

      // Helpers to avoid rendering objects directly
      function normalizeAC(val) {
        if (val == null) return undefined;
        if (Array.isArray(val)) {
          const first = val[0];
          if (typeof first === "object" && first !== null) {
            return first.value ?? first.base ?? first.default ?? "";
          }
          return first;
        }
        if (typeof val === "object") {
          return val.value ?? val.base ?? val.default ?? "";
        }
        return val;
      }

          async function fetchOpen5eList(categoryId, searchTerm = "") {
  const meta = OPEN5E_ENDPOINTS[categoryId];
  if (!meta) return [];
  
  const plainUrls = {
    spells: "https://api.open5e.com/v2/spells/?limit=100",
    spelllist: "https://api.open5e.com/v1/spelllist/?limit=100",
    monsters: "https://api.open5e.com/v1/monsters/?limit=100",
    documents: "https://api.open5e.com/v2/documents/?limit=100",
    backgrounds: "https://api.open5e.com/v2/backgrounds/?limit=100",
    planes: "https://api.open5e.com/v1/planes/?limit=100",
    sections: "https://api.open5e.com/v1/sections/?limit=100",
    feats: "https://api.open5e.com/v2/feats/?limit=100",
    conditions: "https://api.open5e.com/v2/conditions/?limit=100",
    races: "https://api.open5e.com/v1/races/?limit=100",
    classes: "https://api.open5e.com/v1/classes/?limit=100",
    magicitems: "https://api.open5e.com/v1/magicitems/?limit=100",
    weapons: "https://api.open5e.com/v2/weapons/?limit=100",
    armor: "https://api.open5e.com/v2/armor/?limit=100",
  };

    async function searchSpells(query) {
    const response = await fetch(`https://api.open5e.com/v2/spells/?search=${encodeURIComponent(query)}&limit=20`);
    const data = await response.json();
    return data.results || [];
}

              
  let url = plainUrls[categoryId];
  
  // Category-specific search parameters
  if (searchTerm) {
    if (categoryId === 'spells') {
      url += `&name=${encodeURIComponent(searchTerm)}`;
    } else if (categoryId === 'monsters') {
      url += `&search=${encodeURIComponent(searchTerm)}`;
    } else {
      url += `&search=${encodeURIComponent(searchTerm)}`;
    }
  }
  
  if (!url) return [];
  
  try {
    const res = await fetch(url);
    const text = await res.text();
    
    if (!res.ok || text.includes('<!DOCTYPE')) {
      return [];
    }
    
    const data = JSON.parse(text);
    const results = data.results || [];
    const key = meta.itemKey || "slug";

    return results.map((item, idx) => {
      const slug = item[key] || item.slug || String(idx);
      return {
        name: item.name || item.title || item.slug || `Item ${idx + 1}`,
        index: slug,
        categoryId,
        _raw: item,
      };
    });
  } catch (error) {
    return [];
  }
}






      async function fetchOpen5eDetail(listItem) {
        const raw = listItem._raw || {};
        if (!listItem.detailUrl) return raw;
        try {
          const res = await fetch(listItem.detailUrl);
          if (res.ok) {
            return res.json();
          }
        } catch (e) {}
        return raw;
      }

      function CompendiumView({ sidebarOpen, setSidebarOpen, onAddToCombat }) {
        const [category, setCategory] = useLocalStorage(
          "dm-grimoire-category",
          CATEGORIES[0]?.id || "spells"
        );
        const [list, setList] = useState([]);
        const [loading, setLoading] = useState(false);
        const [search, setSearch] = useState("");
        const [openBlocks, setOpenBlocks] = useLocalStorage(
          "dm-grimoire-blocks",
          []
        );

                useEffect(() => {
  const timeoutId = setTimeout(async () => {
    let active = true;
    setLoading(true);
    
    let data = [];
    
    if (category === 'spells' && search.length > 1) {
      const response = await fetch(
        `https://api.open5e.com/v2/spells/?search=${encodeURIComponent(search)}&limit=20`
      );
      const apiData = await response.json();
      
      // FILTER OUT 3rd-party - keep ONLY core spells
      data = apiData.results.filter(spell => 
        !spell.document.key.includes('deepm') && 
        !spell.document.key.includes('wz') && 
        !spell.document.key.includes('a5e')
      ) || [];
    } else {
      data = await fetchOpen5eList(category, search);
    }
    
    if (!active) return;
    setList(data || []);
    setLoading(false);
  }, 300);
  
  return () => clearTimeout(timeoutId);
}, [category, search]);









        const filteredList = useMemo(

              item.name.toLowerCase().includes(search.toLowerCase())

          [list, search]

        const openDetail = async (item) => {

              : React.createElement(

                      "grid grid-cols-1 lg:grid-cols-2 xl:grid-cols-3 gap-4 items-start pb-20",
                  },
                  openBlocks.map((block) =>
                    React.createElement(DetailCard, {
                      key: block.index,
                      data: block,
                      onClose: () =>
                        setOpenBlocks((prev) =>
                          prev.filter((b) => b.index !== block.index)

      }

      function DetailCard({ data, onClose, onAddToCombat }) {
        const scores = ["STR", "DEX", "CON", "INT", "WIS", "CHA"];

        const isMonster =
          data.type === "monster" ||
          data.categoryId === "monsters" ||
          data.challenge_rating !== undefined ||
          data.cr !== undefined ||
          data.hit_points !== undefined;
        const isSpell =
          data.categoryId === "spells" ||
          data.spell_level !== undefined ||
          data.level !== undefined ||
          data.spell_level === 0;
        const isFeatLike =
          data.categoryId === "feats" ||
          data.prerequisite !== undefined ||
          data.prerequisites !== undefined;
        const isClassLike =
          data.categoryId === "classes" || data.hit_die !== undefined;

        const cr =
          data.challenge_rating !== undefined
            ? data.challenge_rating
            : data.cr !== undefined
            ? data.cr
            : undefined;

        const hp = data.hit_points || data.hp || undefined;

        const rawAC = data.armor_class ?? data.ac;
        const ac = normalizeAC(rawAC);

        const speed = data.speed;

        const documentTitle = data.document__title || data.document__slug;

        const fullText =
          data.full_text ||
          (Array.isArray(data.desc) ? data.desc.join("\n\n") : data.desc) ||
          data.description;

        const abilityScores =
          data.str !== undefined ||
          data.dex !== undefined ||
          data.con !== undefined ||
          data.int !== undefined ||
          data.wis !== undefined ||
          data.cha !== undefined ||
          (data.strength !== undefined && data.dexterity !== undefined);

        const getScore = (label) => {
          switch (label) {
            case "STR":
              return data.strength ?? data.str;
            case "DEX":
              return data.dexterity ?? data.dex;
            case "CON":
              return data.constitution ?? data.con;
            case "INT":
              return data.intelligence ?? data.int;
            case "WIS":
              return data.wisdom ?? data.wis;
            case "CHA":
              return data.charisma ?? data.cha;
            default:
              return undefined;
          }
        };

        return React.createElement(
          Card,
          {
            className:
              "relative overflow-hidden group border-muted bg-card/95 hover:bg-card transition-colors",
          },
          React.createElement(
            Button,
            {
              variant: "ghost",
              size: "icon",

                "absolute right-2 top-2 h-7 w-7 opacity-0 group-hover:opacity-100 transition-opacity text-muted-foreground",

                        "text-muted-foreground font-bold uppercase text-[11px]",

                          width: `${Math.max(
                            0,
                            Math.min(100, (c.hp / c.maxHp) * 100)
                          )}%`,
                        },
                      })
                    )
                  ),
                  React.createElement(
                    "div",
                    { className: "flex items-center gap-1.5" },
                    React.createElement(
                      Button,
                      {
                        variant: "outline",
                        size: "icon",
                        className: "h-8 w-8 rounded-full",
                        onClick: () => updateHp(c.id, -1),
                      },
                      "−"
                    ),
                    React.createElement(
                      Button,
                      {
                        variant: "outline",
                        size: "icon",
                        className: "h-8 w-8 rounded-full",
                        onClick: () => updateHp(c.id, 1),
                      },
                      "+"
                    ),
                    React.createElement(
                      Button,
                      {
                        variant: "ghost",
                        size: "icon",
                        className:
                          "h-8 w-8 text-muted-foreground",
                        onClick: () =>
                          setCombatants((prev) =>
                            prev.filter((u) => u.id !== c.id)
                          ),
                      },
                      "✕"
                    )
                  )
                )
              )
            )
          )
        );
      }

      function App() {
        const [activeTab, setActiveTab] = useLocalStorage(
          "dm-grimoire-tab",
          "compendium"
        );
        const [sidebarOpen, setSidebarOpen] = useState(true);
        const [combatants, setCombatants] = useLocalStorage(
          "dm-grimoire-combatants",
          []
        );

        const tabs = ["compendium", "dice", "combat"];
        const startXRef = useRef(null);
        const startYRef = useRef(null);

        const handleTouchStart = (e) => {
          const touch = e.touches[0];
          startXRef.current = touch.clientX;
          startYRef.current = touch.clientY;
        };

        const handleTouchEnd = (e) => {
          if (startXRef.current == null || startYRef.current == null) return;
          const touch = e.changedTouches[0];
          const dx = touch.clientX - startXRef.current;
          const dy = touch.clientY - startYRef.current;

          if (Math.abs(dx) < 40 || Math.abs(dx) < Math.abs(dy)) {
            startXRef.current = null;
            startYRef.current = null;
            return;
          }

          const currentIndex = tabs.indexOf(activeTab);
          if (dx < 0 && currentIndex < tabs.length - 1) {
            setActiveTab(tabs[currentIndex + 1]);
          } else if (dx > 0 && currentIndex > 0) {
            setActiveTab(tabs[currentIndex - 1]);
          }

          startXRef.current = null;
          startYRef.current = null;
        };

        useEffect(() => {
          document.documentElement.className = "";
        }, []);

        const addMonsterToCombat = (monster) => {
          const dex =
            monster.dexterity ??
            monster.dex ??
            10;
          const initMod = Math.floor((dex - 10) / 2);
          const initRoll =
            Math.floor(Math.random() * 20) + 1 + initMod;

          const hp =
            monster.hit_points ||
            monster.hp ||
            10;

          const armorValue =
            normalizeAC(monster.armor_class ?? monster.ac) || 10;

          const c = {
            id: crypto.randomUUID(),
            name: monster.name || "Monster",
            init: initRoll,
            hp,
            maxHp: hp,
            ac: armorValue,
          };

          setCombatants((prev) =>
            [...prev, c].sort((a, b) => b.init - a.init)
          );
          setActiveTab("combat");
        };

        return React.createElement(
          "div",
          {
            className:
              "flex flex-col h-screen w-full bg-background text-foreground overflow-hidden",
          },
          React.createElement(
            "header",
            {
              className:
                "flex-none h-14 border-b border-muted bg-card/90 backdrop-blur-md px-4 flex items-center justify-between z-50",
            },
            React.createElement(
              "div",
              { className: "flex items-center gap-3" },
              React.createElement(
                Button,
                {
                  variant: "ghost",
                  size: "icon",
                  className: "md:hidden text-lg",
                  onClick: () => setSidebarOpen(!sidebarOpen),
                },
                sidebarOpen ? "✕" : "☰"
              ),
              React.createElement(
                "div",
                { className: "flex items-center gap-2 text-primary" },
                React.createElement("span", { className: "text-lg" }, "📖"),
                React.createElement(
                  "h1",
                  {
                    className:
                      "font-serif font-bold text-lg tracking-wide hidden sm:block",
                  },
                  "DMs Grimoire"
                )
              )
            ),
            React.createElement(
              "nav",
              {
                className:
                  "hidden md:flex items-center gap-1 bg-muted/40 p-1 rounded-full border border-muted/60",
              },
              tabs.map((tab) =>
                React.createElement(
                  "button",
                  {
                    key: tab,
                    onClick: () => setActiveTab(tab),
                    className: cn(
                      "flex items-center px-4 py-1.5 rounded-full text-sm font-medium transition-all capitalize",
                      activeTab === tab
                        ? "bg-background text-foreground shadow-sm ring-1 ring-border"
                        : "text-muted-foreground hover:text-foreground hover:bg-background/40"
                    ),
                  },
                  tab === "compendium"
                    ? "Compendium"
                    : tab === "dice"
                    ? "Dice Tray"
                    : "Combat"
                )
              )
            )
          ),
          React.createElement(
            "main",
            {
              className: "flex-1 flex min-h-0 relative pb-14",
              onTouchStart: handleTouchStart,
              onTouchEnd: handleTouchEnd,
            },
            activeTab === "compendium" &&
              React.createElement(CompendiumView, {
                sidebarOpen,
                setSidebarOpen,
                onAddToCombat: addMonsterToCombat,
              }),
            activeTab === "dice" && React.createElement(DiceTrayView, null),
            activeTab === "combat" &&
              React.createElement(CombatTrackerView, {
                combatants,
                setCombatants,
              })
          ),
          React.createElement(
            "nav",
            {
              className:
                "md:hidden fixed bottom-0 left-0 right-0 h-14 border-t border-muted bg-card/95 flex items-center justify-around px-2 z-40",
            },
            tabs.map((tab) =>
              React.createElement(
                "button",
                {
                  key: tab,
                  onClick: () => setActiveTab(tab),
                  className: cn(
                    "flex flex-col items-center justify-center w-full h-full gap-1 text-[11px] font-medium capitalize",
                    activeTab === tab
                      ? "text-primary"
                      : "text-muted-foreground"
                  ),
                },
                React.createElement(
                  "span",
                  null,
                  tab === "compendium"
                    ? "Compendium"
                    : tab === "dice"
                    ? "Dice"
                    : "Combat"
                )
              )
            )
          )
        );
      }

      const root = ReactDOM.createRoot(document.getElementById("root"));
      root.render(React.createElement(App));
    </script>
  </body>
</html>
