    // Auth functions
    async function signIn() {
      const token = document.getElementById('tokenInput').value.trim();
      if (!token) {
        showToast('Please enter a token', 'error');
        return;
      }

      state.token = token;
      state.api = new GitHubAPI(token);

      try {
        state.user = await state.api.getUser();
        localStorage.setItem('github_token', token);
        showToast('Signed in successfully', 'success');
        render();
      } catch (e) {
        state.token = null;
        state.api = null;
        showToast('Invalid token: ' + e.message, 'error');
      }
    }

    function signOut() {
      state.token = null;
      state.user = null;
      state.api = null;
      localStorage.removeItem('github_token');
      render();
    }

    // Actions
    async function toggleStar(owner, name, isStarred) {
      try {
        if (isStarred) {
          await state.api.unstarRepo(owner, name);
          showToast('Unstarred ' + name, 'success');
        } else {
          await state.api.starRepo(owner, name);
          showToast('Starred ' + name, 'success');
        }
        state.viewData.isStarred = !isStarred;
        render();
      } catch (e) {
        showToast('Failed: ' + e.message, 'error');
      }
    }

    async function forkRepo(owner, name) {
      try {
        await state.api.forkRepo(owner, name);
        showToast('Forked ' + name, 'success');
      } catch (e) {
        showToast('Failed to fork: ' + e.message, 'error');
      }
    }

    async function addComment() {
      const body = document.getElementById('commentBody')?.value.trim();
      if (!body) return;

      try {
        const {
          owner,
          name,
          number
        } = state.currentIssue;
        await state.api.createIssueComment(owner, name, number, body);
        showToast('Comment added', 'success');
        state.viewData = null;
        loadIssue();
      } catch (e) {
        showToast('Failed: ' + e.message, 'error');
      }
    }

    // Search
    function setSearchType(type) {
      state.searchType = type;
      state.searchPage = 1;
      render();
    }

    function handleSearchSubmit(event) {
      event.preventDefault();
      const searchInput = document.getElementById('searchInput');
      const query = searchInput?.value.trim();
      if (query) {
        state.lastSearchQuery = query;
        state.searchPage = 1;
        performSearch(query);
      }
    }

    async function performSearch(query) {
      try {
        let allResults = [];

        // Fetch first 5 pages (150 results total)
        for (let page = 1; page <= 5; page++) {
          try {
            if (state.searchType === 'repositories') {
              const pageResults = await state.api.searchRepos(query, page);
              if (!pageResults.items || pageResults.items.length === 0) break;
              allResults = allResults.concat(pageResults.items);
            } else {
              const pageResults = await state.api.searchUsers(query, page);
              if (!pageResults.items || pageResults.items.length === 0) break;
              allResults = allResults.concat(pageResults.items);
            }
          } catch (e) {
            break;
          }
        }

        state.searchResults = {
          items: allResults,
          total_count: allResults.length
        };
        state.filterDropdownOpen = false;
        render();
      } catch (e) {
        showToast('Search failed: ' + e.message, 'error');
      }
    }

    function updateSearchFilter(filterName, value) {
      state.searchFilters[filterName] = value || null;
      state.searchPage = 1;
      render();
    }

    // Modals
    function showModal(title, content, footer) {
      const modal = document.createElement('div');
      modal.className = 'modal-overlay active';
      modal.innerHTML = `
                <div class="modal">
                    <div class="modal-header">
                        <span class="modal-title">${title}</span>
                        <button class="modal-close" onclick="closeModal()">&times;</button>
                    </div>
                    <div class="modal-body">${content}</div>
                    ${footer ? `<div class="modal-footer">${footer}</div>` : ''}
                </div>
            `;
      document.body.appendChild(modal);
    }

    function closeModal() {
      document.querySelector('.modal-overlay')?.remove();
    }

    function showCreateRepoModal() {
      showModal('Create Repository', `
                <div class="input-group">
                    <label class="input-label">Repository Name</label>
                    <input type="text" class="input" id="repoName" placeholder="my-awesome-project">
                </div>
                <div class="input-group">
                    <label class="input-label">Description (optional)</label>
                    <input type="text" class="input" id="repoDescription" placeholder="A short description">
                </div>
                <label class="checkbox-label">
                    <input type="checkbox" id="repoPrivate">
                    <span>Private repository</span>
                </label>
                <label class="checkbox-label">
                    <input type="checkbox" id="repoReadme">
                    <span>Initialize with README</span>
                </label>
            `, `
                <button class="btn btn-secondary" onclick="closeModal()">Cancel</button>
                <button class="btn btn-primary" onclick="createRepo()">Create</button>
            `);
    }

    async function createRepo() {
      const name = document.getElementById('repoName')?.value.trim();
      if (!name) {
        showToast('Repository name is required', 'error');
        return;
      }

      try {
        const repo = await state.api.createRepo({
          name,
          description: document.getElementById('repoDescription')?.value.trim() || '',
          private: document.getElementById('repoPrivate')?.checked || false,
          auto_init: document.getElementById('repoReadme')?.checked || false
        });
        closeModal();
        showToast('Repository created', 'success');
        openRepo(repo.owner.login, repo.name);
      } catch (e) {
        showToast('Failed: ' + e.message, 'error');
      }
    }

    function showCreateIssueModal() {
      showModal('New Issue', `
                <div class="input-group">
                    <label class="input-label">Title</label>
                    <input type="text" class="input" id="issueTitle" placeholder="Issue title">
                </div>
                <div class="input-group">
                    <label class="input-label">Description</label>
                    <textarea class="textarea" id="issueBody" placeholder="Describe the issue..."></textarea>
                </div>
            `, `
                <button class="btn btn-secondary" onclick="closeModal()">Cancel</button>
                <button class="btn btn-primary" onclick="createIssue()">Create Issue</button>
            `);
    }

    async function createIssue() {
      const title = document.getElementById('issueTitle')?.value.trim();
      if (!title) {
        showToast('Title is required', 'error');
        return;
      }

      try {
        const {
          owner,
          name
        } = state.currentRepo;
        await state.api.createIssue(owner, name, {
          title,
          body: document.getElementById('issueBody')?.value.trim() || ''
        });
        closeModal();
        showToast('Issue created', 'success');
        state.viewData.issues = null;
        render();
      } catch (e) {
        showToast('Failed: ' + e.message, 'error');
      }
    }

    function showCreateFileModal() {
      const path = state.currentPath.join('/');
      showModal('Create File', `
                <div class="input-group">
                    <label class="input-label">File Path</label>
                    <input type="text" class="input" id="filePath" placeholder="${path ? path + '/' : ''}filename.txt">
                </div>
                <div class="input-group">
                    <label class="input-label">Content</label>
                    <textarea class="textarea" id="fileContent" style="min-height: 200px; font-family: monospace;"></textarea>
                </div>
                <div class="input-group">
                    <label class="input-label">Commit Message</label>
                    <input type="text" class="input" id="commitMessage" placeholder="Create filename.txt">
                </div>
            `, `
                <button class="btn btn-secondary" onclick="closeModal()">Cancel</button>
                <button class="btn btn-primary" onclick="createFile()">Commit</button>
            `);
    }

    async function createFile() {
      const path = document.getElementById('filePath')?.value.trim();
      const content = document.getElementById('fileContent')?.value || '';
      const message = document.getElementById('commitMessage')?.value.trim() || `Create ${path}`;

      if (!path) {
        showToast('File path is required', 'error');
        return;
      }

      try {
        const {
          owner,
          name
        } = state.currentRepo;
        await state.api.createOrUpdateFile(owner, name, path, {
          message,
          content: btoa(content)
        });
        closeModal();
        showToast('File created', 'success');
        state.viewData = null;
        loadRepo();
      } catch (e) {
        showToast('Failed: ' + e.message, 'error');
      }
    }

    function editFile() {
      const content = atob(state.viewData.file.content);
      showModal('Edit File', `
                <div class="input-group">
                    <label class="input-label">Content</label>
                    <textarea class="textarea" id="editFileContent" style="min-height: 300px; font-family: monospace;">${escapeHtml(content)}</textarea>
                </div>
                <div class="input-group">
                    <label class="input-label">Commit Message</label>
                    <input type="text" class="input" id="editCommitMessage" placeholder="Update ${state.viewData.file.name}">
                </div>
            `, `
                <button class="btn btn-secondary" onclick="closeModal()">Cancel</button>
                <button class="btn btn-primary" onclick="saveFile()">Commit Changes</button>
            `);
    }

    async function saveFile() {
      const content = document.getElementById('editFileContent')?.value || '';
      const message = document.getElementById('editCommitMessage')?.value.trim() || `Update ${state.currentFile.path}`;

      try {
        const {
          owner,
          name,
          path
        } = state.currentFile;
        await state.api.createOrUpdateFile(owner, name, path, {
          message,
          content: btoa(unescape(encodeURIComponent(content))),
          sha: state.viewData.file.sha
        });
        closeModal();
        showToast('File updated', 'success');
        state.viewData = null;
        openFile(owner, name, path);
      } catch (e) {
        showToast('Failed: ' + e.message, 'error');
      }
    }

    async function deleteCurrentFile() {
      if (!confirm('Are you sure you want to delete this file?')) return;

      try {
        const {
          owner,
          name,
          path
        } = state.currentFile;
        await state.api.deleteFile(owner, name, path, {
          message: `Delete ${path}`,
          sha: state.viewData.file.sha
        });
        showToast('File deleted', 'success');
        openRepo(owner, name);
      } catch (e) {
        showToast('Failed: ' + e.message, 'error');
      }
    }

    function showCreateGistModal() {
      showModal('Create Gist', `
                <div class="input-group">
                    <label class="input-label">Description (optional)</label>
                    <input type="text" class="input" id="gistDescription" placeholder="What's this gist about?">
                </div>
                <div class="input-group">
                    <label class="input-label">Filename</label>
                    <input type="text" class="input" id="gistFilename" placeholder="example.txt">
                </div>
                <div class="input-group">
                    <label class="input-label">Content</label>
                    <textarea class="textarea" id="gistContent" style="min-height: 200px; font-family: monospace;"></textarea>
                </div>
                <label class="checkbox-label">
                    <input type="checkbox" id="gistPublic" checked>
                    <span>Public gist</span>
                </label>
            `, `
                <button class="btn btn-secondary" onclick="closeModal()">Cancel</button>
                <button class="btn btn-primary" onclick="createGist()">Create Gist</button>
            `);
    }

    async function createGist() {
      const filename = document.getElementById('gistFilename')?.value.trim() || 'file.txt';
      const content = document.getElementById('gistContent')?.value || '';

      try {
        await state.api.createGist({
          description: document.getElementById('gistDescription')?.value.trim() || '',
          public: document.getElementById('gistPublic')?.checked || true,
          files: {
            [filename]: {
              content
            }
          }
        });
        closeModal();
        showToast('Gist created', 'success');
        state.viewData = null;
        loadGists();
      } catch (e) {
        showToast('Failed: ' + e.message, 'error');
      }
    }

    async function deleteCurrentGist(id) {
      if (!confirm('Are you sure you want to delete this gist?')) return;

      try {
        await state.api.deleteGist(id);
        showToast('Gist deleted', 'success');
        navigate('gists');
      } catch (e) {
        showToast('Failed: ' + e.message, 'error');
      }
    }

    async function viewUserProfile(username) {
      try {
        state.viewData = await state.api.getUserProfile(username);
        state.currentView = 'profile';
        pushHistory();
        render();
      } catch (e) {
        showToast('Failed to load profile: ' + e.message, 'error');
      }
    }

    async function viewOrgRepos(org) {
      try {
        state.viewData = await state.api.getOrgRepos(org);
        state.currentView = 'repos';
        pushHistory();
        render();
      } catch (e) {
        showToast('Failed to load repos: ' + e.message, 'error');
      }
    }

    // Utilities
    function escapeHtml(text) {
      if (!text) return '';
      const div = document.createElement('div');
      div.textContent = text;
      return div.innerHTML;
    }

    function timeAgo(date) {
      const seconds = Math.floor((new Date() - new Date(date)) / 1000);
      const intervals = [{
          label: 'year',
          seconds: 31536000
        },
        {
          label: 'month',
          seconds: 2592000
        },
        {
          label: 'day',
          seconds: 86400
        },
        {
          label: 'hour',
          seconds: 3600
        },
        {
          label: 'minute',
          seconds: 60
        }
      ];

      for (const interval of intervals) {
        const count = Math.floor(seconds / interval.seconds);
        if (count >= 1) {
          return `${count} ${interval.label}${count > 1 ? 's' : ''} ago`;
        }
      }
      return 'just now';
    }

    function formatBytes(bytes) {
      if (bytes < 1024) return bytes + ' B';
      if (bytes < 1024 * 1024) return (bytes / 1024).toFixed(1) + ' KB';
      return (bytes / (1024 * 1024)).toFixed(1) + ' MB';
    }

    // Initialize
    render();

  </script>
</body>

</html>
