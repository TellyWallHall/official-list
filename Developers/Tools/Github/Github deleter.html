<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GitHub File Deleter</title>
<style>
  body { font-family: system-ui, sans-serif; background:#0f172a; color:#e2e8f0; padding:1.5rem; max-width:800px; margin:auto; }
  input, select, button, textarea { width:100%; padding:0.6rem; margin:0.5rem 0; border-radius:8px; border:1px solid #334155; background:#1e293b; color:#e2e8f0; }
  button { background:#3b82f6; cursor:pointer; border:none; }
  button:disabled { background:#475569; cursor:not-allowed; }
  button.danger { background:#ef4444; }
 .row { display:flex; gap:0.5rem; }
 .log { background:#0b1224; padding:1rem; border-radius:8px; font-family:monospace; font-size:0.85rem; max-height:300px; overflow:auto; }
 .warn { color:#fbbf24; font-size:0.9rem; }
</style>
</head>
<body>


<h1>GitHub File Deleter</h1>
<p class="warn">This uses your PAT in the browser. Don't use it on shared computers. PAT is NOT saved.</p>


<div>
  <label>GitHub PAT - needs `repo` scope</label>
  <input id="pat" type="password" placeholder="ghp_xxxxxxxxxxxx">


  <div class="row">
    <button onclick="loadRepos()">1. Load Repos</button>
    <button onclick="loadTree()" id="loadTreeBtn" disabled>2. Load Files</button>
  </div>


  <label>Select Repo</label>
  <select id="repos"><option>Load repos first</option></select>


  <label>Select File - only files, not folders</label>
  <select id="files"><option>Load files first</option></select>


  <label>Commit message</label>
  <input id="commitMsg" value="Delete file via web tool">


  <button class="danger" onclick="deleteFile()" id="deleteBtn" disabled>3. DELETE FILE</button>
</div>


<h3>Log</h3>
<div class="log" id="log"></div>


<script>
let selectedRepo = null;
let selectedFileSha = null;
let defaultBranch = 'main';


function log(msg) {
  document.getElementById('log').innerHTML += `[${new Date().toLocaleTimeString()}] ${msg}\n`;
}


async function gh(path, method='GET', body=null) {
  const pat = document.getElementById('pat').value.trim();
  if(!pat) throw new Error('PAT missing');
  const res = await fetch('https://api.github.com' + path, {
    method,
    headers: {
      'Authorization': `Bearer ${pat}`,
      'Accept': 'application/vnd.github+json',
      'X-GitHub-Api-Version': '2022-11-28'
    },
    body: body? JSON.stringify(body) : null
  });
  if(!res.ok) throw new Error(await res.text());
  return res.json();
}


async function loadRepos() {
  try {
    log('Loading repos...');
    const repos = await gh('/user/repos?per_page=100&sort=updated');
    const sel = document.getElementById('repos');
    sel.innerHTML = '';
    repos.forEach(r => {
      const opt = document.createElement('option');
      opt.value = r.full_name;
      opt.textContent = r.full_name;
      sel.appendChild(opt);
    });
    document.getElementById('loadTreeBtn').disabled = false;
    log(`Loaded ${repos.length} repos`);
  } catch(e) { log('Error: ' + e.message) }
}


async function loadTree() {
  try {
    selectedRepo = document.getElementById('repos').value;
    log(`Loading file tree for ${selectedRepo}...`);
    const repoInfo = await gh(`/repos/${selectedRepo}`);
    defaultBranch = repoInfo.default_branch;


    const branch = await gh(`/repos/${selectedRepo}/branches/${defaultBranch}`);
    const treeSha = branch.commit.commit.tree.sha;


    const tree = await gh(`/repos/${selectedRepo}/git/trees/${treeSha}?recursive=1`);


    const fileSel = document.getElementById('files');
    fileSel.innerHTML = '';
    const files = tree.tree.filter(i => i.type === 'blob');
    files.forEach(f => {
      const opt = document.createElement('option');
      opt.value = f.path + '|' + f.sha;
      opt.textContent = f.path;
      fileSel.appendChild(opt);
    });
    document.getElementById('deleteBtn').disabled = false;
    log(`Loaded ${files.length} files from ${defaultBranch}`);
  } catch(e) { log('Error: ' + e.message) }
}


async function deleteFile() {
  if(!confirm('Are you sure you want to DELETE this file? This cannot be undone.')) return;
  try {
    const [path, sha] = document.getElementById('files').value.split('|');
    const msg = document.getElementById('commitMsg').value;
    log(`Deleting ${path}...`);


    await gh(`/repos/${selectedRepo}/contents/${encodeURIComponent(path)}`, 'DELETE', {
      message: msg,
      sha: sha,
      branch: defaultBranch
    });
    log(`Deleted ${path} successfully`);
    loadTree(); // refresh list
  } catch(e) { log('Error: ' + e.message) }
}


// update selected file sha when dropdown changes
document.getElementById('files').addEventListener('change', e => {
  selectedFileSha = e.target.value.split('|')[1];
});
</script>


</body>
</html>
